<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백 투 더 퓨처(Back to the Future) 뮤지컬 전곡 영한 대역 뷰어</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14171f;
      --neon-orange: #ff7700;
      --neon-cyan: #00e5ff;
      --neon-yellow: #ffcc00;
      --neon-red: #ff3344;
      --text: #e8ecf2;
      --text-muted: #8c96a8;
      --border: #222736;
      --hover: #1c212e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    #sidebar {
      width: 330px;
      background: #0f1118;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      background: #0c0e14;
      text-align: center;
    }
    .sidebar-header h1 {
      font-size: 1.15rem;
      background: linear-gradient(45deg, #ff7700, #ffcc00, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .sidebar-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #181c26;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--neon-cyan); }
    .act-tabs {
      display: flex;
      padding: 6px 12px;
      gap: 6px;
      background: #0c0e14;
      border-bottom: 1px solid var(--border);
    }
    .act-tab {
      flex: 1;
      padding: 6px 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .act-tab.active {
      background: rgba(0, 229, 255, 0.12);
      color: var(--neon-cyan);
      border-color: rgba(0, 229, 255, 0.35);
      font-weight: 700;
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .song-item {
      padding: 10px 12px;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: #141722;
    }
    .song-item:hover {
      background: var(--hover);
      border-color: rgba(255, 119, 0, 0.3);
    }
    .song-item.active {
      background: rgba(255, 119, 0, 0.15);
      border-color: var(--neon-orange);
    }
    .song-num {
      font-size: 0.72rem;
      color: var(--neon-yellow);
      font-weight: 700;
    }
    .song-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
    }
    .song-title-kr {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .top-bar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: #0f1118;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 6px 14px;
      background: #181c26;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--neon-orange);
      color: #fff;
      font-weight: 700;
      border-color: var(--neon-orange);
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.4);
    }
    .song-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .song-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .song-header h2 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 800;
    }
    .song-header h2 .kr-title {
      color: var(--neon-cyan);
      margin-left: 10px;
      font-size: 1.3rem;
      font-weight: 600;
    }
    .synopsis-box {
      background: var(--card-bg);
      border-left: 4px solid var(--neon-orange);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .notes-box {
      background: #101522;
      border: 1px solid #1f2a3f;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }
    .notes-box h4 {
      font-size: 0.9rem;
      color: var(--neon-yellow);
      margin-bottom: 10px;
    }
    .notes-box ul {
      padding-left: 20px;
      font-size: 0.86rem;
      color: #b0bbd0;
    }
    .notes-box li {
      margin-bottom: 6px;
    }
    /* Stanzas */
    .stanza-block {
      margin-bottom: 24px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .speaker-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--neon-cyan);
      background: rgba(0, 229, 255, 0.12);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 229, 255, 0.25);
    }
    .lyric-pair {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .lyric-en {
      font-weight: 700;
      color: #ffffff;
      font-size: 0.96rem;
    }
    .lyric-kr {
      color: #79d7ff;
      font-size: 0.92rem;
      margin-top: 2px;
    }
    .mode-kr-only .lyric-en { display: none; }
    .mode-en-only .lyric-kr { display: none; }

    /* Navigation & Mobile Drawer */
    .nav-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-yellow);
      text-decoration: none;
      font-size: 0.82rem;
      margin-bottom: 8px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .nav-home-link:hover { opacity: 1; text-decoration: underline; }
    .mobile-nav-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #0f121a;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu-btn {
      background: rgba(255, 119, 0, 0.15);
      border: 1px solid var(--neon-orange);
      color: #ffaa55;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 998;
    }
    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .mobile-nav-bar {
        display: flex;
      }
      .sidebar-close-btn {
        display: block;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 82%;
        max-width: 320px;
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: 4px 0 24px rgba(0,0,0,0.8);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .top-bar {
        padding: 10px 14px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .view-toggles {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      .view-btn {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        font-size: 0.75rem;
      }
      .song-content {
        padding: 20px 16px;
      }
      .song-header h2 {
        font-size: 1.35rem;
      }
      .song-header h2 .kr-title {
        display: block;
        margin-left: 0;
        margin-top: 4px;
        font-size: 1.05rem;
      }
      .lyric-en {
        font-size: 0.92rem;
      }
      .lyric-kr {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
      <a href="../index.html" class="nav-home-link">← 라이브러리 홈</a>
      <h1>⚡ BACK TO THE FUTURE ⚡</h1>
      <p>전 26곡 공식 영한 대역 뷰어</p>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목, 캐릭터, 가사 검색..." oninput="renderSongList()">
    </div>
    <div class="act-tabs">
      <button class="act-tab active" onclick="setActFilter('all')">전체 (26)</button>
      <button class="act-tab" onclick="setActFilter(1)">1막 (13)</button>
      <button class="act-tab" onclick="setActFilter(2)">2막 (13)</button>
    </div>
    <div class="song-list" id="songListContainer"></div>
  </div>

  <div id="main">
    <div class="mobile-nav-bar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ 넘버 목록</button>
      <a href="../index.html" class="nav-home-link" style="margin:0;">🏠 라이브러리 홈</a>
    </div>
    <div class="top-bar">
      <div style="font-size: 0.85rem; color: var(--neon-yellow);" id="topBarTrackInfo">Track 01 of 26</div>
      <div class="view-toggles">
        <button class="view-btn active" id="btnBilingual" onclick="setViewMode('bilingual')">영한 대역</button>
        <button class="view-btn" id="btnKr" onclick="setViewMode('kr')">한국어만</button>
        <button class="view-btn" id="btnEn" onclick="setViewMode('en')">English Only</button>
      </div>
    </div>
    <div class="song-content" id="songContent"></div>
  </div>

  <script>

 박사를 구하고 미래로 돌아가겠다는 결의를 호소력 짙게 토해낸다.", "notes": ["역사를 뒤바꾸는 운명의 편지(The Letter): 브라운 박사의 확고한 신념('자신의 미래를 미리 알아서는 안 된다')과 친구의 목숨을 구하고자 하는 마티의 순수한 우정이 정면으로 충돌하는 결정적 순간이다. 마티가 작성한 이 편지는 박사에게 발각되어 찢어지지만, 결국 박사가 몰래 테이프로 이어 붙여 방탄조끼를 입게 만드는 기적의 씨앗이 된다.", "서사적 변주와 고조된 위기감(Only a Matter of Time Reprise): 1막 오프닝에서 록스타의 꿈과 미래에 대한 낙관을 노래했던 경쾌한 넘버가, 여기서는 생사가 걸린 시간 제한과 시공간 미아가 될 수 있다는 두려움을 담은 비장한 드라마틱 파워 발라드로 완벽하게 변주된다.", "리비아 테러리스트 설정의 무대적 각색: 뮤지컬 대본에서는 원작 영화의 리비아 민병대 플루토늄 탈취 설정을 'plutonium radiation poisoning(플루토늄 방사능 피폭)'이라는 표현으로 완곡하게 처리하여, 무대 위에서 서사의 군더더기를 줄이고 과학 실험 사고와 방탄복의 반전에 집중하도록 각색했다.", "두 주인공의 세대를 초월한 우정: 1985년의 고독한 괴짜 과학자와 록 음악을 좋아하는 고등학생이 1955년이라는 낯선 시공간에서 나눈 30년 나이 차를 뛰어넘는 영혼의 유대감이 마티의 애절한 고음 보컬을 통해 절정에 달한다."], "stanzas": [{"key": "18:1", "speaker_kr": "에밋 \"닥\" 브라운 박사", "speaker_en": "Doc Emmett Brown", "lines_en": ["Y'know Marty, I'm gonna be sad to see you go. You made a real difference in my life. You've given me something to shoot for; I-just... knowing... I'm gonna live to see 1985! Then I'm gonna succeed in this; that- that I'll have the chance to travel through time. It's gonna be really hard to wait 30 years to talk about everything that's happened these last few days... I'm really gonna miss you, future boy.", "I need to prepare our weather experiment, and you... you need to pick up your mother."], "lines_kr": ["마티, 자네가 떠난다니 참 섭섭하겠군. 자네는 내 인생을 완전히 바꿔놓았어. 내게 살아갈 목표를 주었지. 내가... 1985년까지 살아서 그 세상을 보게 된다는 걸 알게 되다니! 내가 이 발명에 마침내 성공하고, 시간 여행을 할 기회를 얻게 된다는 사실을 말일세. 지난 며칠 동안 일어난 모든 일을 자네와 다시 이야기하기 위해 30년을 꼬박 기다려야 한다니 참으로 힘든 시간이 되겠지만... 정말 자네가 그리울 걸세, 미래 소년.", "난 기상 실험 장치를 준비해야 하니, 자네는... 자네 어머니를 모시러 가야겠지."]}, {"key": "18:2", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Dear Dr. Brown,", "On the night that I go back in time, you collapse from plutonium radiation poisoning.", "Pl?ase take whatev?r precautions are necessary to prevent this terrible disaster.", "Your friend,", "Marty", "I don't know how I ended up here;", "It's so hard to believe", l (A-a-a-ah...)", "A fool in love...", "With you...", "(Ah, a-a-a-a-ah...)", "Last Update: July, 10th 2026"], "lines_kr": ["당신이 누릴 행복의 모습이 눈앞에 환히 펼쳐지네, 워-오-오-오...", "지상의 천사여, 지상의 천사여", "제발 내 사람이 되어줘 (오오-오오-오오-오)", "내 사랑하는 그대여, (나의 사랑)", "언제까지나 그대만을 사랑할게 (사랑해요...)", "난 바보일 뿐이지만 (아-아-아...)", "깊은 사랑에 빠진 바보...", "오직 그대만을 향한...", "(아, 아-아-아-아...)", "최종 업데이트: 2026년 7월 10일"]}]}, {"id": 21, "act": 2, "title": "Johnny B. Goode", "title_kr": "자니 비 굿", "synopsis": "부모님의 결합을 성공시키고 마침내 자신의 존재를 완벽하게 구원해 낸 마티 맥플라이가 1955년의 무도회장을 뒤집어놓는 전설적인 로큰롤 넘버. 안도의 한숨을 쉬며 떠나려는 마티에게 마빈 베리와 학생들이 앵콜을 간청하자, 마티는 1958년 척 베리가 발표하게 될 'Johnny B. Goode'을 3년 앞선 1955년에 미리 연주하기 시작한다. B플랫 블루스 리프로 시작된 정통 로커빌리는 마티의 흥분이 폭발하면서 80년대 헤비메탈 기타 솔로(덕워크, 양손 태핑, 앰프 피드백, 기타를 등 뒤로 넘겨 연주하기)로 광란의 폭주를 거듭한다. 멍하니 얼어붙은 1955년 학생들을 향해 던지는 명대사 '여러분에겐 아직 이르지만, 여러분 아이들은 열광할 겁니다'와, 무대 뒤에서 사촌 척 베리에게 전화를 거는 마빈 베리의 모습이 객석을 열광시킨다.", "notes": ["로큰롤의 기원과 불멸의 명곡 'Johnny B. Goode': 척 베리(Chuck Berry)의 1958년 불멸의 로큰롤 찬가를 완벽한 에너지로 무대화했다. 원작 영화에서 마이클 J. 폭스가 펼쳤던 척 베리의 '덕워크(Duck walk)'부터 지미 헨드릭스의 이빨 연주, 에디 밴 헤일런의 라이트핸드 태핑 등 록 기타 역사를 집대성한 오마주가 작렬한다.", "대중음악사 최고의 '부트스트랩 패러독스(Bootstrap Paradox)' 개그: 무대 한구석에서 밴드 리더 마빈 베리가 수화기를 들고 사촌에게 '척! 척! 나 네 사촌 마빈이야! 네가 찾던 그 새로운 사운드 말인데, 이것 좀 들어봐!'라고 외치는 장면은 팝 음악사상 가장 기발하고 유쾌한 시간 왜곡 개그로 손꼽힌다.", "시대적 음악 양식의 충돌과 발전: 50년대의 단정하고 경쾌한 점프 블루스 리듬에서 출발하여, 60년대 사이키델릭 록을 거쳐 80년대 하드록의 격렬한 디스토션과 초절정 속주로 급발진하는 악곡 구성은 시공간을 뛰어넘은 문화적 충격을 완벽하게 음악적으로 시각화한다.", "'Your kids are gonna love it': 시대의 흐름을 너무 앞서간 천재들의 고독과 통쾌함을 대변하는 대사로, 마티의 자유분방한 80년대 로커로서의 자아가 가장 찬란하게 빛을 발하는 순간이다."], "stanzas": [{"key": "21:1", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Okay, ah, so, uh, this one's an oldie... Well, it's an oldie where I come from. Okay, so this is a blues riff in B flat. Watch me for the changes, and, um... yeah, try to keep up, okay?"], "lines_kr": ["좋아요, 어, 그러니까, 음, 이번 곡은 옛날 노래인데요... 뭐, 제가 살던 동네에서는 옛날 노래거든요. 자, B플랫으로 들어가는 블루스 리프입니다. 코드 체인지 할 때 절 잘 보시고요, 그리고 음... 네, 어떻게든 한번 따라와 보세요, 아셨죠?"]}, {"key": "21:2", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Way down in Louisiana, close to New Orleans", "Way back up in the woods, among the evergreens", "There stood a log cabin made of earth and wood", "Where lived a country boy named-a Johnny B. Goode", "Who never ever learned to read or write so well", "But he could play the guitar like he's ringing a bell"], "lines_kr": ["저 멀리 남쪽 뉴올리언스 근처 루이지애나에", "상록수 숲속 깊숙이 외딴 숲길을 따라가면", "흙과 통나무로 얼기설기 지어 올린 오두막집이 서 있었지", "조니 B. 구드라는 이름의 깡촌 소년이 살고 있었네", "글을 읽고 쓰는 법 따윈 제대로 배워본 적도 없었지만", "맑은 종소리가 짤랑거리듯 기막히게 기타를 뜯을 줄 알았지"]}, {"key": "21:3", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Go, go", "Go, Johnny, go, go", "Go, Johnny, go, go", "Go, Johnny, go, go", "Go, Johnny, go, go, go", "Johnny B. Goode"], "lines_kr": ["달려, 달려", "달려라, 조니, 달려라", "달려라, 조니, 달려라", "달려라, 조니, 달려라", "달려라, 조니, 힘차게 달려!", "멋쟁이 조니 B. 구드!"]}, {"key": "21:4", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["His mama told him, \"Someday, you will be a man", "And you will be the leader of a big ol' band", "Now, many people coming from-a miles around", "To hear you playing music when the sun come down", "Maybe someday your name will be in light", "Saying \"Johnny B. Goode tonight!\"\""], "lines_kr": ["엄마는 늘 말하셨지, \"언젠가 넌 훌륭한 사나이가 될 거란다", "그리곤 커다란 밴드를 거느린 멋진 리더가 되겠지", "수많은 사람들이 저 멀리 사방에서 몰려들어", "해가 저물면 네가 연주하는 신나는 음악을 들으러 올 거야", "언젠가는 네 이름 석 자가 화려한 전광판에 걸릴지도 몰라", "'오늘 밤 조니 B. 구드의 대공연!' 하고 말이지\""]}, {"key": "21:5", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Go, go! (Go, go,)", "Go, Johnny, go, go", "Go, Johnny, go, go", "Go, Johnny, go, go", "Go, Johnny, go, go, go", "Johnny B. Goode!"], "lines_kr": ["달려, 달려! (달려, 달려,)", "달려라, 조니, 달려라", "달려라, 조니, 달려라", "달려라, 조니, 달려라", "달려라, 조니, 끝까지 달려!", "위대한 조니 B. 구드!"]}, {"key": "21:6", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["Guess you guys aren't ready for that yet... but your kids are gonna love it...", "Last Update: July, 10th 2026"], "lines_kr": ["여러분에겐 아직 좀 이른 음악이었나 보네요... 하지만 여러분 자식들은 미친 듯이 열광할 겁니다...", "최종 업데이트: 2026년 7월 10일"]}]}, {"id": 22, "act": 2, "title": "The Clocktower / For the Dreamers (Reprise)", "title_kr": "시계탑 / 꿈꾸는 자들을 위하여 (리프라이즈)", "synopsis": "1955년 11월 12일 밤 10시 04분, 힐 밸리 법원 시계탑에서 펼쳐지는 스펙터클한 클라이맥스 시퀀스. 폭풍우가 몰아치는 가운데 시계탑에 연결된 전선 케이블이 나무에 걸려 끊어지자, 에멧 브라운 박사는 마티를 1985년으로 돌려보내기 위해 목숨을 걸고 시계탑 외벽으로 기어올라 시계바늘에 위태롭게 매달린다. 거센 비바람과 천둥이 포효하는 절체절명의 순간, 박사는 앞서 불렀던 'For the Dreamers'의 감동적인 테마를 웅장한 오페라적 벨팅으로 부르짖으며 꿈을 향한 인간의 불굴의 의지를 하늘에 선언한다. 정확히 10시 04분, 1.21 기가와트의 벼락이 시계탑을 강타하고, 전선을 타고 흐른 초고압 전류가 시속 88마일로 질주하는 드로리안에 적중하며 마티는 찬란한 불꽃 궤적과 함께 미래로 도약한다.", "notes": ["앨런 실베스트리의 시네마틱 스코어와 뮤지컬 보컬의 경이로운 결합: 영화사상 가장 긴박감 넘치는 명장면인 시계탑 시퀀스의 똑딱거리는 시계추 모티브, 몰아치는 금관 팡파르, 질주하는 현악기 패시지 위에 브라운 박사의 혼신을 다한 보컬이 얹혀 압도적인 서스펜스를 뿜어낸다.", "'For the Dreamers'의 영웅적 승화: 16번 트랙에서 고독하고 쓸쓸하게 회고했던 멜로디('One grain of sand becomes a pearl...')가 여기서는 자연의 맹렬한 폭풍에 당당히 맞서는 위대한 과학자의 영웅적 포효('Like... MEEEEE!')로 완벽하게 탈바꿈한다.", "1.21 기가와트 번개와 무대 테크놀로지의 극치: 시계탑 세트의 아찔한 와이어 액션, 시계바늘에서 미끄러지는 박사의 아크로바틱한 연기, 번개 섬광과 스트로브 조명, 그리고 굉음과 함께 질주하는 실물 크기 드로리안의 무대 특수효과가 관객의 숨을 멎게 만든다.", "과학자의 숭고한 헌신과 우정의 완성: 자신은 미래로 가지 못하고 쓸쓸히 과거에 남을지라도, 오직 친구 마티를 무사히 집으로 돌려보내겠다는 일념 하나로 목숨을 내던진 브라운 박사의 숭고한 자기희생이 빛을 발하는 순간이다."], "stanzas": [{"key": "22:1", "speaker_kr": "앙상블", "speaker_en": "Ensemble", "lines_en": ["{Instrumental}"], "lines_kr": ["{천둥 번개와 시계탑의 웅장한 오케스트라 연주}"]}, {"key": "22:2", "speaker_kr": "에밋 \"닥\" 브라운 박사", "speaker_en": "Doc Emmett Brown", "lines_en": ["One grain of sand", "Becomes a pearl", "One small step", "Can change the world", "They can see what others don't", "Try things others won't", "So this one's for the dreamers...", "This one's for the dreamers...", "This one's for the dreamers...", "Like... meeeeeeeeeeeeeeeeeeeee!!!", "{Instrumental}", "Last Update: July, 10th 2026"], "lines_kr": ["단 한 톨의 모래알이", "진주가 되고", "작은 한 걸음이", "세상을 바꿀 수 있나니", "남들이 보지 못하는 것을 보며", "남들이 못 하는 일에 도전하는 이들", "그러니 이 노래를 꿈꾸는 자들에게...", "온 세상을 꿈꾸는 자들에게...", "이 모든 꿈꾸는 자들에게 바친다...", "바로... 나 같은 자에게에에에에에에에에에!!!", "{1.21 기가와트 번개 섬광과 시공간 도약 오케스트라}", "최종 업데이트: 2026년 7월 10일"]}]}, {"id": 23, "act": 2, "title": "The Power of Love", "title_kr": "사랑의 힘", "synopsis": "1985년으로 무사히 귀환한 마티 맥플라이를 맞이하는 기적 같은 보상과 축제의 넘버. 1955년 과거에서 조지가 비프에게 용기 있게 맞섰던 덕분에, 1985년의 맥플라이 가문은 패배자 집안에서 완벽한 성공과 화목을 누리는 가정으로 환골탈태했다. 조지는 베스트셀러 SF 소설가가 되었고, 로레인은 날씬하고 우아하며, 형제들은 엘리트 직장인이 되었고, 불량배 비프는 순종적인 자동차 세차원이 되었다. 게다가 마티의 경고 편지 덕분에 브라운 박사 역시 방탄조끼를 입고 살아남았다! 아버지 조지는 소설 출간 기념회에서 30년 전 한 젊은이가 건넸던 '마음먹기에 달렸다'는 격려 덕분에 성공할 수 있었다고 밝히며 아들 마티와 그의 밴드 '핀헤즈'를 자랑스럽게 소개하고, 마티는 휴이 루이스 앤 더 뉴스의 불멸의 메가히트곡 'The Power of Love'를 열창하며 기쁨을 폭발시킨다.", "notes": ["휴이 루이스 앤 더 뉴스(Huey Lewis and the News)의 불멸의 빌보드 1위 명곡: 원작 영화를 위해 작곡되어 빌보드 핫 100 1위를 차지하고 아카데미 주제가상 후보에 올랐던 80년대 최고의 팝록 클래식이다. 파워풀한 호른 섹션과 질주하는 드럼 비트, 시원한 록 보컬이 극장 전체를 뜨거운 환희로 가득 채운다.", "수미상관의 완성 ('Put Your Mind to It'): 조지 맥플라이가 넘버 도입부에서 '30년 전 한 젊은이가 해준 단순한 조언: 마음만 먹으면 무엇이든 해낼 수 있다'를 관객들에게 증언함으로써, 15번 트랙에서 시작된 시간 여행의 순환 고리가 완벽하고도 눈부신 행복의 결실로 매듭지어진다.", "방탄조끼의 기적과 우정의 승리: 시간 여행의 패러독스를 두려워하던 박사가 친구의 목숨을 아끼는 마티의 편지를 차마 버리지 못하고 테이프로 이어 붙여 방탄조끼를 착용했다는 반전이 드러난 직후 펼쳐지는 넘버로, 죽음조차 갈라놓지 못한 두 사람의 깊은 우정을 기념한다.", "보편적 사랑의 구원 메시지: 'You don't need money, don't take fame / Don't need no credit card to ride this train(돈도 명성도, 신용카드도 필요 없다)'는 가사는 타임머신이나 과학 기술의 경이로움을 넘어, 인간을 변화시키고 역사를 구원하는 진정한 힘은 바로 서로를 향한 사랑이라는 작품 전체의 궁극적 테마를 노래한다."], "stanzas": [{"key": "23:1", "speaker_kr": "조지 맥플라이", "speaker_en": "George McFly", "lines_en": ["My success...is the result of some very simple advice a young man gave to me 30 years ago: \"You can accomplish anything if you put your mind to it.\", and here's the proof. May I introduce our son, Marty McFly, and his band, the Pinheads!"], "lines_kr": ["저의 성공은... 30년 전 한 젊은이가 제게 건네주었던 아주 단순한 조언 덕분이었습니다. \"마음만 굳게 먹는다면 넌 뭐든지 해낼 수 있어\"라고요. 그리고 여기 그 살아있는 증거가 있습니다. 제 아들 마티 맥플라이와 그의 밴드, 핀헤즈를 소개합니다!"]}, {"key": "23:2", "speaker_kr": "마티 맥플라이", "speaker_en": "Marty McFly", "lines_en": ["The power of love is a curious thing", "Make-a one ": "앙상블", "speaker_en": "Ensemble", "lines_en": ["Instrumental", "Last Update: April, 17th 2026"], "lines_kr": ["오케스트라 연주곡 (퇴장 음악)", "최종 업데이트: 2026년 4월 17일"]}]}];
    let currentSongId = 1;
    let currentAct = 'all';
    let currentMode = 'bilingual';

    function init() {
      renderSongList();
      loadSong(1);
    }

    function setActFilter(act) {
      currentAct = act;
      document.querySelectorAll('.act-tab').forEach((t, idx) => {
        t.classList.toggle('active', (act === 'all' && idx === 0) || (act === 1 && idx === 1) || (act === 2 && idx === 2));
      });
      renderSongList();
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function renderSongList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('songListContainer');
      container.innerHTML = '';

      songsData.forEach(s => {
        if (currentAct !== 'all' && s.act !== currentAct) return;
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchLyric = s.stanzas.some(st => st.lines_en.some(l => l.toLowerCase().includes(query)) || st.lines_kr.some(l => l.toLowerCase().includes(query)));
          if (!matchTitle && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => loadSong(s.id);
        item.innerHTML = `
          <div class="song-num">Act ${s.act} · Track ${String(s.id).padStart(2, '0')}</div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarBackdrop').classList.toggle('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('open');
    }

    function loadSong(id) {
      currentSongId = id;
      closeSidebar();
      document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Act ${song.act} · Track ${String(song.id).padStart(2, '0')} / 26`;

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & 80s Culture)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
        </div>
        <div class="synopsis-box">
          <strong>📖 장면 및 드라마적 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
  </script>
