<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뮤지컬 《디어 에반 핸슨 (Dear Evan Hansen)》 전곡 영한 대역 뷰어</title>
  <style>
    :root {
      --bg: #090e17;
      --sidebar-bg: #0d1522;
      --card-bg: #121c2c;
      --sky-blue: #00a8ff;
      --sky-blue-glow: rgba(0, 168, 255, 0.35);
      --soft-cyan: #4cd137;
      --accent-yellow: #fbc531;
      --accent-coral: #e84118;
      --text: #e6edf8;
      --text-muted: #8395a7;
      --border: #1e2d42;
      --hover: #172437;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile Drawer Overlay */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 998;
    }

    /* Sidebar */
    #sidebar {
      width: 340px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 999;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      background: #090f1a;
      text-align: center;
      position: relative;
    }
    .sidebar-header .home-link {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 0.75rem;
      color: var(--sky-blue);
      text-decoration: none;
      padding: 3px 8px;
      background: rgba(0, 168, 255, 0.1);
      border-radius: 4px;
      border: 1px solid rgba(0, 168, 255, 0.25);
      transition: all 0.2s;
    }
    .sidebar-header .home-link:hover {
      background: var(--sky-blue);
      color: #000;
    }
    .sidebar-header h1 {
      font-size: 1.25rem;
      background: linear-gradient(135deg, #00a8ff 0%, #00d2d3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .sidebar-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #111b2b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--sky-blue);
      box-shadow: 0 0 8px var(--sky-blue-glow);
    }
    .act-tabs {
      display: flex;
      padding: 6px 10px;
      gap: 6px;
      background: #090f1a;
      border-bottom: 1px solid var(--border);
    }
    .act-tab {
      flex: 1;
      padding: 7px 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.74rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .act-tab.active {
      background: rgba(0, 168, 255, 0.15);
      color: var(--sky-blue);
      border-color: rgba(0, 168, 255, 0.4);
      font-weight: 700;
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .song-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: #0f1826;
    }
    .song-item:hover {
      background: var(--hover);
      border-color: rgba(0, 168, 255, 0.3);
    }
    .song-item.active {
      background: rgba(0, 168, 255, 0.15);
      border-color: var(--sky-blue);
      box-shadow: 0 0 10px rgba(0, 168, 255, 0.2);
    }
    .song-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .song-num {
      font-size: 0.72rem;
      color: var(--accent-yellow);
      font-weight: 700;
    }
    .song-act-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      background: rgba(0, 168, 255, 0.12);
      color: var(--sky-blue);
    }
    .song-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
    }
    .song-title-kr {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Main Content Area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }
    .top-bar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: #0d1522;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--sky-blue);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 6px 14px;
      background: #121c2c;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--sky-blue);
      color: #000;
      font-weight: 700;
      border-color: var(--sky-blue);
      box-shadow: 0 0 10px var(--sky-blue-glow);
    }
    .song-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .song-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .song-header h2 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 800;
    }
    .song-header h2 .kr-title {
      color: var(--sky-blue);
      margin-left: 10px;
      font-size: 1.3rem;
      font-weight: 600;
    }
    .song-meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .song-meta-item strong {
      color: #fff;
    }
    .synopsis-box {
      background: var(--card-bg);
      border-left: 4px solid var(--sky-blue);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #d1dcf0;
    }
    .notes-box {
      background: #0f1927;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 30px;
    }
    .notes-box h4 {
      font-size: 0.9rem;
      color: var(--accent-yellow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .notes-box ul {
      padding-left: 18px;
      font-size: 0.88rem;
      color: #a4b4cc;
      line-height: 1.65;
    }
    .notes-box li {
      margin-bottom: 6px;
    }
    .stanza-block {
      background: #0e1724;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .speaker-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--sky-blue);
      background: rgba(0, 168, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
      border: 1px solid rgba(0, 168, 255, 0.25);
    }
    .lyric-pair {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(30, 45, 66, 0.7);
    }
    .lyric-pair:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .lyric-en {
      font-size: 1.02rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }
    .lyric-kr {
      font-size: 0.95rem;
      color: #9cb1ce;
      line-height: 1.55;
    }

    /* View modes */
    .mode-kr-only .lyric-en { display: none; }
    .mode-en-only .lyric-kr { display: none; }

    /* Responsive Design */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: 82%;
        max-width: 320px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .drawer-overlay.active {
        display: block;
      }
      .mobile-menu-btn {
        display: inline-block;
      }
      .close-drawer-btn {
        display: block;
      }
      .top-bar {
        padding: 10px 16px;
      }
      .song-content {
        padding: 20px 16px;
      }
      .song-header h2 {
        font-size: 1.35rem;
      }
      .song-header h2 .kr-title {
        display: block;
        margin-left: 0;
        margin-top: 4px;
        font-size: 1.05rem;
      }
      .stanza-block {
        padding: 16px;
      }
      .lyric-en {
        font-size: 0.95rem;
      }
      .lyric-kr {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="home-link">◀ 뮤지컬 도서관 홈</a>
      <button class="close-drawer-btn" onclick="closeSidebar()">✕</button>
      <h1>DEAR EVAN HANSEN</h1>
      <p>전 14곡 공식 가사 & 영한 대역 뷰어</p>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목, 가사, 등장인물 검색..." oninput="renderSongList()">
    </div>
    <div class="act-tabs">
      <button class="act-tab active" id="tabAll" onclick="setActFilter('all')">전체 (14)</button>
      <button class="act-tab" id="tabAct1" onclick="setActFilter(1)">1막 (8)</button>
      <button class="act-tab" id="tabAct2" onclick="setActFilter(2)">2막 (6)</button>
    </div>
    <div class="song-list" id="songListContainer"></div>
  </div>

  <!-- Main Content -->
  <div id="main">
    <div class="top-bar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="openSidebar()">☰ 목록</button>
        <div style="font-size: 0.85rem; color: var(--accent-yellow); font-weight: 700;" id="topBarTrackInfo">Act 1 · Track 01 / 14</div>
      </div>
      <div class="view-toggles">
        <button class="view-btn active" id="btnBilingual" onclick="setViewMode('bilingual')">영한 대역</button>
        <button class="view-btn" id="btnKr" onclick="setViewMode('kr')">한국어만</button>
        <button class="view-btn" id="btnEn" onclick="setViewMode('en')">English Only</button>
      </div>
    </div>
    <div class="song-content" id="songContent"></div>
  </div>

  <script>

    let currentSongId = 1;
    let currentAct = 'all';
    let currentMode = 'bilingual';

    function init() {
      renderSongList();
      loadSong(1);
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function setActFilter(act) {
      currentAct = act;
      document.getElementById('tabAll').classList.toggle('active', act === 'all');
      document.getElementById('tabAct1').classList.toggle('active', act === 1);
      document.getElementById('tabAct2').classList.toggle('active', act === 2);
      renderSongList();
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function renderSongList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('songListContainer');
      container.innerHTML = '';

      songsData.forEach(s => {
        if (currentAct !== 'all' && s.act !== currentAct) return;
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchChar = (s.characters_en || []).some(c => c.toLowerCase().includes(query)) ||
                            (s.characters_kr || []).some(c => c.toLowerCase().includes(query));
          const matchLyric = s.stanzas.some(st => 
            st.lines_en.some(l => l.toLowerCase().includes(query)) || 
            st.lines_kr.some(l => l.toLowerCase().includes(query))
          );
          if (!matchTitle && !matchChar && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => {
          loadSong(s.id);
          closeSidebar();
        };

        item.innerHTML = `
          <div class="song-badge-row">
            <span class="song-num">Track ${String(s.id).padStart(2, '0')}</span>
            <span class="song-act-tag">${s.act}막</span>
          </div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function loadSong(id) {
      currentSongId = id;
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Act ${song.act} · Track ${String(song.id).padStart(2, '0')} / 14`;

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & Themes)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const charsKr = (song.characters_kr || []).join(', ');
      const charsEn = (song.characters_en || []).join(', ');

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
          <div class="song-meta-box">
            <div class="song-meta-item"><strong>막(Act):</strong> 제${song.act}막</div>
            <div class="song-meta-item"><strong>등장인물/보컬:</strong> ${charsKr} (${charsEn})</div>
          </div>
        </div>
        <div class="synopsis-box">
          <strong>📖 드라마적 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
