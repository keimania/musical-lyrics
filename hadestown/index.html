<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뮤지컬 《하데스타운 (Hadestown)》 전곡 영한 대역 뷰어</title>
  <style>
    :root {
      --bg: #0e0a07;
      --sidebar-bg: #16100c;
      --card-bg: #201712;
      --hadestown-amber: #ff9f1a;
      --hadestown-amber-glow: rgba(255, 159, 26, 0.4);
      --hadestown-red: #e55039;
      --hadestown-bronze: #cd6133;
      --carnation-red: #ff3838;
      --text: #fbede4;
      --text-muted: #bda293;
      --border: #38251b;
      --hover: #291c15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile Drawer Overlay */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 998;
    }

    /* Sidebar */
    #sidebar {
      width: 340px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 999;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      background: #120b08;
      text-align: center;
      position: relative;
    }
    .sidebar-header .home-link {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 0.75rem;
      color: var(--hadestown-amber);
      text-decoration: none;
      padding: 3px 8px;
      background: rgba(255, 159, 26, 0.1);
      border-radius: 4px;
      border: 1px solid rgba(255, 159, 26, 0.25);
      transition: all 0.2s;
    }
    .sidebar-header .home-link:hover {
      background: var(--hadestown-amber);
      color: #000;
    }
    .sidebar-header h1 {
      font-size: 1.25rem;
      background: linear-gradient(135deg, #ff9f1a 0%, #e55039 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .sidebar-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #1c130e;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--hadestown-amber);
      box-shadow: 0 0 8px var(--hadestown-amber-glow);
    }
    .act-tabs {
      display: flex;
      padding: 6px 10px;
      gap: 6px;
      background: #120b08;
      border-bottom: 1px solid var(--border);
    }
    .act-tab {
      flex: 1;
      padding: 7px 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.74rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .act-tab.active {
      background: rgba(255, 159, 26, 0.15);
      color: var(--hadestown-amber);
      border-color: rgba(255, 159, 26, 0.4);
      font-weight: 700;
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .song-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: #1a120c;
    }
    .song-item:hover {
      background: var(--hover);
      border-color: rgba(255, 159, 26, 0.3);
    }
    .song-item.active {
      background: rgba(255, 159, 26, 0.15);
      border-color: var(--hadestown-amber);
      box-shadow: 0 0 10px rgba(255, 159, 26, 0.2);
    }
    .song-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .song-num {
      font-size: 0.72rem;
      color: var(--hadestown-amber);
      font-weight: 700;
    }
    .song-act-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      background: rgba(255, 159, 26, 0.12);
      color: var(--hadestown-amber);
    }
    .song-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
    }
    .song-title-kr {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Main Content Area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }
    .top-bar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: #16100c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--hadestown-amber);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 6px 14px;
      background: #201712;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--hadestown-amber);
      color: #000;
      font-weight: 700;
      border-color: var(--hadestown-amber);
      box-shadow: 0 0 10px var(--hadestown-amber-glow);
    }
    .song-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .song-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .song-header h2 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 800;
    }
    .song-header h2 .kr-title {
      color: var(--hadestown-amber);
      margin-left: 10px;
      font-size: 1.3rem;
      font-weight: 600;
    }
    .song-meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .song-meta-item strong {
      color: #fff;
    }
    .synopsis-box {
      background: var(--card-bg);
      border-left: 4px solid var(--hadestown-amber);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #f7e6dc;
    }
    .notes-box {
      background: #1c130e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 30px;
    }
    .notes-box h4 {
      font-size: 0.9rem;
      color: var(--hadestown-amber);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .notes-box ul {
      padding-left: 18px;
      font-size: 0.88rem;
      color: #d1b8ab;
      line-height: 1.65;
    }
    .notes-box li {
      margin-bottom: 6px;
    }
    .stanza-block {
      background: #1a120c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .speaker-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--hadestown-amber);
      background: rgba(255, 159, 26, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 159, 26, 0.25);
    }
    .lyric-pair {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(56, 37, 27, 0.7);
    }
    .lyric-pair:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .lyric-en {
      font-size: 1.02rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }
    .lyric-kr {
      font-size: 0.95rem;
      color: #cbb4a6;
      line-height: 1.55;
    }

    /* View modes */
    .mode-kr-only .lyric-en { display: none; }
    .mode-en-only .lyric-kr { display: none; }

    /* Responsive Design */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: 82%;
        max-width: 320px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .drawer-overlay.active {
        display: block;
      }
      .mobile-menu-btn {
        display: inline-block;
      }
      .close-drawer-btn {
        display: block;
      }
      .top-bar {
        padding: 10px 16px;
      }
      .song-content {
        padding: 20px 16px;
      }
      .song-header h2 {
        font-size: 1.35rem;
      }
      .song-header h2 .kr-title {
        display: block;
        margin-left: 0;
        margin-top: 4px;
        font-size: 1.05rem;
      }
      .stanza-block {
        padding: 16px;
      }
      .lyric-en {
        font-size: 0.95rem;
      }
      .lyric-kr {
        font-size: 0.88rem;
      }
    }
  </style>
</head>

": ["내 손가락에 끼워줄 결혼반지 하나라도 있나요?", "숲의 나무들이 가지를 뻗어 당신의 손에 반지를 얹어줄 거요!", "우리 식탁 위에 올릴 따뜻한 음식 한 접시는 있고요?", "새들이 온 대지를 날아다니며 가장 달콤한 열매를 물어다 줄 거요!", "내 사랑, 내가 노래를 부를 때 온 세상이 우리를 채워줄 것이오!"]}], "slug": "04_wedding_song", "filename": "04_wedding_song.md", "rel_path": "act1/04_wedding_song.md"}, {"id": 5, "act": 1, "title": "Epic I", "title_kr": "에픽 I (하데스와 페르세포네의 옛이야기)", "characters_en": ["Orpheus", "Hermes"], "characters_kr": ["오르페우스", "헤르메스"], "synopsis": "오르페우스가 완성하고자 하는 위대한 서사시(Epic)의 첫 장. 하데스와 페르세포네가 처음 사랑에 빠졌던 신화 시대, 두 신의 조화로운 사랑 덕분에 지상에 봄과 여름, 가을과 겨울이 완벽한 균형을 이루었던 찬란한 시절을 노래한다.", "notes": ["라라라(La-la-la) 멜로디의 첫 등장: 극 전체의 중심 테마이자 에덴의 회복을 상징하는 오르페우스의 신성한 라이트모티프."], "stanzas": [{"speaker_en": "Orpheus", "speaker_kr": "오르페우스", "lines_en": ["King of shadows, queen of light", "Long ago they were in love", "When he held her in his arms", "The spring and summer came to bloom", "La la la la la la la..."], "lines_kr": ["그림자의 제왕과 눈부신 빛의 여왕", "아득한 옛적 그들은 뜨겁게 사랑했었지", "그가 여왕을 품에 다정히 안았을 때", "지상에는 찬란한 봄과 풍요로운 여름이 피어났었네", "라 라 라 라 라 라 라..."]}], "slug": "05_epic_i", "filename": "05_epic_i.md", "rel_path": "act1/05_epic_i.md"}, {"id": 6, "act": 1, "title": "Livin' It Up on Top", "title_kr": "지상에서 마음껏 즐겨봐", "characters_en": ["Persephone", "Hermes", "Orpheus", "Company"], "characters_kr": ["페르세포네 (앰버 그레이)", "헤르메스", "오르페우스", "앙상블"], "synopsis": "녹색 드레스를 입은 봄의 여신 페르세포네가 밀주 가방을 들고 지상으로 올라와 축제를 연다! 지하 세계의 답답한 감옥에서 벗어나 햇살 아래서 포도주를 마시고 춤을 추며, 지상의 소박한 삶과 여름의 환희를 예찬하는 경쾌한 뉴올리언스 재즈 넘버.", "notes": ["앰버 그레이의 폭발적인 매력: 허스키하고 관능적인 보컬과 아코디언, 트롬본 솔로가 어우러진 흥겨운 재즈 파티."], "stanzas": [{"speaker_en": "Persephone & Company", "speaker_kr": "페르세포네 & 앙상블", "lines_en": ["Brother, pass the wine around!", "Pour a drink and make some noise!", "We're livin' it up on top!", "Feel the sunshine on your face", "Livin' it up on top!"], "lines_kr": ["형제여, 포도주 병을 이리저리 돌려라!", "술잔을 가득 채우고 한바탕 신나게 소리쳐봐!", "우린 지상에서 마음껏 인생을 즐기고 있으니까!", "너의 뺨에 쏟아지는 따스한 햇살을 온몸으로 느껴봐", "지상에서 마음껏 축제를 즐겨라!"]}], "slug": "06_livin_it_up_on_top", "filename": "06_livin_it_up_on_top.md", "rel_path": "act1/06_livin_it_up_on_top.md"}, {"id": 7, "act": 1, "title": "All I've Ever Known", "title_kr": "내가 아는 세상의 전부", "characters_en": ["Eurydice", "Orpheus"], "characters_kr": ["에우리디케", "오르페우스"], "synopsis": "평생을 홀로 방황하며 누구도 믿지 못했던 에우리디케가 오르페우스의 순수한 사랑에 마음을 열고 부르는 감미로운 어쿠스틱 듀엣. '너를 만나기 전에는 칼바람과 외로움만이 내가 아는 세상의 전부였는데, 이제는 네 품이 나의 새로운 전부가 되었다'고 고백한다.", "notes": ["방랑자의 안식처: 에우리디케가 생애 처음으로 누군가에게 온전히 마음을 기대며 취약성을 드러내는 가슴 뭉클한 사랑의 노래."], "stanzas": [{"speaker_en": "Eurydice & Orpheus", "speaker_kr": "에우리디케 & 오르페우스", "lines_en": ["I was alone, a stray dog on the street", "Cold and hungry, all I've ever known", "And suddenly you hold my hand", "And all at once, you're all I've ever known", "Say you'll hold me forever"], "lines_kr": ["난 늘 혼자였어요, 거리를 떠도는 길 잃은 개처럼", "시린 추위와 배고픔만이 내가 아는 세상의 전부였는데", "갑자기 당신이 내 차가운 손을 잡아주었죠", "그러자 한순간에, 당신만이 내가 아는 세상의 전부가 되어버렸어요", "영원히 날 안아주겠다고 말해줘요"]}], "slug": "07_all_ive_ever_known", "filename": "07_all_ive_ever_known.md", "rel_path": "act1/07_all_ive_ever_known.md"}, {"id": 8, "act": 1, "title": "Way Down Hadestown", "title_kr": "저 깊은 하데스타운으로", "characters_en": ["Hermes", "Persephone", "Hades", "Company"], "characters_kr": ["헤르메스", "페르세포네", "하데스 (패트릭 페이지)", "앙상블"], "synopsis": "검은 기차를 타고 지하 세계의 제왕 하데스가 지상으로 올라와 아내 페르세포네를 데려간다. 헤르메스와 앙상블은 지하 광산과 공장 지대로 묘사되는 '하데스타운'의 실체를 폭로한다. 따뜻한 잠자리와 일자리를 보장한다고 유혹하지만, 한번 발을 들이면 영원히 지상으로 돌아올 수 없는 자본주의적 노동 착취의 지하 감옥이다.", "notes": ["패트릭 페이지의 전설적인 최저음 베이스: 지하 광산의 기계 진동처럼 울려 퍼지는 극저음 보컬의 카리스마.", "산업화된 저승: 고대 그리스 저승을 19세기 도금시대 광산과 공장 카르텔로 치환한 아나이스 미첼의 천재적 비유."], "stanzas": [{"speaker_en": "Hermes & Company", "speaker_kr": "헤르메스 & 앙상블", "lines_en": ["Way down Hadestown, way down under the ground!", "Hound dogs howling at the gate", "Everybody's punchin' the clock", "Down in the hole where the sun don't shine!", "Way down Hadestown!"], "lines_kr": ["저 깊은 하데스타운으로, 저 깊은 지하 바닥으로!", "사나운 사냥개들이 철창 문 앞에서 으르렁거리고", "모두가 묵묵히 출근 도장을 찍고 있지", "태양빛 한 줌 비추지 않는 컴컴한 지하 구덩이 속에서!", "저 깊은 하데스타운으로!"]}], "slug": "08_way_down_hadestown", "filename": "08_way_down_hadestown.md", "rel_path": "act1/08_way_down_hadestown.md"}, {"id": 9, "act": 1, "title": "A Gathering Storm", "title_kr": "몰아치는 폭풍", "characters_en": ["Hermes", "Eurydice", "Orpheus", "The Fates"], "characters_kr": ["헤르메스", "에우리디케", "오르페우스", "운명의 여신들"], "synopsis": "페르세포네가 지하로 끌려가자마자 지상에는 때이른 혹독한 겨울 폭풍이 몰아닥친다. 장작도 식량도 떨어진 오두막에서 에우리디케는 생존의 공포에 떨지만, 오르페우스는 신들을 감동시킬 노래를 완성해야 한다며 악보에만 매달린다.", "notes": ["예술에 눈먼 남편과 굶주리는 아내: 오르페우스의 이상주의와 에우리디케의 절박한 현실이 빚어내는 비극적 균열."], "stanzas": [{"speaker_en": "Eurydice", "speaker_kr": "에우리디케", "lines_en": ["A storm is coming, can't you feel the freeze?", "We have no firewood, we have nothing to eat!", "You sit there tuning your guitar", "While the cold is creeping through the floor", "Look at me, Orpheus!"], "lines_kr": ["거대한 폭풍이 몰려오고 있어요, 살을 에는 추위가 느껴지지 않나요?", "우리한텐 땔나무 한 토막도 없고, 먹을 음식 한 숟가락도 없다고요!", "당신은 온종일 거기 우두커니 앉아 기타 줄만 조율하고 있잖아요", "차가운 한기가 마룻바닥 틈새로 스멀스멀 기어들어오고 있는데!", "제발 날 좀 봐요, 오르페우스!"]}], "slug": "09_a_gathering_storm", "filename": "09_a_gathering_storm.md", "rel_path": "act1/09_a_gathering_storm.md"}, {"id": 10, "act": 1, "title": "Epic II", "title_kr": "에픽 II (하데스의 욕망과 광산)", "characters_en": ["Orpheus"], "characters_kr": ["오르페우스"], "synopsis": "오르페우스가 부르는 서사시의 두 번째 장. 하데스가 페르세포네를 잃을까 두려워 그녀를 위해 지하의 모든 황금과 석탄을 캐내어 거대한 성벽과 궁전을 짓기 시작했고, 그 끝없는 탐욕으로 인해 계절의 순환이 깨져버렸음을 맑고 처연한 미성으로 풀어낸다.", "notes": ["사랑이 탐욕으로 변질된 비극: '그는 그녀를 지키기 위해 담을 쌓았지만, 결국 그 담이 그녀를 가두었다'는 통찰."], "stanzas": [{"speaker_en": "Orpheus", "speaker_kr": "오르페우스", "lines_en": ["King of coal, king of gold", "He dug the earth to build her a throne", "He made the furnaces burn all night", "To buy the love of the queen of light", "La la la la la la la..."], "lines_kr": ["석탄의 제왕, 황금의 군주 하데스", "그는 여왕에게 바칠 왕좌를 짓기 위해 대지를 파헤쳤네", "여왕의 사랑을 영원히 사들이기 위해", "밤낮으로 거대한 용광로의 불길을 지폈지", "라 라 라 라 라 라 라..."]}], "slug": "10_epic_ii", "filename": "10_epic_ii.md", "rel_path": "act1/10_epic_ii.md"}, {"id": 11, "act": 1, "title": "Chant", "title_kr": "챈트 (지하의 노동과 지상의 결핍)", "characters_en": ["Company"], "characters_kr": ["앙상블"], "synopsis": "지상과 지하의 노동이 교차하는 1막의 장대한 합창 넘버. 지상에서는 오르페우스가 악보에 갇혀 있고 에우리디케가 추위에 떠는 동안, 지하에서는 하데스의 채찍 아래 수천 명의 일꾼들이 쉼 없이 곡괭이질을 하며 거대한 장벽을 쌓아 올린다.", "notes": ["기계적인 노동 리듬: 앙상블의 강렬한 스톰프와 합창이 자본주의적 분업과 소외를 웅장하게 형상화한다."], "stanzas": [{"speaker_en": "Company", "speaker_kr": "앙상블", "lines_en": ["Keep your head down, keep your shovel in the ground!", "Chant for the king, chant for the wall!", "Work is never done, sun will never rise!", "Heavy is the load we bear!"], "lines_kr": ["고개를 숙여라, 삽자루를 단단히 쥐고 땅을 파내려가라!", "제왕을 위해 노래하라, 저 거대한 장벽을 위해 복종하라!", "노동은 결코 끝나지 않고, 태양은 결코 떠오르지 않으리라!", "우리가 짊어진 짐은 무겁기만 하구나!"]}], "slug": "11_chant", "filename": "11_chant.md", "rel_path": "act1/11_chant.md"}, {"id": 12, "act": 1, "title": "Hey, Little Songbird", "title_kr": "어이, 작은 새여", "characters_en": ["Hades", "Eurydice"], "characters_kr": ["하데스", "에우리디케"], "synopsis": "식량을 구하러 지상으로 올라온 하데스가 홀로 떨고 있는 에우리디케를 발견한다. 패트릭 페이지 특유의 동굴 같은 저음으로 '가난한 시인은 널 굶겨 죽일 뿐이다. 내 지하 세계로 오면 따뜻한 침대와 배부른 식탁을 주겠다'며 악마적인 유혹의 손길을 내민다.", "notes": ["달콤하고 치명적인 자본의 유혹: 에우리디케를 '작은 새(Songbird)'에 비유하며 새장 속으로 끌어들이는 포식자의 매혹."], "stanzas": [{"speaker_en": "Hades", "speaker_kr": "하데스", "lines_en": ["Hey, little songbird, give me your song", "I got a feather bed for you to lay upon", "Why starve in the cold for a starving poet?", "Come down to Hadestown, where the food is hot", "Hey, little songbird, come with me"], "lines_kr": ["어이, 작은 새여, 내게 너의 노랫소리를 들려다오", "내게는 네가 누울 푹신한 깃털 침대가 준비되어 있단다", "가난에 굶주린 시인 놈을 위해 왜 추위 속에서 굶어 죽어간단 말이냐?", "따뜻한 음식이 넘쳐나는 하데스타운으로 내려오렴", "어이, 가엾은 작은 새여, 나와 함께 가자꾸나"]}], "slug": "12_hey_little_songbird", "filename": "12_hey_little_songbird.md", "rel_path": "act1/12_hey_little_songbird.md"}, {"id": 13, "act": 1, "title": "When the Chips Are Down", "title_kr": "모든 패를 잃었을 때", "characters_en": ["The Fates", "Eurydice"], "characters_kr": ["운명의 여신들", "에우리디케"], "synopsis": "망설이는 에우리디케의 귓가에 운명의 세 여신이 나타나 맹렬하게 속삭인다. '도덕이나 ", "리브 카니의 전설적인 보컬: 'Wait for me, I'm comin'!'을 터뜨리는 폭발적인 하이 벨팅."], "stanzas": [{"speaker_en": "Orpheus & Hermes", "speaker_kr": "오르페우스 & 헤르메스", "lines_en": ["Wait for me, I'm coming!", "Wait, I'm coming with you!", "Wait for me, I hear your call!", "Through the dark, across the stones", "Wait for me, I'm coming!"], "lines_kr": ["날 기다려줘, 내가 가고 있어!", "기다려요, 내가 당신 곁으로 달려가고 있소!", "날 기다려줘, 당신의 애절한 부름이 들려오니까!", "칠흑 같은 어둠을 뚫고, 차가운 자갈밭을 건너서", "날 기다려줘, 내가 지금 가고 있어!"]}], "slug": "15_wait_for_me", "filename": "15_wait_for_me.md", "rel_path": "act1/15_wait_for_me.md"}, {"id": 16, "act": 1, "title": "Why We Build the Wall", "title_kr": "우리가 벽을 쌓는 이유", "characters_en": ["Hades", "Company"], "characters_kr": ["하데스", "앙상블"], "synopsis": "1막의 피날레. 하데스타운에 도착한 일꾼들에게 하데스가 콜 앤 리스폰스(문답형)로 질문을 던진다. '우리는 왜 벽을 쌓는가? 자유를 지키기 위해! 우리의 적은 누구인가? 가난이다! 벽이 우리를 부유하게 만든다!'라는 선동적인 구호 아래, 인간을 통제하고 가두는 거대한 장벽의 프로파간다가 장엄하게 울려 퍼진다.", "notes": ["현대 정치와 장벽 담론의 예언적 풍자: 2006년 처음 쓰였음에도 오늘날 국경 장벽과 배타적 포퓰리즘을 정확히 꿰뚫어 본 명넘버."], "stanzas": [{"speaker_en": "Hades & Company", "speaker_kr": "하데스 & 앙상블", "lines_en": ["Why do we build the wall, my children?", "We build the wall to keep us free!", "How does the wall keep us free?", "The wall keeps out the enemy!", "And the enemy is poverty!", "We build the wall!"], "lines_kr": ["우리는 왜 이 거대한 벽을 쌓는가, 나의 아이들아?", "우린 우리의 자유를 지켜내기 위해 벽을 쌓습니다!", "이 벽이 대체 어떻게 우리를 자유롭게 만든다는 말이냐?", "이 벽이 저 밖의 무서운 적들을 막아주기 때문입니다!", "그리고 우리의 적은 바로 참혹한 가난이다!", "우리는 장벽을 쌓아 올린다!"]}], "slug": "16_why_we_build_the_wall", "filename": "16_why_we_build_the_wall.md", "rel_path": "act1/16_why_we_build_the_wall.md"}, {"id": 17, "act": 2, "title": "Our Lady of the Underground", "title_kr": "지하 세계의 우리 여왕님", "characters_en": ["Persephone"], "characters_kr": ["페르세포네"], "synopsis": "2막의 오프닝. 지하 클럽의 주인으로 분한 페르세포네가 밴드 세션들을 한 명씩 소개하며 분위기를 띄운다. 하데스의 억압적인 규칙 몰래 일꾼들에게 지상의 향기, 꽃잎, 따뜻한 밀주를 한 잔씩 건네며 희망을 잃지 말라고 격려하는 재즈 쇼.", "notes": ["무대 위 오케스트라 밴드 소개: 트롬본, 베이스, 드럼, 바이올린 연주자들과 호흡하며 제4의 벽을 넘나드는 유쾌한 재즈 보컬."], "stanzas": [{"speaker_en": "Persephone", "speaker_kr": "페르세포네", "lines_en": ["Brother, let me pour you a little drop of sunshine", "Straight from the moonshine still!", "I am the lady of the underground", "Take a little sip, feel the spirit rise!"], "lines_kr": ["형제여, 지상의 햇살 한 방울을 잔에 채워줄 테니 받아보렴", "저 달빛을 증류해 만든 진짜배기 밀주라네!", "내가 바로 이 지하 세계의 여주인이지", "한 모금 홀짝 마셔봐, 가슴속 영혼이 다시 솟아오를 테니!"]}], "slug": "17_our_lady_of_the_underground", "filename": "17_our_lady_of_the_underground.md", "rel_path": "act2/17_our_lady_of_the_underground.md"}, {"id": 18, "act": 2, "title": "Way Down Hadestown (Reprise)", "title_kr": "저 깊은 하데스타운으로 (리프라이즈)", "characters_en": ["Hermes", "The Fates", "Eurydice"], "characters_kr": ["헤르메스", "운명의 여신들", "에우리디케"], "synopsis": "하데스타운에 도착한 에우리디케는 계약서에 서명한 순간 자신의 기억과 이름을 잃어버리고 단순한 일꾼으로 전락하게 된다는 끔찍한 진실을 깨닫는다.", "notes": ["망각의 강 레테의 현대적 해석: 노동에 매몰되어 자신의 정체성을 잃어버리는 일꾼들의 비극."], "stanzas": [{"speaker_en": "Eurydice & The Fates", "speaker_kr": "에우리디케 & 운명의 여신들", "lines_en": ["What have I done? I gave away my name!", "You signed the paper, you took the deal!", "Now you forget who you were before", "Way down Hadestown!"], "lines_kr": ["내가 대체 무슨 짓을 저지른 거지? 내 소중한 이름마저 팔아넘겼잖아!", "네 손으로 계약서에 서명했잖아, 네 발로 거래를 받아들였지!", "이제 넌 예전에 네가 누구였는지조차 까맣게 잊게 될 거야", "저 깊은 하데스타운 바닥에서!"]}], "slug": "18_way_down_hadestown_reprise", "filename": "18_way_down_hadestown_reprise.md", "rel_path": "act2/18_way_down_hadestown_reprise.md"}, {"id": 19, "act": 2, "title": "Flowers", "title_kr": "꽃들 (에우리디케의 회한)", "characters_en": ["Eurydice"], "characters_kr": ["에우리디케"], "synopsis": "기억이 사라져가는 공포 속에서 에우리디케가 부르는 눈물의 솔로. 오르페우스가 자신에게 안겨주었던 한 송이 붉은 카네이션 꽃을 부여잡고, '무얼 위해 내가 여기에 내려왔는가, 봄날의 햇살과 사랑이 그립다'며 슬프게 흐느낀다.", "notes": ["에바 노블자다의 절절한 감정선: 화려한 편곡 없이 오롯이 목소리 하나로 객석을 눈물짓게 만드는 명발라드."], "stanzas": [{"speaker_en": "Eurydice", "speaker_kr": "에우리디케", "lines_en": ["What I wanted was to fall asleep", "We lie on the ground, so sweet, so deep", "Remembering flowers, remembering spring", "Now I'm falling, fading away", "Remembering flowers..."], "lines_kr": ["내가 진정으로 바랐던 건 그저 편안히 잠드는 것뿐이었는데", "당신과 함께 풀밭 위에 누워있던 그 달콤하고 깊었던 잠", "그 꽃들을 기억해요, 따스했던 그 봄날을 기억해요", "이제 난 어둠 속으로 끝없이 추락하며 바래져 가네요", "그 아름다웠던 꽃들을 기억하며..."]}], "slug": "19_flowers", "filename": "19_flowers.md", "rel_path": "act2/19_flowers.md"}, {"id": 20, "act": 2, "title": "Come Home With Me (Reprise)", "title_kr": "나와 함께 집으로 가요 (리프라이즈)", "characters_en": ["Orpheus", "Eurydice"], "characters_kr": ["오르페우스", "에우리디케"], "synopsis": "암흑의 철로를 걸어 마침내 하데스타운 지하에 도달한 오르페우스! 멍하니 일하고 있던 에우리디케를 찾아내어 다시 한번 '나와 함께 집으로 갑시다'라고 손을 내민다.", "notes": ["지하에서의 기적적인 재회: 오르페우스의 목소리에 에우리디케의 잃어버렸던 기억이 되살아나는 순간."], "stanzas": [{"speaker_en": "Orpheus & Eurydice", "speaker_kr": "오르페우스 & 에우리디케", "lines_en": ["Eurydice, I found you!", "Orpheus, how did you get down here?", "I walked across the world to bring you back", "Come home with me"], "lines_kr": ["에우리디케, 내가 마침내 당신을 찾아냈소!", "오르페우스, 대체 여기까지 어떻게 걸어 내려온 거예요?", "당신을 다시 데려가기 위해 온 세상을 건너 걸어왔소", "나와 함께 집으로 돌아갑시다"]}], "slug": "20_come_home_with_me_reprise", "filename": "20_come_home_with_me_reprise.md", "rel_path": "act2/20_come_home_with_me_reprise.md"}, {"id": 21, "act": 2, "title": "Papers", "title_kr": "계약서", "characters_en": ["Hades", "Hermes", "Orpheus"], "characters_kr": ["하데스", "헤르메스", "오르페우스"], "synopsis": "두 사람의 재회를 가로막는 하데스. 하데스는 에우리디케가 서명한 계약서를 내밀며 '그녀는 제 발로 걸어 들어와 법적으로 내 소유가 되었다'며 오르페우스를 무자비하게 폭행하고 추방하려 한다.", "notes": ["법과 계약이라는 자본의 폭력: 법적 계약을 무기 삼아 인간의 영혼을 구속하는 하데스의 완고함."], "stanzas": [{"speaker_en": "Hades", "speaker_kr": "하데스", "lines_en": ["She signed the paper, son!", "She chose to come here on her own!", "A deal is a deal, a law is a law!", "She belongs to Hadestown!"], "lines_kr": ["그 아이가 직접 이 서류에 서명했단다, 애송이야!", "제 발로 걸어 들어오는 것을 스스로 선택했단 말이다!", "거래는 거래이고, 법은 엄연히 법인 법이지!", "그 아이는 이제 온전히 내 하데스타운의 소유란다!"]}], "slug": "21_papers", "filename": "21_papers.md", "rel_path": "act2/21_papers.md"}, {"id": 22, "act": 2, "title": "Nothing Changes", "title_kr": "변하는 건 아무것도 없어", "characters_en": ["The Fates"], "characters_kr": ["운명의 여신들"], "synopsis": "피투성이가 된 채 절망하는 오르페우스에게 운명의 여신들이 냉소적으로 쏘아붙인다. '신들에게 덤벼봤자 세상은 아무것도 변하지 않는다'며 포기하라고 비웃는다.", "notes": ["냉소주의와 숙명론의 절정: 체념을 강요하는 세상의 목소리를 대변."], "stanzas": [{"speaker_en": "The Fates", "speaker_kr": "운명의 여신들", "lines_en": ["Why bother trying when nothing changes?", "The world is what it is, accept your fate!", "Bow your head and walk away!", "Nothing changes!"], "lines_kr": ["어차피 변하는 건 아무것도 없는데 왜 헛수고를 해?", "세상은 원래 이런 법이야, 네 비참한 운명을 순순히 받아들여!", "고개를 숙이고 얌전히 돌아가시지!", "변하는 건 아무것도 없어!"]}], "slug": "22_nothing_changes", "filename": "22_nothing_changes.md", "rel_path": "act2/22_nothing_changes.md"}, {"id": 23, "act": 2, "title": "If It's True", "title_kr": "만약 그것이 사실이라면", "characters_en": ["Orpheus", "Hermes", "Company"], "characters_kr": ["오르페우스", "헤르메스", "앙상블"], "synopsis": "절망의 밑바닥에서 오르페우스가 부르는 위대한 각성 넘버. '만약 부유한 자들이 가난한 자들을 짓밟는 것이 세상의 법칙이라면, 난 결코 그런 부조리한 세상을 받아들이지 않겠다'고 포효한다. 그의 외침에 지하 광산의 일꾼들이 하나둘 고개를 들며 저항의 연대가 싹튼다.", "notes": ["혁명의 불씨: 순진한 소년이었던 오르페우스가 억압받는 모든 일꾼들을 깨우는 혁명적 가객으로 거듭나는 명장면."], "stanzas": [{"speaker_en": "Orpheus & Company", "speaker_kr": "오르페우스 & 앙상블", "lines_en": ["If it's true what they say, that we have no choice", "I will raise my voice against the dark!", "We are not machines, we are flesh and blood!", "Stand up, stand up, we are not alone!"], "lines_kr": ["우리에게 다른 선택의 여지가 없다는 저들의 말이 만약 사실이라면", "난 저 거대한 어둠에 맞서 내 목소리를 높이 치켜들겠소!", "우린 기계가 아니오, 우린 피와 살을 지닌 존엄한 인간이오!", "일어나시오, 다 함께 일어나시오, 우린 결코 혼자가 아니오!"]}], "slug": "23_if_its_true", "filename": "23_if_its_true.md", "rel_path": "act2/23_if_its_true.md"}, {"id": 24, "act": 2, "title": "How Long?", "title_kr": "도대체 언제까지?", "characters_en": ["Persephone", "Hades"], "characters_kr": ["페르세포네", "하데스"], "synopsis": "오르페우스의 저항을 보며 가슴이 찢어진 페르세포네가 남편 하데스에게 정면으로 맞선다. '도대체 언제까지 공포와 장벽으로 세상을 다스릴 셈인가? 소년이 부르는 노래를 한 번만이라도 들어보라'고 눈물로 호소한다.", "notes": ["부부의 비극적 대치: 차가운 독재자가 된 남편의 잃어버린 심장을 되찾아주려는 페르세포네의 간절한 설득."], "stanzas": [{"speaker_en": "Persephone & Hades", "speaker_kr": "페르세포네 & 하데스", "lines_en": ["How long will you turn your heart to stone?", "I built this kingdom to keep you safe!", "You built a prison and called it love!", "Let the boy sing, Hades, let him sing!"], "lines_kr": ["도대체 언제까지 당신의 심장을 차가운 돌덩이로 내버려 둘 셈인가요?", "난 당신을 안전하게 지키기 위해 이 위대한 왕국을 세웠을 뿐이오!", "당신은 숨 막히는 감옥을 지어놓고 그걸 사랑이라 부르고 있잖아요!", "저 소년에게 노래할 기회를 줘요, 하데스, 제발 노래하게 해줘요!"]}], "slug": "24_how_long", "filename": "24_how_long.md", "rel_path": "act2/24_how_long.md"}, {"id": 25, "act": 2, "title": "Chant (Reprise)", "title_kr": "챈트 (리프라이즈 - 폭풍전야)", "characters_en": ["Hermes", "Orpheus", "Hades", "Persephone", "Eurydice", "Company"], "characters_kr": ["헤르메스", "오르페우스", "하데스", "페르세포네", "에우리디케", "앙상블"], "synopsis": "하데스 앞에서 결전을 앞둔 긴박한 앙상블 리프라이즈. 일꾼들은 동요하고, 하데스는 흔들리는 왕좌를 지키려 하며, 오르페우스는 신들을 울릴 노래를 준비한다.", "notes": ["극도의 서스펜스: 모든 주요 인물들의 갈등과 긴장이 폭발 직전까지 고조되는 다성 음악."], "stanzas": [{"speaker_en": "Company", "speaker_kr": "앙상블", "lines_en": ["The wall is cracking, the wind is howling!", "Will the king show mercy, or will blood be spilled?", "Sing for your life, Orpheus!", "Chant!"], "lines_kr": ["장벽에 금이 가고, 칼바람이 거세게 울부짖는다!", "제왕이 자비를 베풀 것인가, 아니면 피비린내 나는 학살이 벌어질 것인가?", "너의 목숨을 걸고 노래하라, 오르페우스여!", "챈트!"]}], "slug": "25_chant_reprise", "filename": "25_chant_reprise.md", "rel_path": "act2/25_chant_reprise.md"}, {"id": 26, "act": 2, "title": "Epic III", "title_kr": "에픽 III (하데스의 눈물)", "characters_en": ["Orpheus", "Hades", "Persephone", "Company"], "characters_kr": ["오르페우스", "하데스", "페르세포네", "앙상블"], "synopsis": "뮤지컬의 가장 숭고한 기적의 순간. 마침내 완성된 노래를 들고 하데스 앞에 선 오르페우스가 천상의 '라라라' 멜로디를 부른다. 차갑게 얼어붙어 있던 하데스의 마음속에서 페르세포네를 처음 보았을 때의 뜨거운 첫사랑의 감정이 되살아나고, 하데스와 페르세포네는 수백 년 만에 서로를 안고 눈물의 왈츠를 춘다.", "notes": ["예술이 죽음의 신을 울린 순간: 인간의 진실한 노래가 지옥의 독재자를 무릎 꿇리고 감동시키는 그리스 신화 최고의 클라이맥스."], "stanzas": [{"speaker_en": "Orpheus", "speaker_kr": "오르페우스", "lines_en": ["Do you remember the love you felt?", "When the world was young and full of grace?", "You loved her then, and you love her now", "Let her walk in the sunshine again"     let currentSongId = 1;
    let currentAct = 'all';
    let currentMode = 'bilingual';

    function init() {
      renderSongList();
      loadSong(1);
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function setActFilter(act) {
      currentAct = act;
      document.getElementById('tabAll').classList.toggle('active', act === 'all');
      document.getElementById('tabAct1').classList.toggle('active', act === 1);
      document.getElementById('tabAct2').classList.toggle('active', act === 2);
      renderSongList();
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function renderSongList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('songListContainer');
      container.innerHTML = '';

      songsData.forEach(s => {
        if (currentAct !== 'all' && s.act !== currentAct) return;
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchChar = (s.characters_en || []).some(c => c.toLowerCase().includes(query)) ||
                            (s.characters_kr || []).some(c => c.toLowerCase().includes(query));
          const matchLyric = s.stanzas.some(st => 
            st.lines_en.some(l => l.toLowerCase().includes(query)) || 
            st.lines_kr.some(l => l.toLowerCase().includes(query))
          );
          if (!matchTitle && !matchChar && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => {
          loadSong(s.id);
          closeSidebar();
        };

        item.innerHTML = `
          <div class="song-badge-row">
            <span class="song-num">Track ${String(s.id).padStart(2, '0')}</span>
            <span class="song-act-tag">${s.act}막</span>
          </div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function loadSong(id) {
      currentSongId = id;
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Act ${song.act} · Track ${String(song.id).padStart(2, '0')} / 33`;

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & Mythology)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const charsKr = (song.characters_kr || []).join(', ');
      const charsEn = (song.characters_en || []).join(', ');

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
          <div class="song-meta-box">
            <div class="song-meta-item"><strong>막(Act):</strong> 제${song.act}막</div>
            <div class="song-meta-item"><strong>등장인물/보컬:</strong> ${charsKr} (${charsEn})</div>
          </div>
        </div>
        <div class="synopsis-box">
          <strong>📖 신화적·드라마적 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
  </script>
