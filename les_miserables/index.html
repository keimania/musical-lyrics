stanzas": [{"speaker_en": "Fantine", "speaker_kr": "팡틴", "lines_en": ["I dreamed a dream in time gone by", "When hope was high and life worth living", "I dreamed that love would never die", "I dreamed that God would be forgiving", "Then I was young and unafraid", "And dreams were made and used and wasted", "There was no ransom to be paid", "No song unsung, no wine untasted"], "lines_kr": ["지나간 옛 시절에 난 찬란한 꿈을 꾸었었지", "희망은 드높았고 인생은 살아갈 만한 가치로 넘쳐났던 그 시절", "영원히 사랑은 죽지 않을 것이라 꿈꾸었고", "자비로우신 하나님께서 모든 것을 용서해 주시리라 믿었었지", "그때 난 젊었고 두려울 것 하나 없었으며", "수많은 꿈들이 피어나고 누려지고 소모되었지", "치러야 할 혹독한 대가 따위는 존재하지 않았고", "불리지 않은 노래도, 맛보지 못한 달콤한 포도주도 없었건만"]}, {"speaker_en": "Fantine", "speaker_kr": "팡틴", "lines_en": ["But the tigers come at night", "With their voices soft as thunder", "As they tear your hope apart", "And they turn your dream to shame", "I had a dream my life would be", "So different from this hell I'm living", "So different now from what it seemed", "Now life has killed the dream I dreamed"], "lines_kr": ["하지만 잔혹한 맹수들은 깊은 밤중에 소리 없이 들이닥쳐", "천둥처럼 은밀하고 위협적인 목소리를 으르렁거리며", "너의 가녀린 희망을 갈가리 찢어발기고", "너의 순수했던 꿈을 씻을 수 없는 수치심으로 짓밟아버리지", "내 삶이 이토록 지옥 같은 비참함과는", "전혀 다른 눈부신 인생이 될 것이라 난 꿈꾸었건만", "그 옛날 꿈꾸었던 것과는 너무나도 달라져 버린 지금", "잔혹한 세상이 내가 꾸었던 모든 꿈을 무참히 죽여버렸구나"]}], "slug": "04_i_dreamed_a_dream", "filename": "04_i_dreamed_a_dream.md", "rel_path": "act1/04_i_dreamed_a_dream.md"}, {"id": 5, "act": 1, "title": "Lovely Ladies", "title_kr": "사랑스러운 아가씨들 (사창가의 비극)", "characters_en": ["Fantine", "Sailors", "Prostitutes"], "characters_kr": ["팡틴", "선원들", "창녀들"], "synopsis": "딸 코제트의 약값을 대기 위해 결국 부두가의 사창가로 흘러 들어온 팡틴. 늙고 지친 선원들과 술 취한 고객들에게 몸을 파는 비참한 나락으로 떨어진다.", "notes": ["사회 밑바닥 여성들의 현실: 빅토르 위고가 고발한 19세기 프랑스 빈곤 여성들의 잔혹한 인권 유린."], "stanzas": [{"speaker_en": "Prostitutes & Sailors", "speaker_kr": "창녀들 & 선원들", "lines_en": ["Lovely ladies, waiting for a bite", "Ready for the trade, ready for the night!", "Don't look at my face, just pay the price!", "Lovely ladies!"], "lines_kr": ["사랑스러운 아가씨들이 손님을 기다리고 있네", "거래를 ", "lines_en": ["Cosette, it's turned so cold, where are you playing?", "Be still, for I am here, she is safe in God's keeping", "Promise me you'll protect her, Monsieur Madeleine!", "I pledge my life to guard your child", "Her shadow will be gently blessed", "Sleep now, and take your rest"], "lines_kr": ["코제트야, 날이 너무 차가워졌구나, 내 딸은 어디서 놀고 있니?", "안심하시오, 내가 여기 있소, 당신의 아이는 하나님의 품 안에서 안전할 것이오", "약속해 주세요, 내 아이를 지켜주시겠다고, 마들렌 시장님!", "내 목숨을 바쳐 당신의 아이를 끝까지 지켜낼 것을 맹세하오", "그 아이의 발걸음마다 온화한 축복이 내리게 하리다", "이제 편히 눈을 감고, 영원한 안식을 누리시오"]}], "slug": "07_come_to_me_fantines_death", "filename": "07_come_to_me_fantines_death.md", "rel_path": "act1/07_come_to_me_fantines_death.md"}, {"id": 8, "act": 1, "title": "The Confrontation", "title_kr": "대결 (자베르와 장발장)", "characters_en": ["Javert", "Jean Valjean"], "characters_kr": ["자베르", "장발장"], "synopsis": "팡틴의 시신 앞에서 맞닥뜨린 자베르와 장발장. 장발장은 아이를 구하기 위해 딱 사흘의 시간만 달라고 애원하지만, 자베르는 '도둑놈은 결코 변하지 않는다'며 곤봉을 빼어 들고 체포하려 한다. 두 사람의 전혀 다른 신념과 가치관이 숨 막히는 카논 듀엣으로 정면충돌한다.", "notes": ["자비(Grace) 대 율법(Law): 성경적 용서의 화신 장발장과 엄격한 법률주의의 화신 자베르의 숙명적 대치."], "stanzas": [{"speaker_en": "Javert & Valjean", "speaker_kr": "자베르 & 장발장", "lines_en": ["Valjean, at last, we see each other plain!", "Before you say another word, Javert, hear me out!", "You know nothing of Javert, I was born inside a jail!", "There is none but me who can intercede for that dying child!", "Men like me can never change, men like you can never change!", "I am warning you, Javert, I am stronger than you!"], "lines_kr": ["장발장, 마침내 너와 내가 숨김없이 정면으로 마주하는구나!", "더 말하기 전에 내 말을 들어주시오, 자베르, 자비를 베풀어주시오!", "넌 자베르에 대해 아무것도 모른다, 난 감옥 안에서 죄수의 자식으로 태어났다!", "저 가엾게 죽어간 여인의 아이를 구해낼 사람은 오직 나 하나뿐이오!", "나 같은 사람은 결코 물러서지 않고, 너 같은 도둑놈은 결코 변할 수 없는 법이다!", "경고하건대 자베르, 내 힘은 당신 따위보다 훨씬 강하오!"]}], "slug": "08_the_confrontation", "filename": "08_the_confrontation.md", "rel_path": "act1/08_the_confrontation.md"}, {"id": 9, "act": 1, "title": "Castle on a Cloud", "title_kr": "구름 위의 성 (어린 코제트의 꿈)", "characters_en": ["Young Cosette", "Mme Thénardier"], "characters_kr": ["어린 코제트", "테나르디에 부인"], "synopsis": "테나르디에 부부의 여관에서 온갖 학대와 구박을 받으며 허드렛일을 하는 어린 코제트. 빗자루를 쥐고 어두운 방에서 '슬픔도 눈물도 없고 엄마가 날 따뜻하게 안아주는 구름 위의 성'을 그리며 순수하고 애처로운 동요를 부른다.", "notes": ["가장 순수한 동심의 비가: 테나르디에 부인의 날카로운 고함과 대비되는 가녀린 아이의 멜로디."], "stanzas": [{"speaker_en": "Young Cosette", "speaker_kr": "어린 코제트", "lines_en": ["There is a castle on a cloud", "I like to go there in my sleep", "Aren't any floors for me to sweep", "Not in my castle on a cloud", "There is a lady all in white", "Holds me and sings a lullaby"], "lines_kr": ["저 높은 구름 위에 신비로운 성이 하나 있어요", "난 잠들 때마다 꿈속에서 그곳으로 날아가곤 하죠", "그곳엔 내가 닦아야 할 차가운 마룻바닥 같은 건 없어요", "구름 위에 떠 있는 나의 아름다운 성에는요", "그곳엔 온통 새하얀 옷을 입은 천사 같은 여인이 계셔서", "날 품에 꼭 안아주며 다정한 자장가를 불러주시죠"]}], "slug": "09_castle_on_a_cloud", "filename": "09_castle_on_a_cloud.md", "rel_path": "act1/09_castle_on_a_cloud.md"}, {"id": 10, "act": 1, "title": "Master of the House", "title_kr": "여관집 주인 (테나르디에의 사기극)", "characters_en": ["Thénardier", "Mme Thénardier", "Customers"], "characters_kr": ["테나르디에", "테나르디에 부인", "손님들"], "synopsis": "극의 분위기를 유쾌하게 반전시키는 최고의 코믹 앙상블 넘버. 탐욕스럽고 비열한 여관 주인 테나르디에 부부가 손님들의 주머니를 털고, 술에 물을 타고, 시체 주머니를 뒤지며 부리는 온갖 사기 수법을 익살맞고 경쾌한 왈츠풍으로 자랑한다.", "notes": ["인간 탐욕의 블랙 코미디: 가장 비열하고 천박한 인간 군상을 최고의 오락적 엔터테인먼트로 승화시킨 명장면."], "stanzas": [{"speaker_en": "Thénardier & Customers", "speaker_kr": "테나르디에 & 손님들", "lines_en": ["Master of the house, keeper of the zoo", "Ready with a handshake and an open palm!", "Watering down the wine, charging for the lice", "Everybody loves a landlord who is nice!", "Master of the house!"], "lines_kr": ["이 여관의 위대한 주인이자 동물원 관리인이요", "한 손으론 반갑게 악수하고, 다른 손바닥은 돈을 뜯어내려 활짝 펴지!", "포도주엔 슬그머니 수돗물을 타고, 벼룩 값까지 꼼꼼히 청구하지", "친절하고 사람 좋은 여관집 주인을 세상 누가 마다하겠소!", "여관의 위대한 주인이로다!"]}], "slug": "10_master_of_the_house", "filename": "10_master_of_the_house.md", "rel_path": "act1/10_master_of_the_house.md"}, {"id": 11, "act": 1, "title": "The Bargain / The Waltz of Treachery", "title_kr": "흥정 / 배신의 왈츠", "characters_en": ["Thénardier", "Mme Thénardier", "Jean Valjean"], "characters_kr": ["테나르디에", "테나르디에 부인", "장발장"], "synopsis": "숲속에서 물동이를 든 코제트를 구해 데려온 장발장. 코제트를 입양하려 하자 테나르디에 부부는 '그동안 친딸처럼 키웠다'며 뻔뻔하게 엄청난 양육비 보상금을 요구한다. 장발장은 거액의 금화를 던져주고 마침내 코제트를 품에 안고 파리로 향한다.", "notes": ["코제트의 해방: 학대의 굴레에서 벗어나 진정한 아버지 장발장의 사랑 안으로 들어가는 순간."], "stanzas": [{"speaker_en": "Valjean & Thénardiers", "speaker_kr": "장발장 & 테나르디에 부부", "lines_en": ["I found her shivering in the dark, she comes with me", "Cosette has been like our own child, it breaks our heart!", "Enough of your talk, here is fifteen hundred francs!", "Come, Cosette, you have a father now"], "lines_kr": ["내가 어둠 속에서 떨고 있던 아이를 찾았소, 이 아이는 나와 함께 갈 것이오", "코제트는 우리 친딸이나 다름없었는데, 보내려니 억장이 무너집니다요!", "더 이상의 뻔뻔한 수작은 그만두시오, 여기 천오백 프랑의 금화요!", "가자, 코제트야, 이제 너에게도 널 지켜줄 아버지가 있단다"]}], "slug": "11_the_bargain_waltz", "filename": "11_the_bargain_waltz.md", "rel_path": "act1/11_the_bargain_waltz.md"}, {"id": 12, "act": 1, "title": "Look Down (Beggars of Paris)", "title_kr": "눈을 내리깔아라 (파리의 거지들)", "characters_en": ["Gavroche", "Beggars", "Enjolras", "Marius"], "characters_kr": ["가브로슈", "거지들", "앙졸라", "마리우스"], "synopsis": "1832년 파리. 7월 혁명 이후에도 빈부격차와 콜레라로 신음하는 민중들의 분노가 임계점에 달한다. 골목대장 꼬마 가브로슈가 파리의 빈민가를 안내하고, 공화주의 혁명 청년단 'ABC의 벗들'을 이끄는 카리스마 넘치는 학생 리더 앙졸라와 정의로운 귀족 청년 마리우스가 등장한다.", "notes": ["프랑스 혁명의 기운: 라마르크 장군의 임종과 함께 폭발할 1832년 6월 봉기의 도화선이 깔리는 대서사 오프닝."], "stanzas": [{"speaker_en": "Gavroche & Enjolras", "speaker_kr": "가브로슈 & 앙졸라", "lines_en": ["How do you do? My name is Gavroche!", "These are my people, here's my patch!", "Lamarque is ill, the people's general is dying!", "When he goes, the spark will turn into a flame!", "Look down, look down, upon your fellow man!"], "lines_kr": ["다들 안녕하십니까? 내 이름은 가브로슈라고 하오!", "여기 이 가난한 자들이 내 식구들이고, 이 골목이 내 구역이지요!", "민중의 유일한 희망이셨던 라마르크 장군께서 위독하시다!", "그분이 서거하시는 날, 작은 불씨는 거대한 혁명의 불길로 타오를 것이다!", "고개를 숙여라, 고통받는 동포들의 비참한 현실을 똑똑히 바라보라!"]}], "slug": "12_look_down_paris", "filename": "12_look_down_paris.md", "rel_path": "act1/12_look_down_paris.md"}, {"id": 13, "act": 1, "title": "Stars", "title_kr": "별들 (자베르의 맹세)", "characters_en": ["Javert"], "characters_kr": ["자베르 (필립 퀘스트)"], "synopsis": "파리 시경의 총경이 된 자베르가 밤하늘의 차가운 별들을 우러러보며 부르는 웅장한 아리아. 질서와 궤도를 결코 벗어나지 않는 밤하늘의 별들처럼, 하나님이 정하신 엄격한 정의와 법률의 명령을 받들어 탈옥수 장발장을 기필코 다시 잡아 지옥의 감옥으로 처넣겠노라 맹세한다.", "notes": ["필립 퀘스트(Philip Quast)의 경이로운 바리톤: 흔들림 없는 신념과 엄격한 도덕주의를 신성한 경지로 표현한 악역 최고의 찬가."], "stanzas": [{"speaker_en": "Javert", "speaker_kr": "자베르", "lines_en": ["There, out in the darkness, a fugitive running", "Fallen from God, fallen from grace", "God be my witness, I never shall yield", "Till we come face to face, till we come face to face!", "Stars in your multitudes, scarce to be counted", "Filling the darkness with order and light", "You are the sentinels, silent and sure", "Keeping watch in the night!", "Lord, let me find him, that I may see him safe behind bars!", "This I swear by the stars!"], "lines_kr": ["저기, 저 짙은 칠흑 같은 어둠 속에서 한 명의 도망자가 숨차게 달리고 있구나", "하나님으로부터 버림받고, 거룩한 은총의 자리에서 추락한 죄인이", "하나님이 내 증인이시니, 난 결코 물러서거나 굴복하지 않으리라", "우리가 다시 정면으로 마주하는 그날까지, 너와 내가 다시 부딪힐 그날까지!", "저 밤하늘을 수놓은 무수한 별들이여, 차마 헤아릴 수조차 없는 별빛들이여", "질서와 차가운 빛으로 온 어둠을 빈틈없이 채우고 있는 그대들", "그대들은 침묵 속에서 결코 흔들림 없는 충직한 파수꾼들이니", "깊은 밤을 빈틈없이 지키고 감시하고 있구나!", "주여, 내게 그놈을 찾아내게 하소서, 그놈이 차가운 쇠창살 뒤에 갇힌 꼴을 내 두 눈으로 보게 하소서!", "저 높은 밤하늘의 별들에게 난 엄숙히 맹세하노라!"]}], "slug": "13_stars", "filename": "13_stars.md", "rel_path": "act1/13_stars.md"}, {"id": 14, "act": 1, "title": "ABC Café / Red and Black", "title_kr": "ABC 카페 / 붉은색과 검은색", "characters_en": ["Enjolras", "Marius", "Students"], "characters_kr": ["앙졸라", "마리우스", "학생들"], "synopsis": "ABC 카페에 모인 청년 혁명가들. 앙졸라가 라마르크 장군의 서거 소식을 전하며 바리케이드를 쌓고 봉기를 일으키자고 선동하지만, 거리에서 우연히 마주친 숙녀 코제트에게 첫눈에 반한 마리우스는 사랑의 열병에 빠져 있다. 앙졸라는 '사랑 놀음에 취해 있을 때가 아니다. 붉은색은 분노한 민중의 피요, 검은색은 암흑 같은 억압의 시대를 끝장낼 혁명의 색'이라며 전우들을 결집한다.", "notes": ["청춘의 이상과 혁명의 기치: 로맨스와 혁명적 대의의 뜨거운 긴장감을 드라마틱한 멜로디로 교차시킨 명곡."], "stanzas": [{"speaker_en": "Enjolras & Marius", "speaker_kr": "앙졸라 & 마리우스", "lines_en": ["Red, the blood of angry men!", "Black, the dark of ages past!", "Red, a world about to dawn!", "Black, the night that ends at last!", "Will you join in our crusade?", "Who will be strong and stand with me?"], "lines_kr": ["붉은색, 분노한 민중들의 끓어오르는 피요!", "검은색, 지나간 암흑의 시대가 남긴 짙은 어둠이라!", "붉은색, 마침내 눈부시게 밝아올 새로운 세상의 여명이요!", "검은색, 마침내 끝장나게 될 기나긴 압제의 밤이라!", "그대들은 우리의 거룩한 성전에 동참할 것인가?", "누가 용기를 내어 나와 함께 당당히 맞서 서겠는가?"]}], "slug": "14_red_and_black", "filename": "14_red_and_black.md", "rel_path": "act1/14_red_and_black.md"}, {"id": 15, "act": 1, "title": "Do You Hear the People Sing?", "title_kr": "민중의 노랫소리가 들리는가?", "characters_en": ["Enjolras", "Students", "Citizens"], "characters_kr": ["앙졸라", "학생들", "파리 시민들"], "synopsis": "인류 역사상 가장 위대한 저항의 앤섬(Anthem). 장례 행렬을 따라 거대한 붉은 깃발을 앞세운 학생들이 파리 거리로 쏟아져 나온다. '더 이상 노예로 살 수 없다고 분노한 민중들의 심장 박동 소리가 들리는가? 바리케이드 너머로 내일의 태양이 떠오르리라!'라며 온 파리 시민들이 합창에 동참한다.", "notes": ["전 세계 민주화 운동의 상징가: 홍콩, 한국, 프랑스, 미국 등 자유와 저항을 외치는 전 세계 모든 시위 현장에서 불리는 불멸의 행진곡."], "stanzas": [{"speaker_en": "Enjolras & Company", "speaker_kr": "앙졸라 & 전원", "lines_en": ["Do you hear the people sing?", "Singing a song of angry men?", "It is the music of a people who will not be slaves again!", "When the beating of your heart echoes the beating of the drums", "There is a life about to start when tomorrow comes!"], "lines_kr": ["민중들의 노랫소리가 들리는가?", "분노한 사람들의 뜨거운 노랫소리가 들리는가?", "이것은 다시는 결코 노예로 살지 않겠다고 결의한 위대한 민중의 음악이라!", "그대의 심장 박동 소리가 저 우렁찬 북소리에 맞추어 메아리칠 때", "마침내 내일의 여명이 밝아올 때, 완전히 새로운 삶이 시작되리라!"]}], "slug": "15_do_you_hear_the_people_sing", "filename": "15_do_you_hear_the_people_sing.md", "rel_path": "act1/15_do_you_hear_the_people_sing.md"}, {"id": 16, "act": 1, "title": "In My Life & A Heart Full of Love", "title_kr": "내 인생에서 & 사랑으로 가득 찬 가슴", "characters_en": ["Cosette", "Marius", "Éponine"], "characters_kr": ["코제트", "마리우스", "에포닌"], "synopsis": "플뤼메 거리의 저택 정원. 마리우스를 짝사랑하는 에포닌이 가슴이 찢어지는 아픔을 참으며 마리우스를 코제트의 집 앞으로 안내한다. 철창문을 사이에 두고 코제트와 마리우스가 순수한 사랑의 이중창을 나누고, 담벼락 밖에서 홀로 남겨진 에포닌이 눈물을 흘리며 3중창의 애절함을 완성한다.", "notes": ["레아 살롱가(Lea Salonga)의 눈물어린 에포닌: 사랑하는 사람의 행복을 위해 자신의 사랑을 희생해야 하는 비극적 삼각관계."], "stanzas": [{"speaker_en": "Marius, Cosette & Éponine", "speaker_kr": "마리우스, 코제트 & 에포닌", "lines_en": ["A heart full of love, a heart full of song", "I'm doing everything all wrong", "These words of love are not for me", "A heart full of love, no fear, no regret", "My heart was full of you"], "lines_kr": ["사랑으로 가득 찬 가슴, 찬란한 노래로 가득 채워진 내 마음", "난 모든 것을 그르치고 망쳐버리고 있구나", "저 달콤한 사랑의 밀어들은 결코 날 향한 것이 아닌데", "사랑으로 가득 찬 가슴, 더 이상의 두려움도 후회도 없이", "내 가슴속은 오직 너 하나로만 가득 차 있었는데"]}], "slug": "16_in_my_life_a_heart_full_of_love", "filename": "16_in_my_life_a_heart_full_of_love.md", "rel_path": "act1/16_in_my_life_a_heart_full_of_love.md"}, {"id": 17, "act": 1, "title": "The Attack on Rue Plumet", "title_kr": "플뤼메 거리의 습격", "characters_en": ["Thénardier", "Éponine", "Marius"], "characters_kr": ["테나르디에", "에포닌", "마리우스"], "synopsis": "장발장의 부유한 저택을 털기 위해 패거리를 이끌고 침입하려던 테나르디에. 딸 에포닌이 비명을 지르며 침입을 막아서고, 놀란 장발장은 자베르가 자신을 찾아냈다고 오해하여 코제트와 함께 영국으로 망명할 짐을 싼다.", "notes": ["위기의 고조: 마리우스와 코제트의 생이별과 혁명의 전야가 맞물리는 긴박한 전환점."], "stanzas": [{"speaker_en": "Éponine & Thénardier", "speaker_kr": "에포닌 & 테나르디에", "lines_en": ["One more step and I scream!", "You little brat, shut your mouth!", "I will scream! Somebody help!", "Get out, the cops are coming!"], "lines_kr": ["한 발짝만 더 다가오면 온 동네가 떠나가라 비명을 지를 거야!", "이 배은망덕한 계집애가, 당장 그 주둥이 닥치지 못해!", "소리 지를 거야! 거기 누구 없어요, 도와주세요!", "다들 도망쳐, 경찰들이 몰려온다!"]}], "slug": "17_the_attack_on_rue_plumet", "filename": "17_the_attack_on_rue_plumet.md", "rel_path": "act1/17_the_attack_on_rue_plumet.md"}, {"id": 18, "act": 1, "title": "One Day More", "title_kr": "내일로 (원 데이 모어)", "characters_en": ["Company"], "characters_kr": ["전원"], "synopsis": "뮤지컬 역사를 통틀어 가장 압도적이고 완벽한 1막 피날레의 정점. 내일이면 영국으로 떠나야 하는 장발장, 생이별 앞에 바리케이드로 향하는 마리우스와 코제트, 짝사랑의 고통 속에 남장을 하고 전장으로 향하는 에포닌, 혁명의 깃발을 올리는 앙졸라와 학생들, 스파이로 잠입하는 자베르, 혼란을 틈타 시체를 털려는 테나르디에 부부까지. 8개의 서로 다른 독립된 멜로디와 대사가 하나의 거대한 푸가 대합창으로 폭발하며 '내일이면 운명이 결정되리라!'고 진군한다.", "notes": ["다성 음악의 기 es_en": ["I love him, but only on my own", "I love him, but when the night is over", "He is gone, the river's just a river", "Without him, the world around me changes", "The trees are bare and everywhere the streets are full of strangers", "I love him, but every day I'm learning", "All my life I've only been pretending", "Without me, his world will go on turning", "A world that's full of happiness that I have never known", "I love him, I love him, I love him... but only on my own"], "lines_kr": ["난 그를 사랑해요, 하지만 오직 나 홀로만의 사랑일 뿐", "난 그를 온 마음 다해 사랑하지만, 이 밤이 끝나고 나면", "그는 신기루처럼 사라지고, 강물은 그저 차가운 강물에 불과하지요", "그가 없는 세상에서, 내 주위의 모든 것은 낯설게 변해버려요", "가로수 잎은 앙상하게 말라비틀어지고 거리마다 차가운 타인들만 가득할 뿐", "난 그를 사랑하지만, 날마다 뼈아프게 깨달아가고 있어요", "내 평생 동안 난 그저 부질없는 거짓 상상에만 매달려왔다는 것을", "내가 없어도, 그의 세상은 아무 일 없다는 듯 눈부시게 돌아갈 테죠", "난 단 한 번도 누려보지 못한 찬란한 행복으로 가득 찬 그 사람만의 세상이", "난 그를 사랑해요, 너무나 사랑해요, 사랑하지만... 오직 나 홀로일 뿐이에요"]}], "slug": "19_building_the_barricade_on_my_own", "filename": "19_building_the_barricade_on_my_own.md", "rel_path": "act2/19_building_the_barricade_on_my_own.md"}, {"id": 20, "act": 2, "title": "At the Barricade", "title_kr": "바리케이드에서", "characters_en": ["Enjolras", "Javert", "Students"], "characters_kr": ["앙졸라", "자베르", "학생들"], "synopsis": "바리케이드 안으로 정찰병으로 위장 잠입한 자베르 경감. '정부군의 공격 계획을 알아왔다'고 거짓 보고하지만, 꼬마 가브로슈가 그를 알아보고 '이자는 악명 높은 경찰 스파이다!'라고 폭로하여 자베르는 체포되어 포박당한다.", "notes": ["가브로슈의 기지: 어른들보다 영리한 거리의 소년 가브로슈가 스파이를 색출하는 통쾌한 장면."], "stanzas": [{"speaker_en": "Gavroche & Enjolras", "speaker_kr": "가브로슈 & 앙졸라", "lines_en": ["Liar! Good evening, dear Inspector!", "Don't listen to this man, he's a spy!", "Tie him up, put him in the tavern!", "You will die with the rest of your dogs!"], "lines_kr": ["새빨간 거짓말! 안녕하신가, 존경하는 형사 양반!", "이놈의 말을 믿지 마세요, 이자는 경찰 스파이 자베르라고요!", "이자를 꽁꽁 묶어서 저 주막 안쪽에 가두어라!", "너 역시 네 하수인들과 함께 비참한 최후를 맞게 될 것이다!"]}], "slug": "20_at_the_barricade", "filename": "20_at_the_barricade.md", "rel_path": "act2/20_at_the_barricade.md"}, {"id": 21, "act": 2, "title": "A Little Fall of Rain",     let currentSongId = 1;
    let currentAct = 'all';
    let currentMode = 'bilingual';

    function init() {
      renderSongList();
      loadSong(1);
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function setActFilter(act) {
      currentAct = act;
      document.getElementById('tabAll').classList.toggle('active', act === 'all');
      document.getElementById('tabAct1').classList.toggle('active', act === 1);
      document.getElementById('tabAct2').classList.toggle('active', act === 2);
      renderSongList();
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function renderSongList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('songListContainer');
      container.innerHTML = '';

      songsData.forEach(s => {
        if (currentAct !== 'all' && s.act !== currentAct) return;
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchChar = (s.characters_en || []).some(c => c.toLowerCase().includes(query)) ||
                            (s.characters_kr || []).some(c => c.toLowerCase().includes(query));
          const matchLyric = s.stanzas.some(st => 
            st.lines_en.some(l => l.toLowerCase().includes(query)) || 
            st.lines_kr.some(l => l.toLowerCase().includes(query))
          );
          if (!matchTitle && !matchChar && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => {
          loadSong(s.id);
          closeSidebar();
        };

        item.innerHTML = `
          <div class="song-badge-row">
            <span class="song-num">Track ${String(s.id).padStart(2, '0')}</span>
            <span class="song-act-tag">${s.act}막</span>
          </div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function loadSong(id) {
      currentSongId = id;
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Act ${song.act} · Track ${String(song.id).padStart(2, '0')} / 34`;

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & Themes)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const charsKr = (song.characters_kr || []).join(', ');
      const charsEn = (song.characters_en || []).join(', ');

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
          <div class="song-meta-box">
            <div class="song-meta-item"><strong>막(Act):</strong> 제${song.act}막</div>
            <div class="song-meta-item"><strong>등장인물/보컬:</strong> ${charsKr} (${charsEn})</div>
          </div>
        </div>
        <div class="synopsis-box">
          <strong>📖 역사적·드라마적 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
  </script>
</body>
</html>
