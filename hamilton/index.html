gton", "lines_en": ["I need my right hand man back!"], "lines_kr": ["내 오른팔이 돌아와야겠군!"]}, {"key": "18:40-43", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["Ah! Uh, get ya right hand man back", "You know you gotta get ya right hand man back", "I mean you gotta put some thought into the letter but the sooner the better", "To get your right hand man back!"], "lines_kr": ["아! 그래, 오른팔을 다시 데려오십시오", "각하의 오른팔을 반드시 되찾아야 합니다", "편지에 공을 좀 들이셔야겠지만 빠르면 빠를수록 좋습니다", "각하의 오른팔을 되찾으려면요!"]}, {"key": "18:44-51", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Alexander Hamilton", "Troops are waiting in the field for you", "If you join us right now, together we can turn the tide", "Oh, Alexander Hamilton", "I have soldiers that will yield for you", "If we manage to get this right", "They’ll surrender by early light", "The world will never be the same, Alexander…"], "lines_kr": ["알렉산더 해밀턴", "전선의 병사들이 자네를 기다리고 있네", "지금 우리와 함께한다면, 전세를 단숨에 뒤집을 수 있어", "오, 알렉산더 해밀턴", "자네를 기꺼이 따를 병사들을 내어주겠네", "만약 우리가 이번 작전을 성공시킨다면", "동이 틀 무렵 놈들은 항복할 걸세", "세상은 다시는 예전 같지 않을 것이네, 알렉산더…"]}]}, {"id": 19, "act": 1, "title": "History Has Its Eyes On You", "title_kr": "역사가 당신을 지켜보고 있다", "characters_kr": ["알렉산더 해밀턴", "남성 앙상블", "앙상블 전체", "조지 워싱턴"], "characters_en": ["Alexander Hamilton", "Men", "Company", "George Washington"], "synopsis": "워싱턴 장군은 해밀턴에게 마침내 그토록 갈망하던 야전 대대 지휘권을 하사하지만, 동시에 그의 가슴속에 일렁이는 무모한 영웅주의와 영광에 대한 맹목적인 갈증을 깊이 우려합니다. 워싱턴은 자신이 20대 초반 프렌치-인디언 전쟁 시절 처음 지휘를 맡았다가 미숙한 판단으로 부하들을 끔찍한 학살의 구렁텅이로 몰아넣었던 참혹한 과거를 털어놓습니다. 그는 지휘관이란 수많은 목숨을 짊어진 무거운 자리이며, 어떤 영웅도 후세의 평가와 자신의 운명을 스스로 통제할 수 없다는 엄숙한 진실을 가르치며, 해밀턴에게 역사의 준엄한 시선을 두려워하라고 훈계합니다.", "notes": ["워싱턴의 역사적 트라우마 (주먼빌 글렌과 네세시티 요새): 워싱턴의 고백('I led my men straight into a massacre / I witnessed their deaths firsthand')은 1754년 조지 워싱턴이 22세의 청년 장교 시절 겪었던 주먼빌 전투와 네세시티 요새(Fort Necessity)에서의 참담한 패배를 지칭합니다. 이 뼈아픈 실책과 수치심은 워싱턴 평생에 걸쳐 신중함과 절제, 겸손을 새겨준 결정적 계기가 되었습니다.", "작품 전체를 관통하는 대명제 ('Who lives, who dies, who tells your story'): 'You have no control: Who lives, who dies, who tells your story.' 이 짧은 문장은 본 뮤지컬의 최종 피날레 넘버 제목이자 전체 서사를 관통하는 핵심 철학입니다. 인간의 영광은 덧없으며, 역사의 최종 기록은 결국 살아남아 이야기를 전하는 자들의 손에 달려 있다는 묵직한 메시지를 던집니다.", "가스펠풍의 경건한 선율과 힙합 템포의 제어: 뮤지컬의 주조를 이루는 빠른 힙합 비트를 잠시 멈추고, 웅장하고 영적인 가스펠 및 미국 전통 영가 풍의 멜로디를 통해 워싱턴이라는 인물이 짊어진 고독한 도덕적 무게와 역사의 중압감을 관객에게 엄숙하게 전달합니다.", "점진적으로 중첩되는 다층 하모니: 워싱턴의 담담한 독백에서 시작하여 해밀턴의 수용, 남성 앙상블의 웅장한 코러스, 그리고 전체 앙상블의 울림으로 점차 확장되며, '역사의 시선'이 단순한 시적 은유가 아니라 시대를 관통하여 영원히 메아리치는 거대한 심판대임을 보여줍니다."], "stanzas": [{"key": "19:1-8", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I was younger than you are now", "When I was given my first command", "I led my men straight into a massacre", "I witnessed their deaths firsthand", "I made every mistake", "And felt the shame rise in me", "And even now I lie awake", "Knowing history has its eyes on me"], "lines_kr": ["내가 지금의 자네보다도 더 어렸을 때", "내게 처음으로 지휘권이 주어졌었네", "난 부하들을 곧장 대학살의 구렁텅이로 몰고 갔고", "그들의 참혹한 죽음을 내 눈으로 똑똑히 목격했지", "온갖 실수를 다 저질렀고", "내 안에서 치밀어 오르는 수치심을 삼켜야 했네", "그리고 지금도 난 잠 못 이루며 누워 있네", "역사가 나를 지켜보고 있음을 알기에"]}, {"key": "19:9", "speaker_kr": "알렉산더 해밀턴, 조지 워싱턴", "speaker_en": "Alexander Hamilton, George Washington", "lines_en": ["History has its eyes on me."], "lines_kr": ["역사가 나를 지켜보고 있다."]}, {"key": "19:10-12", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Let me tell you what I wish I’d known", "When I was young and dreamed of glory:", "You have no control:"], "lines_kr": ["내가 젊어 영광만을 꿈꾸던 시절", "미리 알았더라면 좋았을 것들을 말해주겠네:", "자네에겐 아무런 통제권이 없다는 것을:"]}, {"key": "19:13", "speaker_kr": "조지 워싱턴, 앙상블 전체", "speaker_en": "George Washington, Company", "lines_en": ["Who lives, who dies, who tells your story"], "lines_kr": ["누가 살고, 누가 죽고, 누가 당신의 이야기를 전하는가는"]}, {"key": "19:14-16", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I know that we can win", "I know that greatness lies in you", "But remember from here on in"], "lines_kr": ["우리가 승리할 수 있다는 걸 안다네", "자네 안에 위대함이 깃들어 있다는 것도", "하지만 이제부터 이것만은 명심하게"]}, {"key": "19:17-18", "speaker_kr": "조지 워싱턴, 알렉산더 해밀턴, 남성 앙상블", "speaker_en": "George Washington, Alexander Hamilton, Men", "lines_en": ["History has its", "Eyes on you."], "lines_kr": ["역사가 자네를", "지켜보고 있음을."]}, {"key": "19:19", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["History has its eyes on you"], "lines_kr": ["역사가 당신을 지켜보고 있다"]}]}, {"id": 20, "act": 1, "title": "Yorktown (The World Turned Upside Down)", "title_kr": "요크타운 (뒤집힌 세상)", "characters_kr": ["조지 워싱턴", "허큘리스 멀리건", "마르키 드 라파예트", "앙상블 전체", "존 로런스", "알렉산더 해밀턴", "남성 앙상블"], "characters_en": ["George Washington", "Hercules Mulligan", "Marquis de Lafayette", "Company", "John Laurens", "Alexander Hamilton", "Men"], "synopsis": "1781년 가을, 미국 독립 전쟁의 마지막이자 결정적인 승리를 알리는 요크타운 전투가 벌어집니다. 마침내 대대 지휘관이 된 해밀턴은 영국군 최전방 제10호 보루(Redoubt 10)를 야간 기습하는 선봉 돌격대를 이끕니다. 그는 야간 기습의 은밀성을 유지하고 오발 사고로 인한 작전 노출을 막기 위해 병사들에게 총알을 빼고 오직 총검(bayonet)만으로 돌격할 것을 명령합니다. 한편 존 로런스는 사우스캐롤라이나에서 흑인 대대를 이끌고, 허큘리스 멀리건은 영국군 본진에서 스파이로 활약하며 빼돌린 결정적 첩보를 제공합니다. 치열한 백병전 끝에 영국군 콘월리스 장군은 백기를 들고 항복하며, 영국 군악대는 당혹감 속에 전설적인 민요 '뒤집힌 세상(The World Turned Upside Down)'을 연주합니다. 오합지졸 식민지 반란군이 세계 최강 대영제국을 굴복시키고 새로운 민주주의 국가를 탄생시키는 기적의 순간입니다.", "notes": ["'Immigrants: We get the job done': 라파예트와 해밀턴이 전장에서 마주치며 나누는 이 대사는 뮤지컬 해밀턴의 가장 상징적인 시그니처 대사로, 브로드웨이 초연 당시 매회 관객들의 열광적인 기립 박수를 이끌어냈습니다. 카리브해 사생아 출신의 해밀턴과 프랑스 귀족 출신의 라파예트라는 두 이민자의 헌신이 미국의 자유를 쟁취했음을 선언하며 현대 미국의 다문화적 정체성을 강력히 웅변합니다.", "'Take the bullets out your gun' (실제 역사적 전술): 1781년 10월 14일 밤, 해밀턴이 이끈 제10호 보루 야간 기습 작전의 핵심 수칙이었습니다. 어둠 속에서 조총의 화약 불꽃이나 오발로 기습이 들통나는 것을 방지하기 위해 모든 병사들에게 실탄을 장전하지 못하게 하고 오직 착검한 총검 돌격(bayonet charge)만으로 10분 만에 보루를 무혈 함락시킨 실제 전사(戰史)를 정확히 반영했습니다.", "허큘리스 멀리건의 폭발적인 힙합 플로우: 뉴욕의 고급 양복 재단사로 위장하여 영국군 장교들의 옷 치수를 재며 빼돌린 비밀 정보를 혁명 결사대 '자유의 아들들(Sons of Liberty)'에게 전달한 멀리건의 스파이 활약상이 거친 하드코어 힙합 비트와 유쾌한 펀치라인('We in the shit now, somebody gotta shovel it!')으로 폭발합니다.", "민요 'The World Turned Upside Down'의 다층적 역설: 1781년 10월 19일 항복식에서 영국군 군악대가 실제로 연주했다고 전해지는 17세기 영국 민요입니다. 해가 지지 않는 대영제국 군주제가 식민지 민병대에게 무릎을 꿇은 세계사적 대역전과, 왕정이 무너지고 공화국이 태어나는 천지개벽을 상징합니다. 아울러 존 로런스와 워싱턴의 대화('흑인과 백인 병사 모두 이것이 진정한 자유를 뜻하는지 묻는다 / 아직은 아니다')를 통해 노예제 폐지라는 미완의 혁명 과제를 날카롭게 짚어냅니다."], "stanzas": [{"key": "20:1", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["The battle of Yorktown. 1781"], "lines_kr": ["요크타운 전투. 1781년"]}, {"key": "20:2", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["Monsieur Hamilton"], "lines_kr": ["무슈 해밀턴"]}, {"key": "20:3", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Monsieur Lafayette"], "lines_kr": ["무슈 라파예트"]}, {"key": "20:4", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["In command where you belong"], "lines_kr": ["자네가 마땅히 있어야 할 지휘관의 자리에 섰군"]}, {"key": "20:5-6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["How you say, no sweat", "We're finally on the field. We’ve had quite a run"], "lines_kr": ["프랑스 말로 뭐라더라, 식은 죽 먹기지", "드디어 전장에 섰어. 참으로 숨 가쁘게 달려왔군"]}, {"key": "20:7", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["Immigrants:"], "lines_kr": ["이민자들:"]}, {"key": "20:8", "speaker_kr": "알렉산더 해밀턴, 마르키 드 라파예트", "speaker_en": "Alexander Hamilton, Marquis de Lafayette", "lines_en": ["We get the job done"], "lines_kr": ["우린 맡은 일은 반드시 해내지"]}, {"key": "20:9", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["So what happens if we win?"], "lines_kr": ["그래, 우리가 이기면 어떻게 되는 거지?"]}, {"key": "20:10-11", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["I go back to France", "I bring freedom to my people if I’m given the chance"], "lines_kr": ["난 프랑스로 돌아갈 거야", "기회가 주어진다면 내 조국의 백성들에게도 자유를 안겨줄 테지"]}, {"key": "20:12", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["We’ll be with you when you do"], "lines_kr": ["자네가 그렇게 할 때 우리가 함께하겠네"]}, {"key": "20:13", "speaker_kr": "마르키 드 라파예트", "speaker_e .", "버와 해밀턴의 삶의 철학의 극명한 충돌: 때를 기다리며 패를 숨기고 바람의 방향을 살피는 버('Wait for It', 'Close to my chest')와, 시간이 얼마 남지 않은 사람처럼 매 순간 목숨을 걸고 글을 쓰고 싸우는 해밀턴('Non-Stop', 'Running out of time')의 근본적인 철학적 대비가 극명하게 드러나며, 이는 2막의 모든 비극적 파국을 이끄는 핵심 동력이 됩니다.", "리바이 윅스(Levi Weeks) 살인 재판 (1800년 맨해튼 우물 살인 사건): 미국 사법 역사상 최초의 공식 기록된 살인 재판으로, 실제 역사에서 알렉산더 해밀턴과 아론 버가 한 팀이 되어 변호하여 피고인의 무죄를 이끌어낸 유명한 사건입니다. 넘버 초반부에 이 재판을 배치하여 두 사람의 탁월한 법률적 재능과 함께 서로 상반된 스타일(해밀턴의 열정적 장황함과 버의 냉철한 간결함)을 흥미진진하게 보여줍니다."], "stanzas": [{"key": "23:1", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["After the war I went back to New York"], "lines_kr": ["전쟁이 끝난 후 난 뉴욕으로 돌아갔지"]}, {"key": "23:2", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["A-After the war I went back to New York"], "lines_kr": ["전-전쟁이 끝난 후 나 역시 뉴욕으로 돌아갔네"]}, {"key": "23:3", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I finished up my studies and I practiced law"], "lines_kr": ["난 학업을 마치고 변호사 일을 시작했지"]}, {"key": "23:4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I practiced law, Burr worked next door"], "lines_kr": ["나도 법을 개업했지, 버는 바로 옆 사무실에서 일했어"]}, {"key": "23:5-8", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Even though we started at the very same time", "Alexander Hamilton began to climb", "How to account for his rise to the top?", "Maaaaan, the man is non-stop."], "lines_kr": ["비록 우리가 완전히 같은 때에 시작했지만", "알렉산더 해밀턴은 거침없이 치고 올라가기 시작했지", "그의 이 눈부신 정상 질주를 어찌 설명해야 할까?", "이야, 저 사내는 정말 멈추질 않아."]}, {"key": "23:9-15", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Gentlemen of the jury, I’m curious, bear with me", "Are you aware that we’re making hist’ry?", "This is the first murder trial of our brand-new nation", "The liberty behind", "Deliberation—", "I intend to prove beyond a shadow of a doubt", "With my assistant counsel—"], "lines_kr": ["배심원 신사 여러분, 궁금한 점이 있으니 잠시 귀 기울여 주십시오", "우리가 지금 역사를 쓰고 있다는 사실을 알고 계십니까?", "이것은 우 지만 제퍼슨의 자유주의적 수사 뒤에 감춰진 노예 소유주로서의 모순과 위선을 날카롭게 암시합니다.", "**아론 버의 나레이션과 라임 구조**: 인트로에서 아론 버는 해밀턴의 가혹한 운명을 요약하며 \"bastard orphan / immigrant decorated war vet / Unite the colonies through more debt\"로 이어지는 고난도 다음절 각운(debt-forfeit-more yet, president-precedent-resist him-system)을 쏟아내며, 2막의 주 무대가 \"전쟁터\"에서 \"정치판\"으로 이동했음을 선언합니다."], "stanzas": [{"key": "24:1-2", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Seventeen. Se- se- seventeen...", "Se- se- seventeen…"], "lines_kr": ["십칠. 십- 십- 십칠...", "십- 십- 십칠…"]}, {"key": "24:3-17", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["1789", "How does the bastard orphan", "Immigrant decorated war vet", "Unite the colonies through more debt?", "Fight the other founding fathers til he has to forfeit?", "Have it all, lose it all", "You ready for more yet?", "Treasury Secretary. Washington’s the President", "Ev’ry American experiment sets a precedent", "Not so fast. Someone came along to resist him", "Pissed him off until we had a two-party system", "You haven’t met him yet, you haven’t had the chance", "‘cause he’s been kickin’ ass as the ambassador to France", "But someone’s gotta keep the American promise", "You simply must meet Thomas. Thomas!"], "lines_kr": ["1789년", "어떻게 사생아, 고아,", "이민자 출신 훈장 받은 참전용사가", "더 많은 빚으로 식민지들을 하나로 묶었을까?", "건국의 아버지들과 맞서 싸우다 모든 걸 내던질 때까지?", "전부를 얻었다가, 전부를 잃을 운명", "아직 더 볼 준비가 되셨습니까?", "재무장관 해밀턴, 워싱턴은 대통령", "미국의 모든 실험은 새로운 전례가 되었지", "하지만 잠깐, 그를 가로막는 누군가가 나타났어", "그의 속을 뒤집어놓더니 양당제를 만들어냈지", "아직 그를 만나보지 못했을 겁니다, 기회가 없었으니", "프랑스 대사로 가서 멋지게 활약하고 있었으니까", "하지만 누군가는 미국의 약속을 지켜내야 하는 법", "꼭 이분을 만나보셔야 합니다, 토머스. 토머스 제퍼슨!"]}, {"key": "24:18-25", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Thomas Jefferson’s coming home!", "Thomas Jefferson’s coming home!", "Thomas Jefferson’s coming home!", "Thomas Jefferson’s coming home!", "Thomas Jefferson’s coming home Lord he’s", "Been off in Paris for so long!", "Aaa-ooo!", "Aaa-ooo!"], "lines_kr": ["토머스 제퍼슨이 집으로 돌아온다!", "토머스 제퍼슨이 got home and now I’m headed up to New York"], "lines_kr": ["책상 위에 대통령이 보낸 편지가 와 있네", "아직 여행 가방을 내려놓지도 못했는데 말이지", "샐리, 착하지 자기야, 대신 좀 뜯어주겠니?", "대통령께서 내각을 꾸리고 계신다네", "그리고 내가 국무장관이 될 거라니, 훌륭하군!", "게다가 이미 상원 인준까지 끝났다잖아...", "방금 집에 도착했는데 이젠 뉴욕으로 가야 한다니"]}, {"key": "24:48-49", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Headin’ to New York!", "Headin’ to New York!"], "lines_kr": ["뉴욕으로 간다!", "뉴욕으로 간다!"]}, {"key": "24:50-59", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Lookin’ at the rolling fields", "I can’t believe that we are free", "Ready to face", "Whatever’s awaiting", "Me in N.Y.C.", "But who’s waitin’ for me when I step in the place?", "My friend James Madison, red in the face", "He grabs my arm and", "I respond", "“What’s goin’ on?”"], "lines_kr": ["끝없이 펼쳐진 벌판을 바라보며", "우리가 마침내 자유로워졌다는 게 믿기지 않네", "무엇이든 맞설 준비가 됐어", "나를 기다리고 있는 것이", "그 무엇이든 뉴욕시에서", "하지만 그곳에 발을 들이자마자 날 기다리고 있는 자는 누구?", "얼굴이 새빨갛게 상기된 내 친구 제임스 매디슨", "그가 내 팔을 붙잡자", "난 이렇게 물었지", "“도대체 무슨 일이야?”"]}, {"key": "24:60-61", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Thomas, we are engaged in a battle for our nation’s very soul", "Can you get us out of the mess we’re in?"], "lines_kr": ["토머스, 우리는 지금 국가의 영혼을 건 싸움을 벌이고 있어", "우리가 빠진 이 난장판에서 우릴 구해줄 수 있겠나?"]}, {"key": "24:62", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Aaa-ooo!"], "lines_kr": ["아-오!"]}, {"key": "24:63-65", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Hamilton’s new financial plan is nothing less than government control", "I’ve been fighting for the South alone", "Where have you been?"], "lines_kr": ["해밀턴의 새 금융 계획은 정부의 독재 통제나 다름없어", "지금껏 나 혼자 남부를 위해 싸워왔단 말일세", "도대체 어디 가 있었던 거야?"]}, {"key": "24:66", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Uh...France."], "lines_kr": ["어... 프랑스에."]}, {"key": "24:67", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["We have to win"], "lines_kr": ["우린 반드시 이겨야 해"]}, {"key": "24:68-74", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["What’d I miss?", "What’d I miss?", "Headfirst into a political abyss!", "I have my first cabinet meeting today", "I guess I better think of something to say", "I’m already on my way", "Let’s get to the bottom of this…"], "lines_kr": ["내가 뭘 놓쳤지?", "내가 뭘 놓쳤지?", "머리부터 정치적 심연으로 다이빙하겠군!", "오늘이 내 첫 국무회의인데 말이야", "무슨 말을 할지 미리 생각해 두는 게 좋겠어", "난 이미 가고 있는 길", "이 일의 진상을 낱낱이 파헤쳐보자고..."]}, {"key": "24:75", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Mr. Jefferson, welcome home"], "lines_kr": ["제퍼슨 장관, 귀국을 환영하오"]}, {"key": "24:76", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mr. Jefferson? Alexander Hamilton"], "lines_kr": ["제퍼슨 장관님이십니까? 알렉산더 해밀턴입니다"]}, {"key": "24:77", "speaker_kr": "조지 워싱턴, 앙상블 전체", "speaker_en": "George Washington, Company", "lines_en": ["Mr. Jefferson, welcome home"], "lines_kr": ["제퍼슨 장관, 귀국을 환영하오"]}, {"key": "24:78-79", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Mr. Jefferson, welcome home", "Sir, you’ve been off in Paris for so long!"], "lines_kr": ["제퍼슨 장관님, 귀국을 환영합니다", "나리, 파리에 너무 오래 계셨습니다!"]}, {"key": "24:80", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["So what did I miss?"], "lines_kr": ["그래, 내가 도대체 뭘 놓쳤단 말인가?"]}]}, {"id": 25, "act": 2, "title": "Cabinet Battle #1", "title_kr": "제1차 국무회의 랩 배틀", "characters_kr": ["알렉산더 해밀턴", "토머스 제퍼슨", "조지 워싱턴", "제임스 매디슨"], "characters_en": ["Alexander Hamilton", "Thomas Jefferson", "George Washington", "James Madison"], "synopsis": "1790년 뉴욕 연방정부에서 열린 역사적인 초대 내각 국무회의를 90년대 힙합 랩 배틀 형식으로 재해석한 명장면입니다. 조지 워싱턴 대통령이 배틀 MC(호스트)로 나서고, 국무장관 토머스 제퍼슨과 재무장관 알렉산더 해밀턴이 국가 금융 정책을 두고 정면으로 충돌합니다. 해밀턴은 각 주(States)가 독립전쟁 때 진 부채를 연방정부가 일괄 인수하고(Assumption of State Debts) 국립은행을 설립하여 신생국의 국가 신용을 확립하고자 합니다. 반면 버지니아를 대표하는 제퍼슨과 매디슨은 이미 빚을 다 갚은 남부 주들이 북부 주들의 빚까지 떠안는 것은 부당한 세금 착취이자 중앙집권적 폭정이라고 맹비난합니다. 제퍼슨이 독립선언서를 인용하며 여유롭고 남부풍의 느긋한 플로우로 해밀턴을 공격하자, 해밀턴은 특유의 날카로운 붐뱁 랩으로 제퍼슨의 최대 아킬레스건인 \"노예제 위선\"을 정면으로 폭로(\"당신들이 빚을 갚은 건 노동의 대가를 치르지 않았기 때문\")하며 회의장을 발칵 뒤집어놓습니다. 워싱턴은 난투극 직전에 회의를 중단시키고, 해밀턴에게 의회 표(votes)를 확보하지 못하면 아무 소용이 없으니 당장 타협안을 찾아오라고 엄히 명합니다.", "notes": ["**90년대 힙합 배틀과 올드스쿨 vs 붐뱁 플로우**: 워싱턴의 오프닝 멘트(\"Ladies and gentlemen, you coulda been anywhere in the world tonight, but you’re here with us in New York City\")는 래퍼 제이지(Jay-Z)의 라이브 콘서트 단골 멘트를 오마주한 것입니다. 제퍼슨은 1982년 그랜드마스터 플래시의 전설적 힙합곡 \"The Message\"(\"It's like a jungle sometimes, it makes me wonder how I keep from going under\")를 패러디하여 \"Such a blunder sometimes it makes me wonder why I even bring the thunder\"라고 조롱하며 올드스쿨 남부 스타일의 여유를 부립니다.", "**해밀턴의 펀치라인과 노예제 비판의 역사적 진실**: 해밀턴의 반격 벌스는 뮤지컬 전체에서 가장 날카로운 펀치라인으로 꼽힙니다. \"A civics lesson from a slaver. Hey neighbor, your debts are paid cuz you don’t pay for labor!\"(노예 소유주한테 듣는 시민윤리 수업이라니. 이봐 이웃 양반, 당신네 빚이 갚아진 건 노동의 대가를 안 줬기 때문이잖아!)라는 일갈은 남부 농본주의의 경제적 풍요가 흑인 노예 노동의 착취 위에 세워졌다는 모순을 적나라하게 폭로합니다.", "**재정 정책의 핵심 쟁점 (주 부채 인수와 국립은행)**: 해밀턴의 재정 계획 핵심은 \"국가 부채의 국채화(National Debt as a National Blessing)\"였습니다. 주들의 빚을 연방이 인수하면 유럽 및 국내 채권자들은 미 연방정부가 번영해야만 돈을 돌려받을 수 있으므로 연방의 존속에 투자하게 됩니다. 반면 제퍼슨은 이를 북부 상인과 투기꾼의 배만 불리는 연방정부의 독재적 권력 집중으로 보았습니다.", "**워싱턴의 명대사와 통치의 현실**: 워싱턴의 \"Winning was easy, young man. Governing’s harder\"(전쟁에서 이기는 건 쉬운 일이었네, 젊은이. 나라를 다스리는 건 훨씬 더 어려운 법이지)는 혁명 전쟁의 승리보다 국가 제도를 구축하고 서로 다른 이해관계를 조율하는 통치가 훨씬 복잡하고 가혹함을 일깨우는 작품의 핵심 주제의식을 담고 있습니다."], "stanzas": [{"key": "25:1-2", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Ladies and gentlemen, you coulda been anywhere in the world tonight, but you’re here with us in New York City. Are you ready for a cabinet meeting???", "The issue on the table: Secretary Hamilton’s plan to assume state debt and establish a national bank. Secretary Jefferson, you have the floor, sir"], "lines_kr": ["신사 숙녀 여러분, 오늘 밤 세상 어디에나 계실 수 있었겠지만, 바로 이곳 뉴욕시에서 저희와 함께하고 계십니다. 국무회의를 즐길 준비 되셨습니까???", "오늘 논의할 안건: 주정부 부채를 인수하고 국립은행을 설립하겠다는 해밀턴 장관의 계획안입니다. 제퍼슨 장관, 발언권을 드립니다, 말씀하시지요."]}, {"key": "25:3-6", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["‘Life, liberty and the pursuit of happiness.’", "We fought for these ideals; we shouldn’t settle for less", "These are wise words, enterprising men quote ‘em", "Don’t act surprised, you guys, cuz I wrote ‘em"], "lines_kr": ["‘생명, 자유, 그리고 행복의 추구.’", "우린 이 이상을 위해 싸웠소, 그 이하에 만족해선 안 되지", "이 지혜로운 말씀, 진취적인 사나이들이 늘 인용하곤 하지", "놀란 척들 마시게, 친구들, 왜냐면 내가 직접 썼으니까"]}, {"key": "25:7", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Thomas Jefferson, James Madison", "lines_en": ["Oww"], "lines_kr": ["오우!"]}, {"key": "25:8-11", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["But Hamilton forgets", "His plan would have the government assume state’s debts", "Now, place your bets as to who that benefits:", "The very seat of government where Hamilton sits"], "lines_kr": ["하지만 해밀턴은 망각하고 있소", "그의 계획은 정부가 주정부들의 빚을 떠안게 하자는 것", "자, 이게 누구에게 득이 될지 내기를 걸어보시오:", "바로 해밀턴이 틀어쥐고 앉아 있는 정부 그 자체라오"]}, {"key": "25:12", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Not true!"], "lines_kr": ["사실이 아닙니다!"]}, {"key": "25:13-24", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Ooh, if the shoe fits, wear it", "If New York’s in debt—", "Why should Virginia bear it? Uh! Our debts are paid, I’m afraid", "Don’t tax the South cuz we got it made in the shade", "In Virginia, we plant seeds in the ground", "We create. You just wanna move our money around", "This financial plan is an outrageous demand", "And it’s too many damn pages for any man to understand", "Stand with me in the land of the free", "And pray to God we never see Hamilton’s candidacy", "Look, when Britain taxed our tea, we got frisky", "Imagine what gon’ happen when you try to tax our whisky"], "lines_kr": ["오, 발에 맞는 신발이라면 신으셔야지", "뉴욕이 빚을 졌다면—", "왜 버지니아가 그걸 갚아야 합니까? 우린 이미 빚을 다 갚았는데 말이오", "남부에 세금을 물리지 마시오, 우린 그늘 아래 자급자족 잘 살고 있으니", "우리 버지니아는 땅에 씨앗을 뿌려 농사를 짓소", "우린 창조하는데, 당신은 그저 우리 돈을 이리저리 굴리고 싶을 뿐이지", "이 재정 계획이란 건 터무니없는 강도질이자 억지요", "인간이 이해하기엔 빌어먹을 보고서 쪽수가 너무나도 많단 말이오", "자유의 땅에서 나와 함께 일어서시오", "그리고 신께 기도합시다, 해밀턴이 대선 후보로 나서는 꼴을 보지 않게 해달라고", "보시오, 영국이 우리 차(茶)에 세금을 매겼을 때 우린 들고일어났소", "당신이 우리 위스키에 세금을 매기려 들면 무슨 사단이 날지 상상이나 해보시오"]}, {"key": "25:25-26", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Thank you, Secretary Jefferson", "Secretary Hamilton, your response"], "lines_kr": ["감사합니다, 제퍼슨 장관", "해밀턴 장관, 답변하십시오"]}, {"key": "25:27-47", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Thomas. That was a real nice declaration", "Welcome to the present, we’re running a real nation", "Would you like to join us, or stay mellow", "Doin’ whatever the hell it is you do in Monticello?", "If we assume the debts, the union gets a new line of credit, a financial diuretic", "How do you not get it? If we’re aggressive and competitive", "The union gets a boost. You’d rather give it a sedative?", "A civics lesson from a slaver. Hey neighbor", "Your debts are paid cuz you don’t pay for labor", "“We plant seeds in the South. We create.”  Yeah, keep ranting", "We know who’s really doing the planting", "And another thing, Mr. Age of Enlightenment", "Don’t lecture me about the war, you didn’t fight in it", "You think I’m frightened of you, man?  We almost died in a trench", "While you were off getting high with the French", "Thomas Jefferson, always hesitant with the President", "Reticent—there isn’t a plan he doesn’t jettison", "Madison, you’re mad as a hatter, son, take your medicine", "Damn, you’re in worse shape than the national debt is in", "Sittin’ there useless as two shits", "Hey, turn around, bend over, I’ll show you where my shoe fits"], "lines_kr": ["토머스, 참으로 그럴싸한 선언문이었소", "현재에 오신 걸 환영하오, 우린 지금 '진짜 국가'를 경영하는 중이거든", "우리와 함께하시겠소, 아니면 계속 느긋하게 뒹굴며", "몬티첼로에서 하던 빌어먹을 짓거리나 계속하시겠소?", "우리가 주 부채를 인수하면, 연방은 새로운 신용을 얻고 재정에 막힌 혈이 뚫리오", "어째서 그걸 이해 못 하시오? 우리가 공격적이고 경쟁력을 갖추면", "연방 전체가 도약하게 되오, 당신은 연방에 진정제나 먹여 잠재울 셈이오?", "노예 소유주한테 듣는 시민윤리 수업이라니, 이봐 이웃 양반", "당신네 빚이 청산된 건 노동의 대가를 한 푼도 안 줬기 때문이지", "“남부는 땅에 씨를 뿌린다. 창조한다.” 그래, 계속 지껄여보시오", "그 씨를 진짜로 누가 뿌리고 있는지 온 세상이 다 아니까!", "그리고 하나 더, 계몽주의 시대의 나으리", "전쟁에 대해 훈계하지 마시오, 당신은 참전조차 안 했잖아", "내가 당신을 무서워할 줄 아나? 우린 참호 속에서 죽어갈 뻔했소", "당신이 프랑스 귀족들과 어울려 약에 취해 노닥거리는 동안에!", "토머스 제퍼슨, 대통령 앞에선 늘 주저하고 머뭇거리며", "속을 숨기지—버리지 않는 계획이라곤 하나도 없으면서", "매디슨, 넌 모자 장수처럼 미쳐 날뛰는구나, 약이나 챙겨 먹어라 꼬마야", "젠장, 네 몸 상태가 국가 부채 상태보다 훨씬 더 엉망진창이군", "거기 앉아 똥 덩어리 두 개처럼 쓸모짝에도 없으니", "이봐, 뒤돌아서 엉덩이 까 봐, 내 신발이 어디에 딱 맞는지 꽂아줄 테니까!"]}, {"key": "25:48-49", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Excuse me? Madison, Jefferson, take a walk! Hamilton, take a walk!", "We’ll reconvene after a brief recess. Hamilton!"], "lines_kr": ["뭐라고? 매디슨, 제퍼슨, 밖으로 나가 머리 좀 식히시오! 해밀턴, 자네도 나가서 식히게!", "잠시 정회한 후 다시 속개하겠소. 해밀턴!"]}, {"key": "25:50", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir!"], "lines_kr": ["각하!"]}, {"key": "25:51", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["A word"], "lines_kr": ["얘기 좀 하지"]}, {"key": "25:52", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["You don’t have the votes"], "lines_kr": ["자넨 표가 없어"]}, {"key": "25:53", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Thomas Jefferson, James Madison", "lines_en": ["You don’t have the votes"], "lines_kr": ["자넨 표가 없어"]}, {"key": "25:54", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Aha-ha-ha ha!"], "lines_kr": ["아하하하 하!"]}, {"key": "25:55", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Thomas Jefferson, James Madison", "lines_en": ["You’re gonna need congressional approval and you don’t have the votes"], "lines_kr": ["의회의 승인을 받아야 할 텐데 자넨 표가 전혀 없다고"]}, {"key": "25:56", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Such a blunder sometimes it makes me wonder why I even bring the thunder"], "lines_kr": ["이런 치명적인 실책이라니, 내가 왜 굳이 천둥번개까지 몰고 왔나 회의가 들 지경이네"]}, {"key": "25:57", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Why he even brings the thunder…"], "lines_kr": ["왜 천둥번개까지 몰고 왔는지…"]}, {"key": "25:58", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["You wanna pull yourself together?"], "lines_kr": ["자네 정신 좀 차리겠나?"]}, {"key": "25:59", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’m sorry, these Virginians are birds of a feather"], "lines_kr": ["죄송합니다, 이 버지니아 촌놈들은 다 한통속입니다"]}, {"key": "25:60", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Young man, I’m from Virginia, so watch your mouth"], "lines_kr": ["젊은이, 나도 버지니아 출신일세, 그러니 입조심하게"]}, {"key": "25:61", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["So we let Congress get held hostage by the South?"], "lines_kr": ["그럼 의회가 남부의 인질로 잡혀 끌려다니게 둬야 합니까?"]}, {"key": "25:62", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["You need the votes"], "lines_kr": ["자네에겐 표가 필요해"]}, {"key": "25:63", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["No, we need bold strokes. We need this plan"], "lines_kr": ["아닙니다, 우리에겐 과감한 결단이 필요합니다. 이 계획안이 꼭 필요하다고요"]}, {"key": "25:64", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["No, you need to convince more folks"], "lines_kr": ["아니, 자네는 더 많은 사람들을 설득해야 해"]}, {"key": "25:65", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["James Madison won’t talk to me, that’s a nonstarter"], "lines_kr": ["제임스 매디슨이 저와 대화조차 거부하니 시작부터 막혔습니다"]}, {"key": "25:66", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Winning was easy, young man. Governing’s harder"], "lines_kr": ["전쟁에서 이기는 건 쉬운 일이었네, 젊은이. 나라를 다스리는 건 훨씬 더 어려운 법이지"]}, {"key": "25:67", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["They’re being intransigent"], "lines_kr": ["저들이 고집불통으로 버티고 있습니다"]}, {"key": "25:68", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["You have to find a compromise"], "lines_kr": ["자네가 타협안을 찾아내야 해"]}, {"key": "25:69", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["But they don’t have a plan, they just hate mine!"], "lines_kr": ["하지만 저들에겐 대안도 없습니다, 그저 제 계획이 싫은 것뿐이라고요!"]}, {"key": "25:70", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Convince them otherwise"], "lines_kr": ["그렇지 않도록 설득해 보게"]}, {"key": "25:71", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["What happens if I don’t get congressional approval?"], "lines_kr": ["제가 의회의 승인을 얻어내지 못하면 어떻게 됩니까?"]}, {"key": "25:72", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I imagine they’ll call for your removal"], "lines_kr": ["내 생각엔 저들이 자네의 해임을 요구하겠지"]}, {"key": "25:73", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir—"], "lines_kr": ["각하—"]}, {"key": "25:74", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Figure it out, Alexander. That’s an order from your commander"], "lines_kr": ["방법을 찾아내게, 알렉산더. 이건 자네 사령관으로서 내리는 명령일세"]}]}, {"id": 26, "act": 2, "title": "Take a Break", "title_kr": "잠시 쉬어요", "characters_kr": ["알렉산더 해밀턴", "일라이자 스카일러", "안젤리카 스카일러", "필립 해밀턴"], "characters_en": ["Alexander Hamilton", "Eliza Schuyler", "Angelica Schuyler", "Philip Hamilton"], "synopsis": "타협안을 마련하기 위해 밤낮없이 일에 매달리는 해밀턴의 숨 막히는 일상과 가족의 비극적 분기점을 다룬 서정적 넘버입니다. 아내 일라이자와 9살이 된 아들 필립 해밀턴은 해밀턴에게 과로를 멈추고 여름 동안 업스테이트 뉴욕(올버니의 스카일러 저택)으로 함께 휴가를 떠나자고 애원합니다. 아들 필립은 아버지를 기쁘게 해주기 위해 갈고닦은 귀여운 랩과 피아노 실력을 뽐냅니다. 한편, 영국에서 살고 있던 처제 안젤리카 스카일러 처치 역시 해밀턴 가족을 만나기 위해 대서양을 건너 귀국합니다. 해밀턴과 안젤리카는 편지를 주고받으며 셰익스피어의 비극 《맥베스》를 인용하는 등 여전한 지적 유대감과 은밀한 감정(\"My dearest, Angelica\" 속 쉼표 논쟁)을 나누지만, 안젤리카 역시 해밀턴에게 제퍼슨과 타협하고 가족들과 함께 휴식을 취하라고 권유합니다. 그러나 해밀턴은 의회에서 재정 법안을 통과시키지 못하면 모든 것을 잃는다는 강박과 야망에 사로잡혀 결국 가족들의 간곡한 부탁을 뿌리치고 홀로 뉴욕에 남기를 선택합니다. 이 치명적인 고립이 곧바로 마리아 레이놀즈와의 불륜으로 이어지는 도화선이 됩니다.", "notes": ["**맥베스(Macbeth) 인용과 비극적 복선**: 해밀턴이 안젤리카에게 보내는 편지에서 《맥베스》의 독백 \"Tomorrow and tomorrow and tomorrow creeps in this petty pace from day to day\"를 인용하며 정적들이 자신을 맥베스로 여기고, 매디슨은 뱅코우, 제퍼슨은 맥더프, 의회는 던시네인으로 향하는 번햄 숲에 비유합니다. 이는 해밀턴의 거대한 야망이 결국 자신의 파멸을 부를 것임을 암시하는 섬뜩한 복선입니다.", "**쉼표(Comma)의 위치와 에로틱한 긴장감**: 안젤리카가 지적하는 \"My dearest Angelica\"(친애하는 안젤리카에게)와 \"My dearest, Angelica\"(내 가장 소중한 사람, 안젤리카)의 차이는 두 사람 사이의 미묘한 로맨틱 텐션을 문법적으로 포착한 미란다 특유의 언어유희입니다. 쉼표 하나로 단순 호칭이 \"가장 소중한 존재\"라는 은밀한 고백으로 변합니다.", "**숫자 세기(1 to 9) 모티프와 필립의 운명**: 곡의 도입부에서 일라이자와 필립이 프랑스어로 숫자를 세는 \"Un deux trois quatre cinq six sept huit neuf (1부터 9까지)\"는 1막 \"Ten Duel Commandments(결투 십계명)\"의 비트를 차용한 것입니다. 훗날 필립이 결투장에서 7을 셀 때 총에 맞아 사망하게 된다는 점에서 극도로 비극적인 복선 역할을 합니다.", "**부통령 존 애덤스(John Adams)에 대한 조롱**: 일라이자가 존 애덤스는 가족들과 여름을 보낸다고 하자, 해밀턴은 \"존 애덤스는 어차피 제대로 된 직업(실권)도 없잖아\"라며 무시합니다. 이는 훗날 해밀턴과 존 애덤스의 격렬한 정쟁과 해밀턴의 정치적 고립을 예고하는 역사적 디테일입니다."], "stanzas": [{"key": "26:1-6", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Un deux trois quatre", "Cinq six sept huit neuf", "Good! Un deux trois quatre", "Cinq six sept huit neuf", "Sept huit neuf—", "Sept huit neuf—"], "lines_kr": ["엉, 두, 트루아, 카트르", "생크, 시스, 세트, 유이트, 뇌프", "잘했어! 엉, 두, 트루아, 카트르", "생크, 시스, 세트, 유이트, 뇌프", "세트, 유이트, 뇌프—", "세트, 유이트, 뇌프—"]}, {"key": "26:7-12", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Un deux trois quatre", "Cinq six sept huit neuf", "Un deux trois quatre", "Cinq six sept huit neuf", "Sept huit neuf—", "Sept huit neuf—"], "lines_kr": ["엉, 두, 트루아, 카트르", "생크, 시스, 세트, 유이트, 뇌프", "엉, 두, 트루아, 카트르", "생크, 시스, 세트, 유이트, 뇌프", "세트, 유이트, 뇌프—", "세트, 유이트, 뇌프—"]}, {"key": "26:13", "speaker_kr": "일라이자 스카일러, 필립 해밀턴", "speaker_en": "Eliza Schuyler, Philip Hamilton", "lines_en": ["One two three four five six seven eight nine!"], "lines_kr": ["원 투 쓰리 포 파이브 식스 세븐 에이트 나인!"]}, {"key": "26:14-22", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["My dearest, Angelica", "“Tomorrow za Schuyler, Angelica Schuyler", "lines_en": ["We can all go stay with our father"], "lines_kr": ["우리 모두 친정아버지 댁에 머물 수 있어요"]}, {"key": "26:107-117", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["There’s a lake I know", "In a nearby park", "You and I can go", "Take a break and get away—", "Let’s go upstate", "Where we can stay", "Look around, look around", "At how lucky we are to be alive right now—", "We can go—", "When the night gets dark", "Take a break."], "lines_kr": ["내가 아는 호수가 있어요", "근처 공원 안에 있는", "당신과 내가 함께 갈 수 있어요", "잠시 쉬면서 모든 걸 벗어나요—", "북부 시골로 함께 가요", "우리가 머물 수 있는 곳으로", "주위를 둘러봐요, 둘러봐요", "지금 살아 숨 쉬고 있다는 게 얼마나 큰 축복인지—", "함께 갈 수 있어요—", "밤이 어두워질 때", "잠시 쉬어가요."]}, {"key": "26:118-119", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I have to get my plan through Congress", "I can’t stop until I get this plan through Congress"], "lines_kr": ["난 의회에서 내 계획안을 통과시켜야만 해", "이 계획을 의회에서 통과시킬 때까지 난 멈출 수 없어"]}]}, {"id": 27, "act": 2, "title": "Say No to This", "title_kr": "이것만은 거절해야 하는데", "characters_kr": ["아론 버", "앙상블 전체", "알렉산더 해밀턴", "마리아 레이놀즈", "제임스 레이놀즈"], "characters_en": ["Aaron Burr", "Company", "Alexander Hamilton", "Maria Reynolds", "James Reynolds"], "synopsis": "가족들이 모두 여름 휴가를 떠나 텅 빈 뉴욕에 홀로 남은 알렉산더 해밀턴이 인생 최대의 도덕적 과오이자 훗날 정치적 파멸을 초래하게 될 불륜의 덫에 빠져드는 비극적 순간을 담은 관능적인 R&B 넘버입니다. 격무와 수면 부족에 시달리던 해밀턴에게 마리아 레이놀즈(Maria Reynolds)라는 젊은 여인이 찾아와 남편의 폭력과 외도로 버림받았다며 울면서 도움을 청합니다. 동정심에 그녀를 집까지 바래다주고 돈을 쥐여준 해밀턴은, 그녀의 노골적인 유혹에 직면합니다. 해밀턴의 이성과 양심은 \"이것만은 거절해야 한다(Say no to this)\"고 외치지만, 지친 심신과 거부할 수 없는 정욕에 굴복해 결국 육체적 관계를 맺고 맙니다. 더욱 끔찍한 것은 이것이 마리아와 그녀의 남편 제임스 레이놀즈(James Reynolds)가 공모한 치밀한 꽃뱀 공갈 협박(Blackmail)이었다는 사실입니다. 남편 레이놀즈는 해밀턴에게 협박 편지를 보내 침묵과 불륜의 대가로 1,000달러를 요구하고, 해밀턴은 자신의 명예와 직위를 지키기 위해 돈을 지불하며 치명적인 협박의 늪으로 깊숙이 빨려 들어갑니다.", "notes": ["**관능적인 90년대 R&B 슬로우 잼 스타일**: 이 곡은 브로드웨이 뮤지컬 넘버임에도 불구하고 디앤젤로(D’Angelo), 테빈 캠벨(Tevin Campbell) 풍의 끈적하고 관능적인 90년대 R&B 슬로우 잼 스타일로 작곡되었습니다. 마리아 레이놀즈의 호소력 짙고 유혹적인 보컬과 해밀턴의 절박한 내면 갈등이 교차하며 강렬한 에로틱 서스펜스를 형성합니다.", "**‘Helpless’의 불길한 전복과 변주**: 1막에서 일라이자가 해밀턴에게 순수한 사랑에 빠졌을 때 불렀던 메인 테마 멜로디와 가사 \"Helpless(어쩔 줄 몰라 / 무력하게 빠져들어)\"가 이 곡에서 마리아 레이놀즈와 해밀턴의 입을 통해 불길하게 변주됩니다. 한때 순수한 축복이었던 단어가 이제는 억제할 수 없는 육욕과 파멸의 족쇄로 전락하는 문학적 아이러니를 극대화합니다.", "**미국 역사상 최초의 대형 정치 섹스 스캔들**: 해밀턴과 마리아의 불륜 및 제임스 레이놀즈에게 건넨 입막음 돈은 단순한 사생활 스캔들에 그치지 않았습니다. 훗날 정적들로부터 '공금 횡령 및 금융 투기 혐의'로 조사를 받게 되었을 때, 해밀턴은 공금 횡령범이 아니라는 결백을 증명하기 위해 불륜 사실을 스스로 폭로하는 《레이놀즈 팸플릿(The Reynolds Pamphlet)》을 발표하게 되며, 이로 인해 그의 정치적 야망은 완전히 파멸합니다.", "**아론 버의 냉소적인 나레이션 프레임**: 넘버의 시작을 여는 아론 버의 냉소적인 운문(\"There’s nothing like summer in the city / Someone under stress meets someone looking pretty\")은 도시의 열기와 인간의 나약함이 빚어낸 필연적 비극을 예고하며 관객을 관음적 관찰자의 위치로 끌어들입니다."], "stanzas": [{"key": "27:1-4", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["There’s nothing like summer in the city", "Someone under stress meets someone looking pretty", "There’s trouble in the air, you can smell it", "And Alexander’s by himself. I’ll let him tell it"], "lines_kr": ["도시의 여름만 한 게 또 없지", "스트레스에 짓눌린 자가 어여쁜 여인을 마주치는 계절", "공기 중에 불길한 기운이 감돌아, 냄새만으로도 알 수 있지", "그리고 알렉산더는 혼자 남아 있네. 그가 직접 털어놓게 두지"]}, {"key": "27:5-11", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I hadn’t slept in a week", "I was weak, I was awake", "You never seen a bastard orphan", "More in need of a break", "Longing for Angelica", "Missing my wife", "That’s when Miss Maria Reynolds walked into my life, she said:"], "lines_kr": ["일주일 동안 한숨도 자지 못했소", "난 쇠약해졌고, 멍하니 깨어 있었지", "그 누구도 이보다 더 휴식이 절실한", "사생아 고아를 본 적이 없을 거요", "안젤리카를 갈망하고", "내 아내를 그리워하던 그때", "마리아 레이놀즈 양이 내 삶 속으로 걸어 들어왔소, 그녀가 말하길:"]}, {"key": "27:12-14", "speaker_kr": "마리아 레이놀즈", "speaker_en": "Maria Reynolds", "lines_en": ["I know you are a man of honor", "I’m so sorry to bother you at home", "But I don’t know where to go, and I came here all alone…"], "lines_kr": ["당신이 고결한 명예를 지닌 분이란 걸 알아요", "댁까지 찾아와 성가시게 해드려 정말 죄송해요", "하지만 갈 곳이 없어, 이렇게 혼자 찾아왔어요…"]}, {"key": "27:15", "speaker_kr": "알렉산더 해밀턴", "spe '에서 소수의 손에 의해 이루어지는 것을 밖에서 지켜보며 극심한 소외감과 권력욕을 느낍니다. 'No one else was in the room where it happened(그 일이 벌어진 그 방엔 아무도 없었지)'를 반복하며 권력의 본질을 깨달은 버는, 마침내 방관자의 껍질을 깨고 나와 '나도 그 방에 있고 싶다(I wanna be in the room where it happens)'고 절규하며 능동적이고 야심 찬 권력 투쟁자로 완벽한 정치적 각성을 이룹니다.", "notes": ["**1790년의 타협(Compromise of 1790 / The Dinner Bargain)**: 역사상 '디너 테이블 거래'로 불리는 실화입니다. 당시 의회는 수도 입지 문제와 해밀턴의 국가 부채 인수안 문제로 완전한 교착 상태에 빠져 있었습니다. 제퍼슨이 주선한 만찬에서 해밀턴은 '수도'를 내주고 '국가의 경제적 주권과 중앙은행 시스템'을 얻어냈습니다. 이는 미국이 농본주의 국가에서 금융·산업 중심의 강대국으로 발돋움하는 초석이 되었습니다.", "**오토 폰 비스마르크의 명언과 정치 풍자**: 버의 가사 'No one really knows how the game is played / The art of the trade, how the sausage gets made'(게임이 어떻게 진행되는지 아무도 모르지 / 거래의 기술, 소시지가 어떻게 만들어지는지)는 19세기 독일 수상 비스마르크에게 귀속되는 유명한 격언('법과 소시지는 만들어지는 과정을 보지 않는 편이 낫다')을 직접 인용한 것입니다. 정치의 고결한 명분 뒤에 숨은 추악한 타협과 거래의 본질을 날카롭게 풍자합니다.", "**아론 버의 실존적 전환점과 'Wait for It'의 종말**: 1막의 대표곡 'Wait for It'에서 버는 때를 기다리는 신중함과 절제를 자신의 미덕이자 생존 전략으로 여겼습니다. 그러나 해밀턴이 위험을 무릅쓰고 거래에 뛰어들어 역사를 쥐락펴락하는 모습을 보며, 해밀턴으로부터 'If you stand for nothing, Burr, what do you fall for?(아무것도 지키지 않는다면, 버, 당신은 대체 무엇을 위해 무너질 텐가?)'라는 일침을 맞자 억눌렸던 권력욕이 폭발합니다. 래그타임과 브로드웨이 쇼튠의 황홀한 크레셴도 속에서 버는 관조자에서 굶주린 정치가로 재탄생합니다.", "**휴 머서(Hugh Mercer) 장군과 거리 이름의 상징성**: 곡의 오프닝에서 언급되는 머서 장군은 프린스턴 전투에서 전사한 독립전쟁의 영웅입니다. 그를 기려 클레몬트 거리를 머서 거리로 바꿨다는 일화를 통해, '이름을 남기기 위해 그가 해야 했던 유일한 일은 죽는 것뿐이었다(all he had to do was die)'라며 역사적 유산(Legacy)을 남기고자 하는 해밀턴과 버의 집착을 유머러스하면서도 씁쓸하게 조명합니다."], "stanzas": [{"key": "28:1", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Ah, Mister Secretary"], "lines_kr": ["아, 재무장관님"]}, {"key": "28:2", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mister Burr, sir"], "lines_kr": ["버 변호사님"]}, {"key": "28:3", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Didja hear the news about good old General Mercer?"], "lines_kr": ["우리의 오랜 영웅 머서 장군에 관한 소식 들었나?"]}, {"key": "28:4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["No"], "lines_kr": ["아니요" 에게 패배하여 의석을 잃는 대이변이 발생합니다. 버는 원래 연방파 성향이었으나, 스카일러 장군을 꺾기 위해 재빨리 제퍼슨과 매디슨의 민주공화파(Democratic-Republican)로 당적을 갈아치우는 기회주의적 승부수를 던졌던 것입니다. 해밀턴은 오랜 친구였던 버가 뚜렷한 정치적 신념이나 정책 철학도 없이 오직 권력을 잡겠다는 기회주의적 야욕으로 자신의 장인을 몰아내고 당적까지 바꿨다는 사실에 격분합니다. 반면 버는 월스트리트의 엘리트들에게만 환호받고 북부 평민들에게는 오만하고 부패했다는 의심을 받는 해밀턴의 한계를 꼬집으며, '교만은 패망의 선봉(Pride goeth before the fall)'이라는 잠언을 인용하며 해밀턴에게 경고합니다. 1막에서부터 이어져 온 두 사람의 아슬아슬한 우정과 라이벌 관계가 돌이킬 수 없는 숙명의 정적(political enemies) 관계로 완전히 틀어지는 결정적인 분기점입니다.", "notes": ["**1791년 뉴욕주 상원의원 선거의 역사적 사실**: 1791년 뉴욕주 상원의원 선거에서 아론 버는 현직 의원이자 독립전쟁 영웅인 필립 스카일러 장군을 꺾고 상원의원에 당선되었습니다. 버는 특정 정파에 얽매이지 않고 실용적·중도적 태도를 취하며 스카일러 가문의 오랜 정치적 독점에 피로감을 느끼던 뉴욕 북부 의원들의 표를 결집해 승리했습니다. 이 선거로 인해 해밀턴은 버를 사리사욕에 눈먼 위험한 기회주의자로 낙인찍게 됩니다.", "**성경 잠언(Proverbs) 인용과 파멸의 예고**: 버의 마지막 경고인 'I swear your pride will be the death of us all / Beware, it goeth before the fall'은 구약성경 잠언 16장 18절('교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라 / Pride goeth before destruction, and an haughty spirit before a fall')을 직접 인용한 것입니다. 해밀턴의 치명적인 자만심과 타협을 모르는 성격이 결국 자신뿐만 아니라 국가와 주변 모든 사람을 파멸로 이끌 것이라는 날카로운 예언입니다.", "**버의 극적 변모: 관망자에서 포식자로**: 직전 곡 'The Room Where It Happens'에서 'I wanna be in the room'을 외치며 권력을 갈망했던 버가 곧바로 자신의 갈망을 실행에 옮겼음을 보여줍니다. 'Since when are you a Democratic-Republican?'(언제부터 민주공화파였지?)이라는 해밀턴의 물음에 'Since being one put me on the up and up again'(그게 날 다시 위로 올라서게 만들어준 순간부터지)이라고 답하는 대사는 신념보다 실리를 우선시하는 버의 마키아벨리적 면모를 압축적으로 드러냅니다.", "**월스트리트 대 업스테이트 뉴욕의 정치 지형**: 'Wall Street thinks you’re great / But upstate— people think you’re crooked'라는 버의 대사는 당시 미국 정치의 지역적·계급적 균열을 정확히 짚어냅니다. 해밀턴의 금융 중심 정책이 대도시 금융 엘리트에게는 찬사를 받았지만, 지방 자영농과 평민들에게는 특권층을 위한 부패로 비쳤음을 보여줍니다."], "stanzas": [{"key": "29:1-4", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Look!", "Grandpa’s in the paper!", "“War hero Philip Schuyler loses senate seat to young upstart Aaron Burr”", "Grandpa just lost his seat in the senate"], "lines_kr": ["보세요!", "할아버지가 신문에 나왔어요!", "“전쟁 영웅 필립 스카일러, 젊은 벼락출세자 아론 버에게 상원의원 의석 빼앗겨”", "할아버지가 방금 상원의원 자리를 잃으셨대요"]}, {"key": "29:5", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Sometimes that’s how it goes"], "lines_kr": ["세상일이란 때로 그럴 때도 있는 법이란다"]}, {"key": "29:6", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Daddy’s gonna find out any minute"], "lines_kr": ["아빠도 곧 알게 되실 텐데요"]}, {"key": "29:7", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I’m sure he already knows"], "lines_kr": ["벌써 다 알고 계실 게 분명해"]}, {"key": "29:8", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Further down"], "lines_kr": ["기사 아래쪽엔"]}, {"key": "29:9", "speaker_kr": "필립 해밀턴, 일라이자 스카일러", "speaker_en": "Philip Hamilton, Eliza Schuyler", "lines_en": ["Further down"], "lines_kr": ["기사 아래쪽엔"]}, {"key": "29:10", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Let’s meet the newest senator from New York"], "lines_kr": ["뉴욕의 새로운 상원의원을 만나보자"]}, {"key": "29:11", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["New York"], "lines_kr": ["뉴욕의"]}, {"key": "29:12", "speaker_kr": "필립 해밀턴, 일라이자 스카일러", "speaker_en": "Philip Hamilton, Eliza Schuyler", "lines_en": ["Our senator"], "lines_kr": ["우리 상원의원"]}, {"key": "29:13-14", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Burr?", "Since when are you a Democratic-Republican?"], "lines_kr": ["버?", "자네가 대체 언제부터 민주공화파였지?"]}, {"key": "29:15", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Since being one put me on the up and up again"], "lines_kr": ["그 당원이 되는 게 날 다시 출셋길로 올려놓은 순간부터라네"]}, {"key": "29:16", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["No one knows who you are or what you do"], "lines_kr": ["자네가 누구인지, 무슨 일을 하는지 아는 사람은 아무도 없어"]}, {"key": "29:17-18", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["They don’t need to know me", "They don’t like you"], "lines_kr": ["날 알 필요는 없지", "사람들이 자넬 싫어하니까"]}, {"key": "29:19", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Excuse me?"], "lines_kr": ["뭐라고?"]}, {"key": "29:20-22", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Oh, Wall Street thinks you’re great", "You’ll always be adored by the things you create", "But upstate—"], "lines_kr": ["오, 월스트리트야 자넬 대단하다고 떠받들겠지", "자네가 만든 제도들 덕에 늘 칭송받을 테고", "하지만 북부 시골에서는—"]}, {"key": "29:23", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Wait"], "lines_kr": ["잠깐"]}, {"key": "29:24-25", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["—people think you’re crooked", "Schuyler’s seat was up for grabs so I took it"], "lines_kr": ["—사람들이 자넬 사기꾼 부패배로 여긴다네", "스카일러의 자리가 임자 없는 떡밥으로 나와 있길래 내가 낚아챘을 뿐이야"]}, {"key": "29:26", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’ve always considered you a friend"], "lines_kr": ["난 자넬 언제나 내 친구로 여겨왔는데"]}, {"key": "29:27", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I don’t see why that has to end!"], "lines_kr": ["그게 왜 끝나야 하는지 난 도무지 이유를 모르겠군!"]}, {"key": "29:28", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You changed parties to run against my father-in-law"], "lines_kr": ["자넨 내 장인어른을 꺾으려고 당적까지 갈아치웠어"]}, {"key": "29:29-31", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I changed parties to seize the opportunity I saw", "I swear your pride will be the death of us all", "Beware, it goeth before the fall..."], "lines_kr": ["난 내 눈에 들어온 절호의 기회를 잡기 위해 당을 바꿨을 뿐이네", "맹세컨대 자네의 그 오만함이 우리 모두를 죽음으로 몰아넣을 거야", "조심하게, 교만은 파멸의 선봉이니…"]}]}, {"id": 30, "act": 2, "title": "Cabinet Battle #2", "title_kr": "제2차 국무회의 랩 배틀", "characters_kr": ["조지 워싱턴", "앙상블 전체", "토머스 제퍼슨", "알렉산더 해밀턴", "제임스 매디슨"], "characters_en": ["George Washington", "Company", "Thomas Jefferson", "Alexander Hamilton", "James Madison"], "synopsis": "1793년, 프랑스 혁명이 격화되어 루이 16세가 단두대에서 처형되고 프랑스와 영국 간에 전쟁이 발발하자, 미국 정부가 프랑스를 군사적으로 지원해야 하는가를 두고 벌어진 제2차 국무회의 랩 배틀입니다. 이번 결정은 의회 승인이 필요 없는 대통령 고유의 외교적 통수권 사안으로, 오직 조지 워싱턴 대통령 한 사람의 마음을 얻는 자가 승리하는 진검승부입니다. 토머스 제퍼슨은 독립전쟁 당시 미국이 절대적인 위기에 처했을 때 프랑스가 막대한 자금과 군대, 그리고 라파예트 장군을 보내 도와주었던 역사적 은혜와 상호방위조약을 상기시키며, 폭정과 싸우는 프랑스 혁명군을 돕는 것이 국가의 도리이자 혁명 이념을 지키는 길이라고 강력히 주장합니다. 반면 해밀턴은 우리가 조약을 맺었던 당사자인 프랑스 국왕은 이미 단두대 바구니에 머리가 잘려 들어갔다며, 현재 프랑스는 지도자도 없는 혼란 상태이고 갓 태어난 취약한 신생국 미국이 유럽 열강들의 거대한 전쟁에 휘말려 군대를 보냈다가는 국가 존립 자체가 위태로워진다는 현실주의적 외교 노선을 내세웁니다. 워싱턴은 해밀턴의 주장을 전폭적으로 지지하며 '중립 선언문(Neutrality Proclamation)'을 작성하라고 지시하고, 패배한 제퍼슨은 해밀턴에게 '워싱턴이라는 뒷배가 없으면 넌 아무것도 아니다'라며 독설을 퍼붓습니다.", "notes": ["**노토리어스 B.I.G.(Biggie Smalls)의 힙합 명곡 오마주**: 제퍼슨의 마무리 라인인 'Hey, and if ya don’t know, now ya know, Mr. President'는 전설적인 래퍼 노토리어스 B.I.G.의 데뷔 명곡 'Juicy'의 상징적인 시그니처 라인('And if you don't know, now you know, nigga')을 완벽하게 오마주한 힙합 이스터에그입니다. 린마누엘 미란다는 90년대 이스트코스트 힙합의 황금기를 건국의 역사적 배틀에 능수능란하게 엮어냅니다.", "**루이 16세의 참수와 블랙 코미디 펀치라인**: 해밀턴의 반격 랩 중 'We signed a treaty with a King whose head is now in a basket / Would you like to take it out and ask it? / \"Should we honor our treaty, King Louis’ head?\" / \"Uh… do whatever you want, I’m super dead.\"'는 뮤지컬 전체를 통틀어 가장 폭발적인 웃음과 전율을 자아내는 블랙 유머이자 국제정치학적 조약 승계 문제를 통렬하게 비꼰 명장면입니다.", "**1793년 중립 선언(Neutrality Proclamation)의 역사적 의의**: 워싱턴 대통령이 1793년 4월 발표한 중립 선언은 신생 미국의 외교 정책 기조를 '고립주의 및 실용주의적 중립'으로 확립한 중대한 사건이었습니다. 제퍼슨은 혁명 프랑스와의 의리를 중시하는 이상주의적 친불파였고, 해밀턴은 미국 경제의 생명선인 영국과의 무역 관계를 지키려는 친영/현실주의파였습니다. 이 갈등은 제퍼슨이 얼마 후 국무장관직을 사임하는 직접적인 계기가 됩니다.", "**라파예트(Lafayette)에 대한 의리와 우정의 갈등**: 제퍼슨이 'Did you forget Lafayette?'(라파예트를 잊었는가?)라며 도덕적 부채감을 자극하자, 1막에서 라파예트와 목숨을 걸고 참호를 누볐던 해밀턴은 '라파예트는 똑똑하니 무사할 것이며, 그는 당신 친구이기 전에 내 친구였다'라고 답합니다. 하지만 실제로 당시 라파예트는 급진파 자코뱅에 의해 반역자로 몰려 오스트리아 감옥에 수감되는 등 생사의 기로에 서 있었기에, 국가의 이익을 위해 옛 전우의 고난을 외면해야 하는 해밀턴의 냉혹한 현실정치적 고뇌가 묻어납니다."], "stanzas": [{"key": "30:1", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["The issue on the table: France is on the verge of war with England, and do we provide aid and our troops to our French allies or do we stay out of it? Remember, my decision on this matter is not subject to congressional approval. The only person you have to convince is me. Secretary Jefferson, you have the floor, sir"], "lines_kr": ["오늘 논의할 안건: 프랑스가 영국과의 전쟁 직전에 놓여 있습니다. 우리는 프랑스 동맹국에 원조와 군대를 파병해야 합니까, 아니면 전쟁에 개입하지 말아야 합니까? 기억하십시오, 이 사안에 대한 본인의 결정은 의회의 승인을 요하지 않습니다. 여러분이 설득해야 할 사람은 오직 나 한 사람뿐입니다. 제퍼슨 장관, 발언권을 드립니다, 말씀하시지요."]}, {"key": "30:2-5", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["When we were on death’s door, when we were needy", "We made a promise, we signed a treaty", "We needed money and guns and half a chance", "Who provided those funds?"], "lines_kr": ["우리가 죽음의 문턱에 서 있었을 때, 한 줌의 도움이 절실했을 때", "우린 약속을 맺었고, 조약에 서명했소", "우리에겐 돈과 총기, 그리고 실낱같은 기회가 필요했지", "그 막대한 자금을 누가 대주었습니까?"]}, {"key": "30:6", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["France"], "lines_kr": ["프랑스요"]}, {"key": "30:7-18", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["In return, they didn’t ask for land", "Only a promise that we’d lend a hand", "And stand with them if they fought against oppressors", "And revolution is messy but now is the time to stand", "Stand with our brothers as they fight against tyranny", "I know that Alexander Hamilton is here and he", "Would rather not have this debate", "I’ll remind you that he is not Secretary of State", "He knows nothing of loyalty", "Smells like new money, dresses like fake royalty", "Desperate to rise above his station", "Everything he does betrays the ideals of our nation"], "lines_kr": ["그 대가로, 그들은 땅을 요구하지도 않았소", "오직 우리가 손을 보태주겠다는 약속만을 바랐지", "그들이 압제자들과 맞서 싸울 때 그들 곁에 함께 서주겠다는 약속 말이오", "혁명이란 원래 난잡하고 피비린내 나는 법이나, 지금이야말로 함께 일어설 때요", "폭정에 맞서 싸우는 우리의 형제들 곁에 함께 서야 합니다", "알렉산더 해밀턴이 여기 와 있는 것을 압니다만", "그자는 이 논쟁 자체를 피하고 싶어 하겠지요", "하지만 상기시켜 드리자면 그자는 국무장관이 아닙니다", "그자는 의리나 충성심이란 걸 눈곱만큼도 모르는 자요", "졸부의 악취를 풍기며, 가짜 왕족처럼 옷을 차려입고서", "자신의 천한 출신을 벗어나 보려고 안달이 난 자이지", "그자가 하는 모든 짓거리는 우리 조국의 숭고한 이상을 배신하고 있소"]}, {"key": "30:19", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Ooh!!"], "lines_kr": ["오!!"]}, {"key": "30:20", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Hey, and if ya don’t know, now ya know, Mr. President"], "lines_kr": ["이봐요, 혹시 모르셨다면 이제 제대로 아셨을 겁니다, 대통령 각하"]}, {"key": "30:21", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Thank you, Secretary Jefferson. Secretary Hamilton, your response"], "lines_kr": ["감사합니다, 제퍼슨 장관. 해밀턴 장관, 답변하십시오"]}, {"key": "30:22-29", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You must be out of your Goddamn mind if you think", "The President is gonna bring the nation to the brink", "Of meddling in the middle of a military mess", "A game of chess, where France is Queen and Kingless", "We signed a treaty with a King whose head is now in a basket", "Would you like to take it out and ask it?", "“Should we honor our treaty, King Louis’ head?”", "“Uh… do whatever you want, I’m super dead.”"], "lines_kr": ["대통령 각하께서 이 나라를 군사적 난장판 한복판에", "밀어 넣어 국가를 파멸 직전으로 몰고 가실 거라 생각한다면", "당신은 빌어먹을 정신이 완전히 나간 게 틀림없소", "프랑스는 퀸도 없고 킹도 잃어버린 체스판 꼴인데 말이오", "우린 국왕과 조약을 맺었소, 그 국왕의 목은 지금 바구니에 담겨 뒹굴고 있고", "바구니에서 그 머리통을 꺼내 한번 물어보시겠소?", "“루이 국왕의 머리통 씨, 우리가 조약을 지켜야 합니까?”", "“어… 맘대로들 하쇼, 난 존나게 완벽하게 뒈졌으니까.”"]}, {"key": "30:30", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Enough. Hamilton is right"], "lines_kr": ["그만. 해밀턴의 말이 맞소"]}, {"key": "30:31", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Mr. President—"], "lines_kr": ["대통령 각하—"]}, {"key": "30:32", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["We’re too fragile to start another fight"], "lines_kr": ["우리는 또 다른 전쟁을 시작하기엔 너무나 유약하오"]}, {"key": "30:33", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["But sir, do we not fight for freedom?"], "lines_kr": ["하지만 각하, 우리는 자유를 위해 싸우지 않는 것입니까?"]}, {"key": "30:34", "speaker_kr": "조지 워싱턴", "speaker_en": 불어나는 재무부 자금 속에서 해밀턴이 저질렀을 금융 비리와 공금 횡령의 비리 증거를 파헤치기로 결의합니다. 이 넘버는 해밀턴을 향한 야당 연합의 치명적인 칼날이 완성되는 순간이며, 2막의 거대한 파국인 'We Know'와 'The Reynolds Pamphlet'으로 직결되는 긴박한 서사의 전초기지입니다.", "notes": ["**고난도 다음절 각운(Multi-syllabic Rhyme Scheme)의 극치**: 제퍼슨의 솔로 벌스는 힙합 테크닉의 정수를 보여줍니다. 'reactions / factions / fractions / retractions / satisfaction / passion / fashion / ration to ration'으로 이어지는 8연속 압도적인 다음절 라임과, 'disciplined dissidents / complicit in / difference' 등 정교하게 맞물리는 내부 압운은 린마누엘 미란다가 힙합의 언어적 밀도를 뮤지컬 무대 위에 완벽하게 구현했음을 증명합니다.", "**남부 민주공화파(Southern Democratic-Republicans)의 정체성 결집**: 'Southern motherfuckin’ Democratic-Republicans!'라는 폭발적인 챈트는 버지니아 출신의 남부 지주 계급(제퍼슨, 매디슨)과 북부의 야심가 버가 '반(反)해밀턴, 반(反)연방파'라는 단 하나의 목적을 위해 손을 잡았음을 선언하는 역사적 상징입니다. 신생 공화국의 1당 체제가 무너지고 완벽한 양당제(Two-party system)의 진영 대결이 본격화되었음을 보여줍니다.", "**‘Follow the money’와 워터게이트 사건의 문화적 레퍼런스**: 세 사람이 반복해서 외치는 'Let’s follow the money and see where it goes'(돈의 흐름을 쫓아 어디로 가는지 보자)는 영화 《모두가 대통령의 사람들(All the President’s Men)》에서 닉슨 대통령의 워터게이트 스캔들을 파헤치던 비밀 정보원 '딥 스로트'의 전설적인 명대사 'Follow the money'를 인용한 것입니다. 해밀턴의 재정 정책을 부패한 비리로 몰아가려는 야당의 집요한 정치 공작을 상징합니다.", "**권력 구조와 '워싱턴의 아들'이라는 콤플렉스**: 'You’re nothing without Washington behind you'라는 직전 곡의 조롱에 이어, 이 곡은 건국의 아버지들 사이에서 워싱턴이라는 거인의 절대적 권위와 그 그늘 아래서 벌어지는 질투를 적나라하게 그립니다. 매디슨은 자신이 헌법 권리장전(Bill of Rights)을 작성했음에도 불구하고 워싱턴이 해밀턴의 비대해진 행정부만을 편애한다며 분개하고, 제퍼슨은 '황제는 발가벗었다(The emperor has no clothes)'라며 해밀턴의 가면을 벗기겠다고 벼릅니다."], "stanzas": [{"key": "31:1-2", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["It must be nice, it must be nice to have Washington on your side", "It must be nice, it must be nice to have Washington on your side"], "lines_kr": ["참 좋기도 하겠지, 워싱턴이 네 편에 서 있으니 참으로 좋기도 하겠어", "참 좋기도 하겠지, 워싱턴이 네 편에 서 있으니 참으로 좋기도 하겠어"]}, {"key": "31:3-14", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Ev’ry action has its equal, opposite reactions", "Thanks to Hamilton, our cab’net’s fractured into factions", "Try not to crack under the stress, we’re breaking eaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["So he’s doubled the size of the government", "Wasn’t the trouble with much of our previous government size?"], "lines_kr": ["그리하여 놈은 정부의 규모를 두 배로 불려놓았어", "우리가 겪었던 지난 정부의 가장 큰 문제도 바로 비대한 덩치 아니었던가?"]}, {"key": "31:23", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Look in his eyes!"], "lines_kr": ["놈의 눈을 보시오!"]}, {"key": "31:24", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["See how he lies"], "lines_kr": ["놈이 어떻게 거짓말하는지 보게"]}, {"key": "31:25", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Follow the scent of his enterprise"], "lines_kr": ["놈의 야심 찬 사업들이 풍기는 냄새를 쫓아보시오"]}, {"key": "31:26-27", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Centralizing national credit", "And making American credit competitive"], "lines_kr": ["국가 신용을 중앙으로 집중시키고", "미국의 신용을 경쟁력 있게 만든다면서"]}, {"key": "31:28", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["If we don’t stop it we aid and abet it"], "lines_kr": ["우리가 막지 않는다면 그 죄를 방조하고 돕는 꼴이요"]}, {"key": "31:29", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["I have to resign"], "lines_kr": ["난 사임해야겠소"]}, {"key": "31:30", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Somebody has to stand up for the South!"], "lines_kr": ["누군가는 남부를 위해 당당히 맞서 싸워야 합니다!"]}, {"key": "31:31", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Somebody has to stand up to his mouth!"], "lines_kr": ["누군가는 놈의 그 거만한 주둥이를 닥치게 해야 해!"]}, {"key": "31:32", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["If there’s a fire you’re trying to douse"], "lines_kr": ["만약 끄고자 하는 불길이 있다면"]}, {"key": "31:33", "speaker_kr": "제임스 매디슨, 토머스 제퍼슨", "speaker_en": "James Madison, Thomas Jefferson", "lines_en": ["You can’t put it out from inside the house"], "lines_kr": ["집 안에서 그 불을 끌 수는 없는 법이지"]}, {"key": "31:34-38", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["I’m in the cabinet. I am complicit in", "Watching him grabbin’ at power and kiss it", "If Washington isn’t gon’ listen", "To disciplined dissidents, this is the difference:", "This kid is out!"], "lines_kr": ["난 내각에 앉아, 놈이 권력을 움켜쥐고", "거기에 입 맞추는 꼬락서니를 방관하며 공범 노릇을 하고 있소", "워싱턴 각하께서 절도 있는", "반대자들의 목소리에 귀 기울이지 않으신다면, 이것이 바로 결론이오:", "이 친구는 이제 사표 내고 나갑니다!"]}, {"key": "31:39-45", "speaker_kr": "제임스 매디슨, 아론 버, 토머스 제퍼슨", "speaker_en": "James Madison, Aaron Burr, Thomas Jefferson", "lines_en": ["Oh!", "This immigrant isn’t somebody we chose", "Oh!", "This immigrant’s keeping us all on our toes", "Oh!", "Let’s show these Federalists who they’re up against!", "Oh!"], "lines_kr": ["오!", "이 이민자 놈은 우리가 선택한 자가 아니야", "오!", "이 이민자 놈이 우리 모두를 잔뜩 긴장시키고 있군", "오!", "이 연방파 놈들에게 자기들이 상대하는 자가 누구인지 똑똑히 보여주자!", "오!"]}, {"key": "31:46", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Thomas Jefferson, James Madison", "lines_en": ["Southern motherfuckin’—"], "lines_kr": ["남부의 빌어먹을—"]}, {"key": "31:47", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Democratic-Republicans!"], "lines_kr": ["민주공화파의 매운맛을!"]}, {"key": "31:48", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Oh!"], "lines_kr": ["오!"]}, {"key": "31:49", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Let’s follow the money and see where it goes"], "lines_kr": ["돈의 흐름을 쫓아 어디로 가는지 파헤쳐보자"]}, {"key": "31:50", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Oh!"], "lines_kr": ["오!"]}, {"key": "31:51", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Because every second the Treasury grows"], "lines_kr": ["매 순간 국고의 덩치가 커져가고 있으니"]}, {"key": "31:52", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Oh!"], "lines_kr": ["오!"]}, {"key": "31:53-55", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["If we follow the money and see where it leads", "Get in the weeds, look for the seeds of Hamilton’s misdeeds", "It must be nice. It must be nice"], "lines_kr": ["우리가 돈의 흐름을 쫓아 그게 어디로 이어지는지 파헤치고", "수풀을 헤치고 들어가 해밀턴의 비리가 싹튼 뿌리를 찾아낸다면", "참 좋기도 하겠지, 참 좋기도 하겠어"]}, {"key": "31:56", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Follow the money and see where it goes"], "lines_kr": ["돈의 흐름을 쫓아 어디로 가는지 파헤쳐보자"]}, {"key": "31:57", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["It must be nice. It must be nice"], "lines_kr": ["참 좋기도 하겠지, 참 좋기도 하겠어"]}, {"key": "31:58", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["The emperor has no clothes"], "lines_kr": ["벌거벗은 임금님의 가면을 벗겨주마"]}, {"key": "31:59-60", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["We won’t be invisible. We won’t be denied. Still", "It must be nice, it must be nice to have Washington on your side"], "lines_kr": ["우린 투명인간이 되지 않을 것이며, 결코 배척당하지도 않으리라. 그래도", "참 좋기도 하겠지, 워싱턴이 네 편에 서 있으니 참으로 좋기도 하겠어"]}]}, {"id": 32, "act": 2, "title": "One Last Time", "title_kr": "마지막으로 한 번 더", "characters_kr": ["알렉산더 해밀턴", "여성 앙상블", "조지 워싱턴"], "characters_en": ["Alexander Hamilton", "Women", "George Washington"], "synopsis": "독립전쟁과 미합중국 건국의 최고 영웅이자 초대 대통령인 조지 워싱턴이 3선 연임을 고사하고 자발적으로 퇴임하겠다는 결단을 내리는 감동적이고 역사적인 순간을 담은 곡입니다. 영국과 프랑스의 전쟁 위기 속에서 토머스 제퍼슨이 대선 출마를 위해 사임하자, 해밀턴은 언론전을 통해 정적을 공격하고 워싱턴의 연임을 돕겠다고 제안합니다. 그러나 워싱턴은 한 개인이 영구히 권력을 쥐는 것은 군주정으로의 회귀일 뿐이며, 진정한 민주공화국의 성패는 최고 권력자가 평화롭고 명예롭게 권력을 이양하는 선례를 남기는 데 달려 있음을 해밀턴에게 설파합니다. 워싱턴은 해밀턴에게 성경 미가서 구절을 인용하며 평범한 시민으로 고향 마운트 버넌으로 돌아가 안식하고 싶다는 소망을 밝히고, 자신의 고별사(Farewell Address) 작성을 부탁합니다. 워싱턴의 영혼을 울리는 소울풍 보컬과 해밀턴의 낭독이 어우러지며, 스승이자 아버지 같은 지도자의 퇴장과 국가의 성숙을 웅장하게 그려냅니다.", "notes": ["조지 워싱턴의 고별사(Farewell Address)와 평화적 정권 이양: 1796년 발표된 워싱턴의 고별사는 미국 헌정사에서 가장 기념비적인 문서 중 하나입니다. 워싱턴은 3선 연임을 거부하고 자발적으로 퇴임함으로써, 국가 원수가 죽을 때까지 통치하는 군주정의 관습을 깨고 '평화적 권력 이양'이라는 민주주의의 핵심 선례를 확립했습니다. 실제 고별사의 초고는 매디슨이 작성했으나, 워싱턴은 해밀턴에게 건네 전면 수정 및 완성을 맡겼습니다.", "미가서 4장 4절('포도나무와 무화과나무'): 가사 중 'Everyone shall sit under their own vine and fig tree / And no one shall make them afraid'는 구약성경 미가서 4장 4절의 인용입니다. 워싱턴은 생전 서한과 연설에서 이 구절을 50회 가까이 인용할 정도로 사랑했으며, 전쟁과 정치의 격랑에서 벗어나 고향 마운트 버넌에서 평범한 시민으로 누리는 평화와 자유, 그리고 신생 조국의 번영과 안전을 상징합니다.", "당파 분열과 외세 개입에 대한 경고: 워싱턴이 'I want to warn against partisan fighting', 'neutrality'를 언급하는 것은 당시 프랑스 혁명 전쟁으로 인한 대외적 위기와, 연방당(해밀턴)과 민주공화당(제퍼슨) 간의 극단적인 정쟁을 가리킵니다. 워싱턴은 고별사에서 영구적인 대외 군사동맹과 국가를 분열시키는 당파적 파벌주의(factions)를 신생국가가 경계해야 할 최대 위험으로 지목했습니다.", "'History Has Its Eyes On You'와의 음악적 호응: 곡 후반부에서 워싱턴은 1막 19번 곡 'History Has Its Eyes On You'의 멜로디와 가사를 변주하여 부릅니다. 이는 역사의 시선이 단순히 영웅적 승리에만 머무는 것이 아니라, 언제 어떻게 권력을 내려놓고 퇴장하는가라는 결단의 순간에 더욱 준엄하게 쏠린다는 워싱턴의 역사적 혜안을 드러냅니다."], "stanzas": [{"key": "32:1", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mr. President, you asked to see me?"], "lines_kr": ["대통령 각하, 절 보자고 하셨습니까?"]}, {"key": "32:2", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I know you’re busy"], "lines_kr": ["자네가 바쁜 건 알지만"]}, {"key": "32:3", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["What do you need, sir? Sir?"], "lines_kr": ["무엇이 필요하십니까, 각하? 각하?"]}, {"key": "32:4", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I wanna give you a word of warning"], "lines_kr": ["경고를 한마디 해두고 싶어서 불렀네"]}, {"key": "32:5", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir, I don’t know what you heard but whatever it is, Jefferson started it"], "lines_kr": ["각하, 무슨 얘길 들으셨든 간에, 제퍼슨이 먼저 시작한 짓입니다"]}, {"key": "32:6", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Thomas Jefferson resigned this morning"], "lines_kr": ["토머스 제퍼슨이 오늘 아침 사임했네"]}, {"key": "32:7", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You’re kidding"], "lines_kr": ["농담이시겠죠"]}, {"key": "32:8", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I need a favor"], "lines_kr": ["부탁 하나 하세"]}, {"key": "32:9", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Whatever you say, sir, Jefferson will pay for his behavior"], "lines_kr": ["말씀만 하십시오, 각하. 제퍼슨은 그 대가를 치르게 될 겁니다"]}, {"key": "32:10", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Shh. Talk less"], "lines_kr": ["쉿. 말은 아끼게"]}, {"key": "32:11-12", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’ll use the press", "I’ll write under a pseudonym, you’ll see what I can do to him—"], "lines_kr": ["언론을 이용하겠습니다", "필명으로 글을 쓰죠, 제가 그자를 어떻게 짓밟는지 보시게 될 겁니다—"]}, {"key": "32:13", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I need you to draft an address"], "lines_kr": ["연설문 초안을 작성해 주게"]}, {"key": "32:14", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Yes! He resigned. You can finally speak your mind—"], "lines_kr": ["좋습니다! 그자가 사임했으니 마침내 각하의 속마음을 밝히실 수—"]}, {"key": "32:15", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["No, he’s stepping down so he can run for President"], "lines_kr": ["아닐세, 대선에 출마하려고 물러난 거야"]}, {"key": "32:16", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Ha. Good luck defeating you, sir"], "lines_kr": ["하. 각하를 꺾겠다니 가소롭군요"]}, {"key": "32:17", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I’m stepping down. I’m not running for President"], "lines_kr": ["나도 물러나네. 대선에 출마하지 않을 걸세"]}, {"key": "32:18", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’m sorry, what?"], "lines_kr": ["죄송하지만, 뭐라고요?"]}, {"key": "32:19-25", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["One last time", "Relax, have a drink with me", "One last time", "Let’s take a break tonight", "And then we’ll teach them how to say goodbye", "To say goodbye", "You and I"], "lines_kr": ["마지막으로 한 번 더", "긴장 풀고, 나와 한잔하세", "마지막으로 한 번 더", "오늘 밤은 잠시 쉬어가세", "그러고 나면 저들에게 작별하는 법을 가르쳐 주는 거야", "작별을 고하는 법을", "자네와 내가"]}, {"key": "32:26", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["No, sir, why?"], "lines_kr": ["안 됩니다, 각하, 어째서요?"]}, {"key": "32:27", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I wanna talk about neutrality"], "lines_kr": ["중립에 대해 이야기하고 싶네"]}, {"key": "32:28", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir, with Britain and France on the verge of war, is this the best time—"], "lines_kr": ["각하, 영국과 프랑스가 전쟁 직전인데 지금이 과연 적기입니까—"]}, {"key": "32:29", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["I want to warn against partisan fighting"], "lines_kr": ["당파 싸움의 위험을 경고하고 싶어"]}, {"key": "32:30", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["But—"], "lines_kr": ["하지만—"]}, {"key": "32:31-33", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Pick up a pen, start writing", "I wanna talk about what I have learned", "The hard-won wisdom I have earned"], "lines_kr": ["펜을 들고, 글을 쓰기 시작하게", "내가 배우고 깨달은 바를 말하고 싶네", "피땀 흘려 얻어낸 지혜를"]}, {"key": "32:34-35", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["As far as the people are concerned", "You have to serve, you could continue to serve—"], "lines_kr": ["국민들의 입장에서 본다면", "각하께선 봉사하셔야 합니다, 계속해서 이 나라를 이끄실 수—"]}, {"key": "32:36-41", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["No! One last time", "The people will hear from me", "One last time", "And if we get this right", "We’re gonna teach ‘em how to say goodbye", "You and I—"], "lines_kr": ["아닐세! 마지막으로 한 번 더", "국민들은 내 목소리를 듣게 될 걸세", "마지막으로 한 번 더", "그리고 우리가 이를 제대로 해낸다면", "우린 저들에게 작별하는 법을 가르치게 될 거야", "자네와 내가—"]}, {"key": "32:42", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mr. President, they will say you’re weak"], "lines_kr": ["대통령 각하, 사람들은 각하께서 나약해지셨다 할 겁니다"]}, {"key": "32:43", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["No, they will see we’re strong"], "lines_kr": ["아니, 우리가 강하다는 걸 보게 될 걸세"]}, {"key": "32:44", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Your position is so unique"], "lines_kr": ["각하의 위상은 유일무이합니다"]}, {"key": "32:45", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["So I’ll use it to move them along"], "lines_kr": ["그러니 그 위상을 이용해 저들을 앞으로 나아가게 해야지"]}, {"key": "32:46", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Why do you have to say goodbye?"], "lines_kr": ["어째서 작별을 고하셔야만 합니까?"]}, {"key": "32:47-56", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["If I say goodbye, the nation learns to move on", "It outlives me when I’m gone", "Like the scripture says:", "“Everyone shall sit under their own vine and fig tree", "And no one shall make them afraid.”", "They’ll be safe in the nation we’ve made", "I wanna sit under my own vine and fig tree", "A moment alone in the shade", "At home in this nation we’ve made", "One last time"], "lines_kr": ["내가 작별을 고해야, 이 나라가 스스로 나아가는 법을 배우네", "내가 떠난 후에도 나라는 영원히 살아남을 테지", "성경 구절에 나오듯이 말이야:", "“모든 이가 저마다의 포도나무와 무화과나무 아래 앉을 것이요", "그 누구도 그들을 두렵게 하지 못하리라.”", "우리가 일군 이 나라에서 그들은 안전할 걸세", "나 역시 내 포도나무와 무화과나무 그늘 아래 앉고 싶네", "그늘 속에서 홀로 누리는 한순간의 안식", "우리가 일군 이 나라, 내 안식처에서", "마지막으로 한 번 더"]}, {"key": "32:57", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["One last time"], "lines_kr": ["마지막으로 한 번 더"]}, {"key": "32:58-62", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Though, in reviewing the incidents of my administration, I am unconscious of intentional error, I am nevertheless too sensible of my defects not to think it probable that I may have committed many errors. I shall also carry with me", "The hope that my country will view them with indulgence", "And that after forty-five years of my life dedicated to its service with an upright zeal the faults of incompetent abilities will be consigned to oblivion, as I myself must soon be to the mansions of rest", "I anticipate with pleasing expectation that retreat in which I promise myself to realize the sweet enjoyment of partaking, in the midst of my fellow-citizens, the benign influence of good laws", "Under a free government, the ever-favorite object of my heart, and the happy reward, as I trust of our mutual cares, labors, and dangers."], "lines_kr": ["비록 재임 기간 동안의 일들을 되돌아보건대, 의도된 잘못은 없었다고 자부하오나, 제 자신의 부족함을 너무나 잘 알기에 수많은 과오를 범했을 가능성을 인정하지 않을 수 없습니다. 아울러 저는 다음의 희망을 간직할 것입니다,", "조국이 그 과오들을 너그러운 시선으로 바라보아 주리라는 희망과,", "곧 영면의 안식처로 향해야 할 제 자신처럼, 올곧은 열정으로 45년간 조국에 헌신한 제 부족한 능력의 결점들 또한 잊힘의 저편으로 사라져 주리라는 희망을 품습니다.", "동료 시민들의 품속에서, 훌륭한 법률의 자애로운 영향력을 함께 나누는 달콤한 기쁨을 누릴 은퇴의 날을 기쁜 기대 속에 고대합니다.", "제 가슴이 언제나 염원해 온 자유 정부 아래서, 그리고 우리 모두의 보살핌과 노고, 위험을 함께 견뎌낸 행복한 보상으로서 말입니다."]}, {"key": "32:63", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["One last time"], "lines_kr": ["마지막으로 한 번 더"]}, {"key": "32:64", "speaker_kr": "여성 앙상블", "speaker_en": "Women", "lines_en": ["George Washington’s going home!"], "lines_kr": ["조지 워싱턴이 집으로 돌아간다!"]}, {"key": "32:65", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Teach ‘em how to say goodbye"], "lines_kr": ["작별하는 법을 저들에게 가르치소서"]}, {"key": "32:66-74", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["You and I", "Going home", "History has its eyes on you", "We’re gonna teach ‘em how to say goodbye!", "Teach ‘em how to say", "Goodbye", "To say goodbye!", "Say goodbye!", "One last time!"], "lines_kr": ["자네와 내가", "집으로 돌아가네", "역사의 눈이 당신을 지켜보고 있으니", "우린 저들에게 작별하는 법을 가르칠 걸세!", "말하는 법을 가르치리라", "작별을", "작별을 고하는 법을!", "작별을 고하리라!", "마지막으로 한 번 더!"]}]}, {"id": 33, "act": 2, "title": "I Know Him", "title_kr": "난 그 친구 알지", "characters_kr": ["조지 3세"], "characters_en": ["King George III"], "synopsis": "조지 워싱턴이 미국 대통령직에서 자진 사임했다는 믿을 수 없는 소식을 접한 영국 국왕 조지 3세의 놀라움과 냉소적인 조롱을 그린 경쾌한 브릿팝 넘버입니다. 세습 절대군주인 조지 3세의 상식으로는 통치자가 스스로 절대 권력을 내려놓는다는 것 자체가 상상조차 할 수 없는 기괴한 일이었습니다. 더욱이 워싱턴의 뒤를 이어 제2대 대통령으로 선출된 인물이 과거 런던에 사절로 와서 어색하게 알현했던 왜소한 존 애덤스라는 사실을 알게 되자, 조지 3세는 폭소를 터뜨립니다. 워싱턴이라는 거대한 카리스마가 사라진 신생 미국은 머지않아 극심한 정쟁과 분열로 서로를 찢어발길 것이며, 불쌍한 애덤스는 산 채로 먹잇감이 될 것이라며 고소해합니다.", "notes": ["조지 3세 솔로 3부작의 피날레: 1막의 'You'll Be Back', 'What Comes Next?'에 이은 조지 3세의 세 번째 솔로 곡입니다. 1막에서 미국의 반역과 독립에 분노하고 당혹스러워했던 왕은, 이제 바다 건너 옛 식민지가 겪게 될 내분을 팔짱 끼고 구경하며 고소해하는 냉소적인 관찰자로 등장합니다.", "군주정의 세계관과 공화정의 충돌: 'I wasn’t aware that was something a person could do'(사람이 그럴 수도 있다는 건 금시초문인데)라는 대사는 평생 권좌를 유지하다 죽는 세습 군주 조지 3세의 시각에서, 임기를 마치고 평민으로 돌아가는 공화정의 지도자가 얼마나 충격적이고 기이하게 보였는지를 명쾌하게 풍자합니다. 실제로 조지 3세는 워싱턴이 스스로 사임했다는 소식을 듣고 화가 벤저민 웨스트에게 '그게 사실이라면 워싱턴은 세계에서 가장 위대한 인물이다'라고 평했다고 전해집니다.", "존 애덤스와의 역사적 알현(1785년): 가사 중 'That’s that little guy who spoke to me / All those years ago / What was it, eighty-five?'는 1785년 존 애덤스가 초대 주영 미국 공사로 런던 세인트 제임스 궁전에서 조지 3세를 공식 알현했던 실제 사건을 가리킵니다. 당시 체구가 작고 성격이 깐깐했던 애덤스의 인상을 조지 3세가 기억하며 비웃는 대목입니다.", "'Next to Washington, they all look small'과 정쟁의 예언: 조지 3세의 말처럼 건국의 아버지이자 중재자였던 워싱턴의 거대한 그림자에 비하면 후임자들은 한없이 작아 보였으며, 워싱턴의 퇴임 직후 미국은 연방당과 민주공화당의 살벌한 당파 싸움으로 치달았습니다. 조지 3세의 악의적인 예측('They will tear each other into pieces')은 곧 현실이 됩니다."], "stanzas": [{"key": "33:1-26", "speaker_kr": "조지 3세", "speaker_en": "King George III", "lines_en": ["They say", "George Washington’s yielding his power and stepping away", "‘Zat true?", "I wasn’t aware that was something a person could do", "I’m perplexed", "Are they gonna keep on replacing whoever’s in charge?", "If so, who’s next?", "There’s nobody else in their country who looms quite as large…", "John Adams?!", "I know him", "That can’t be", "That’s that little guy who spoke to me", "All those years ago", "What was it, eighty-five?", "That poor man, they’re gonna eat him alive!", "Oceans rise", "Empires fall", "Next to Washington, they all look small", "All alone", "Watch them run", "They will tear each other into pieces", "Jesus Christ, this will be fun!", "Da da da dat da dat da da da da ya da", "Da da da dat dat da ya daaaaa!", "President John Adams", "Good Luck"], "lines_kr": ["사람들 말이", "조지 워싱턴이 권력을 내려놓고 물러난다더군", "그게 사실인가?", "인간이 그런 짓을 할 수도 있다는 건 금시초문인데", "참으로 당혹스럽군", "그럼 지도자가 바뀔 때마다 계속해서 교체하겠다는 건가?", "그렇다면, 다음은 누구지?", "그 나라에 워싱턴만큼 거대한 인물은 아무도 없는데…", "존 애덤스라고?!", "난 그 친구 알지", "말도 안 돼", "예전에 나한테 와서 주절거리던 그 꼬맹이잖아", "그 먼 옛날에 말이야", "그게 언제였더라, 1785년인가?", "가엾은 양반, 사람들이 그를 산 채로 뜯어먹겠군!", "바다는 솟구치고", "제국은 무너지지", "워싱턴 곁에 서면 다들 왜소해 보일 뿐", "외톨이가 되어", "허둥지둥 도망치는 꼴을 보라고", "저들은 서로를 갈가리 찢어발길 테니", "세상에 맙소사, 정말 볼만하겠어!", "다 다 다 닷 다 닷 다 다 다 다 야 다", "다 다 다 닷 닷 다 야 다아아아!", "존 애덤스 대통령이라니", "행운을 비네"]}]}, {"id": 34, "act": 2, "title": "The Adams Administration", "title_kr": "애덤스 행정부", "characters_kr": ["아론 버", "앙상블 전체", "토머스 제퍼슨", "알렉산더 해밀턴", "제임스 매디슨"], "characters_en": ["Aaron Burr", "Company", "Thomas Jefferson", "Alexander Hamilton", "James Madison"], "synopsis": "조지 워싱턴의 시대가 끝나고 제2대 존 애덤스 대통령의 행정부가 출범한 이후, 해밀턴이 자당의 대통령과 격렬하게 충돌하며 정치적 파국으로 치닫는 과도기적 상황을 빠른 랩과 내레이션으로 전개하는 곡입니다. 2위 득표자인 제퍼슨이 부통령이 된 기형적인 정부 속에서, 애덤스는 자신에게 사사건건 간섭하려는 해밀턴을 축출하고 사석에서 '크리올 사생아'라며 맹비난합니다. 자존심에 치명상을 입은 해밀턴은 참지 못하고 자당 대통령을 비난하는 공개 반박 서한을 발표하여 연방당의 분열을 자초합니다. 아론 버는 해밀턴의 통제 불능 상태를 관찰하고, 제퍼슨과 매디슨은 권력을 잃고 야인이 된 해밀턴이 자멸하는 것을 보며, 여전히 위협적인 그의 펜을 완전히 꺾기 위해 숨겨둔 비장의 카드(금융 비리 의혹)를 꺼내기로 결심합니다.", "notes": ["연방당 내부의 파멸적 권력 투쟁: 존 애덤스와 알렉산더 해밀턴은 둘 다 연방당 소속이었지만 서로를 격렬히 혐오했습니다. 애덤스는 해밀턴의 외모와 혈통을 조롱하며 '크리올 사생아(creole bastard)'라고 멸시했고, 해밀턴은 애덤스의 리더십과 정신적 적합성을 공격하는 54쪽 분량의 공개 서한(1800년)을 발표했습니다. 이 내분은 연방당의 궤멸과 1800년 대선 참패로 이어졌습니다.", "해밀턴의 비극적 기질과 방어기제: 오프닝 넘버의 비트를 변주하는 이 곡에서 해밀턴의 치명적인 약점인 다혈질적 성격과 과도한 자존심이 부각됩니다. 자신을 지켜주던 정치적 후원자 워싱턴이 사라지자마자, 작은 모욕도 참지 못하고 극단적인 공개 반격에 나서는 해밀턴의 행동은 그의 뛰어난 지성이 통제 불능의 감정에 휘둘리고 있음을 보여줍니다.", "'Sit down, John'과 브로드웨이 뮤지컬 <1776> 오마주: 해밀턴의 대사 'Sit down, John, you fat mother—[BLEEP]'는 미국 독립선언을 다룬 고전 뮤지컬 <1776>의 대표적인 오프닝 넘버 'Sit Down, John'에 대한 오마주이자 욕설 묵음 처리를 통한 힙합 특유의 위트 있는 디스입니다.", "제퍼슨과 매디슨의 정치적 계산: 제퍼슨은 해밀턴이 공직에서 물러나 야인이 되었음에도 '펜을 쥘 수 있는 한 언제나 위협적인 군대'로 평가합니다. 이는 해밀턴의 뛰어난 문필력에 대한 정적들의 두려움을 나타내며, 그를 완전히 매장하기 위해 횡령 의혹으로 압박하러 가는 'We Know'의 직접적인 도화선이 됩니다."], "stanzas": [{"key": "34:1-5", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["How does Hamilton the short-tempered protean creator of the Coast Guard", "Founder of the New York Post", "Ardently abuse his cab’net post", "Destroy his reputation?", "Welcome, folks, to"], "lines_kr": ["다혈질에 카멜레온 같으며, 해안경비대의 창설자이자", "뉴욕 포스트의 설립자인 해밀턴은 어쩌다", "내각 요직을 제멋대로 휘두르며", "스스로의 명성을 박살 냈을까?", "여러분, 환영합니다"]}, {"key": "34:6", "speaker_kr": "아론 버, 앙상블 전체", "speaker_en": "Aaron Burr, Company", "lines_en": ["The Adams administration!"], "lines_kr": ["애덤스 행정부에 오신 것을!"]}, {"key": "34:7", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Jefferson’s the runner-up, which makes him the Vice President"], "lines_kr": ["2위를 한 제퍼슨이 부통령이 되었고"]}, {"key": "34:8", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Washington can’t help you now, no more mister nice President"], "lines_kr": ["워싱턴은 더 이상 널 못 도와, 인자한 대통령의 시대는 끝났거든"]}, {"key": "34:9-10", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Adams fires Hamilton", "Privately calls him “creole bastard” in his taunts"], "lines_kr": ["애덤스는 해밀턴을 해고하고", "뒤에서는 그를 '크리올 사생아'라 조롱했지"]}, {"key": "34:11", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Say what!"], "lines_kr": ["뭐라고?!"]}, {"key": "34:12", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Hamilton publishes his response"], "lines_kr": ["해밀턴은 반박문을 출판해 버렸지"]}, {"key": "34:13", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sit down, John, you fat mother—BLEEP"], "lines_kr": ["아가리 닥치고 앉아, 존, 이 뚱때지 개자—삐—"]}, {"key": "34:14", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Hamilton is out of control"], "lines_kr": ["해밀턴은 완전히 이성을 잃었어"]}, {"key": "34:15", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["This is great! He’s out of power. He holds no office. And he just destroyed President John Adams, the only other significant member of his party"], "lines_kr": ["이거 끝내주는군! 권력도 잃고 관직도 없는데, 자기 당의 유일하게 거물인 존 애덤스 대통령마저 제 손으로 무너뜨렸으니!"]}, {"key": "34:16", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Hamilton’s a host unto himself. As long as he can hold a pen, he’s a threat. Let’s let him know what we know"], "lines_kr": ["해밀턴은 그 자체로 군대야. 펜을 쥘 수 있는 한 언제든 위협이지. 우리가 무엇을 알고 있는지 그자에게 똑똑히 보여주자고"]}]}, {"id": 35, "act": 2, "title": "We Know", "title_kr": "우린 다 알고 있어", "characters_kr": ["알렉산더 해밀턴", "토머스 제퍼슨", "제임스 매디슨", "아론 버"], "characters_en": ["Alexander Hamilton", "Thomas Jefferson", "James Madison", "Aaron Burr"], "synopsis": "토머스 제퍼슨, 제임스 매디슨, 아론 버 세 사람이 해밀턴의 서재를 급습하여 재무장관 재직 시절의 공금 횡령 및 불법 투기 의혹을 들이밀며 자백을 요구하는 긴박한 대치 상황을 그린 넘버입니다. 세 사람은 해밀턴이 제임스 레이놀즈라는 인물에게 서로 다른 계좌에서 수천 달러를 분할 지급한 수표 내역을 제시하며 그를 반역과 횡령 혐의로 몰아세웁니다. 이민자 출신으로서 공직자의 결백과 명예를 목숨보다 소중히 여겼던 해밀턴은, 횡령범이라는 오명을 벗기 위해 극도로 치욕적인 진실을 털어놓기로 결심합니다. 그는 세 사람에게 비밀 보장 맹세를 받아낸 뒤, 그 돈이 공금이 아니라 마리아 레이놀즈와의 불륜 사실을 은폐하기 위해 남편 제임스 레이놀즈에게 지불했던 사적인 협박 합의금이었음을 편지와 수표 장부를 통해 낱낱이 증명합니다. 세 정적은 해밀턴이 공금을 횡령하지 않았음을 확인하고 입을 다물겠다고 물러서지만, 아론 버는 소문은 통제할 수 없다며 서늘한 경고를 남깁니다.", "notes": ["역사적 사실의 극적 압축과 각색: 1792년 실제로 해밀턴을 찾아가 횡령 혐의를 추궁했던 인물들은 제임스 먼로(James Monroe), 프레더릭 뮬런버그(Frederick Muhlenberg), 에이브러햄 베너블(Abraham Venable)이었습니다. 뮤지컬에서는 극적 갈등의 밀도를 높이고 주인공 간의 서사를 집중시키기 위해 해밀턴의 평생 정적들인 제퍼슨, 매디슨, 버로 대면 인물을 교체하여 긴장감을 극대화했습니다.", "공적 명예와 사적 치부의 극단적 치환: 해밀턴에게 재무부 공금을 유용한 파렴치한 부패 관료라는 혐의는 미국 헌정 체제와 자신의 평생 유산을 부정하는 최악의 불명예였습니다. 이를 벗어나기 위해 아내를 배신한 간통범이자 파렴치한 협박의 피해자라는 사적 수치를 자진해서 폭로하는 해밀턴의 선택은, 그의 병적인 명예욕과 왜곡된 자존심을 극명하게 보여줍니다.", "'밀실(The Room Where It Happens)'의 역설적 인용: 비밀을 털어놓기 전 해밀턴이 증거를 본 것을 발설하지 않겠다고 약속하겠느냐고 묻자, 버는 'No one else was in the room where it happened'(그 방엔 우리 외엔 아무도 없었잖아)라며 자신이 권력을 갈망하며 불렀던 대표곡의 가사를 능청스럽게 인용합니다. 밀실 정치의 방관자였던 버가 이제는 밀실의 심문관이자 공모자가 되었음을 보여주는 음악적 장치입니다.", "아론 버의 서늘한 경고와 해밀턴의 불안: 제퍼슨과 매디슨은 해밀턴이 공금을 건드리지 않았다는 사실에 경악하며 돌아섰지만, 해밀턴은 버가 언젠가 이 치명적인 약점을 자신과의 대결에서 무기로 쓰지 않을까 극도로 불안해합니다. 버의 'Rumors only grow. And we both know what we know'(소문이란 번지기 마련이고, 우린 우리가 아는 걸 알고 있지)라는 냉소적인 대답은 해밀턴의 영혼에 깊은 편집증을 심어주어 결국 다음 곡 'Hurricane'과 자폭성 팸플릿 출판으로 이어지게 만듭니다."], "stanzas": [{"key": "35:1-4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mr. Vice President", "Mr. Madison", "Senator Burr", "What is this?"], "lines_kr": ["부통령 각하", "매디슨 의원", "버 상원의원", "이게 다 무슨 일입니까?"]}, {"key": "35:5", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["We have the check stubs. From separate accounts…"], "lines_kr": ["우린 수표 용지를 확보했네. 서로 다른 계좌에서 발행된 것이지…"]}, {"key": "35:6", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Almost a thousand dollars, paid in different amounts…"], "lines_kr": ["천 달러에 육박하는 돈이, 여러 차례에 걸쳐 나뉘어 지급되었더군…"]}, {"key": "35:7", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["To a Mr. James Reynolds way back in seventeen ninety-one"], "lines_kr": ["1791년으로 거슬러 올라가, 제임스 레이놀즈라는 사내에게 말이야"]}, {"key": "35:8", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Is that what you have? Are you done?"], "lines_kr": ["그게 당신들이 가진 전부입니까? 말씀 다 끝나셨습니까?"]}, {"key": "35:9", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["You are uniquely situated by virtue of your position—"], "lines_kr": ["자네는 그 직위의 권능을 이용하기에 유일무이한 위치에 있었지—"]}, {"key": "35:10", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Though ‘virtue’ is not a word I’d apply to this situation—"], "lines_kr": ["비록 '미덕(권능)'이란 단어를 이런 추악한 상황에 쓰고 싶진 않지만—"]}, {"key": "35:11", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["To seek financial gain, to stray from your sacred mission—"], "lines_kr": ["사적 이익을 편취하고, 성스러운 사명에서 벗어나려 한 사태에 말일세—"]}, {"key": "35:12", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["And the evidence suggests you’ve engaged in speculation—"], "lines_kr": ["그리고 증거는 자네가 불법 투기에 가담했음을 가리키고 있네—"]}, {"key": "35:13", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["An immigrant embezzling our government funds—"], "lines_kr": ["이민자 출신이 우리 정부 공금을 횡령하다니—"]}, {"key": "35:14", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Thomas Jefferson, James Madison", "lines_en": ["I can almost see the headline, your career is done"], "lines_kr": ["신문 1면 헤드라인이 눈에 선하군, 자네 경력은 이제 끝장이야"]}, {"key": "35:15", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I hope you saved some money for your daughter and sons"], "lines_kr": ["딸과 아들들을 위해 돈 좀 남겨뒀길 바라네"]}, {"key": "35:16", "speaker_kr": "아론 버, 토머스 제퍼슨, 제임스 매디슨", "speaker_en": "Aaron Burr, Thomas Jefferson, James Madison", "lines_en": ["Ya best g'wan run back where ya come from!"], "lines_kr": ["네가 기어 나온 고향으로 썩 꺼지는 게 좋을 거다!"]}, {"key": "35:17", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Ha! You don’t even know what you’re asking me to confess"], "lines_kr": ["하! 당신들은 내게 뭘 자백하라는 건지도 전혀 모르고 있군요"]}, {"key": "35:18", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Confess"], "lines_kr": ["자백해"]}, {"key": "35:19-20", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You have nothing. I don’t have to tell you anything at all", "Unless"], "lines_kr": ["당신들은 쥐뿔도 쥔 게 없어. 내가 당신들에게 털어놓을 이유는 전혀 없지", "단 한 가지만 아니라면"]}, {"key": "35:21", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Unless"], "lines_kr": ["그 한 가지가 뭐지"]}, {"key": "35:22-23", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["If I can prove that I never broke the law", "Do you promise not to tell another soul what you saw?"], "lines_kr": ["내가 법을 어기지 않았음을 증명해 보인다면", "여기서 본 것을 그 누구에게도 발설하지 않겠다고 맹세하겠습니까?"]}, {"key": "35:24", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["No one else was in the room where it happened"], "lines_kr": ["그 방엔 우리 외엔 아무도 없었잖아"]}, {"key": "35:25", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Is that a yes?"], "lines_kr": ["약속하는 겁니까?"]}, {"key": "35:26", "speaker_kr": "토머스 제퍼슨, 제임스 매디슨, 아론 버", "speaker_en": "Thomas Jefferson, James Madison, Aaron Burr", "lines_en": ["Um, yes"], "lines_kr": ["음, 그래"]}, {"key": "35:27-30", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["“Dear Sir, I hope this letter finds you in good health", "And in a prosperous enough position to put wealth", "In the pockets of people like me: down on their luck", "You see, it was my wife who you decided to—”"], "lines_kr": ["“친애하는 각하, 모쪼록 건강하시기를 바라며", "충분히 여유로운 형편이시길 희망합니다", "저처럼 불운에 빠진 사람들의 주머니에 돈을 채워주실 수 있을 만큼 말입니다", "아시다시피, 각하께서 취하기로 작정하셨던 여인은 바로 제 아내였으니—”"]}, {"key": "35:31", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Whaaaat—"], "lines_kr": ["뭐어어어라고—"]}, {"key": "35:32-45", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["She courted me", "Escorted me to bed and when she had me in a corner", "That’s when Reynolds extorted me", "For a sordid fee", "I paid him quarterly", "I may have mortally wounded my prospects but my papers are orderly!", "As you can see I kept a record of every check in my checkered history", "Check it again against your list n’ see consistency", "I never spent a cent that wasn’t mine", "You sent the dogs after my scent, that’s fine", "Yes, I have reasons for shame", "But I have not committed treason and sullied my good name", "As you can see I have done nothing to provoke legal action", "Are my answers to your satisfaction?"], "lines_kr": ["그
