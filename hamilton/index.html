 유일한 무기는 '글쓰기'였습니다. 해밀턴은 치명적인 오만(Hubris)에 사로잡혀, 이번 위기 역시 모든 치부를 솔직하게 글로 써서 대중에게 공개하면 자신의 정치적 유산을 지킬 수 있을 것이라는 망상적 결론에 도달하며 '레이놀즈 팸플릿'을 집필하기 시작합니다.", "notes": ["카리브해 허리케인의 역사적 사실과 트라우마: 1772년 8월 말 서인도제도 세인트크로이섬을 강타한 강력한 허리케인은 해밀턴의 유년기 최대의 재앙이었습니다. 당시 해밀턴이 아버지에게 보낸 편지에서 허리케인의 참상을 웅장하고 감동적인 산문으로 묘사한 글이 <로열 데니시 아메리칸 가제트> 신문에 게재되었고, 이에 감명받은 지역 상인들이 장학금을 모아 그를 뉴욕으로 유학 보냈습니다. 해밀턴에게 글쓰기는 생존이자 구원 그 자체였습니다.", "'I wrote my way out' - 펜으로 운명을 개척한 자의 신화: 해밀턴의 생애는 언어와 문장으로 계급과 국경, 운명의 족쇄를 부순 드라마였습니다. 빈민가 탈출, 혁명 팸플릿 집필, 일라이자와의 사랑을 얻은 연애편지, <연방주의자 보고서(The Federalist Papers)>를 통한 헌법 수호, 미국의 초대 금융 시스템 창설까지 그는 늘 글쓰기로 기적을 만들었습니다. '신을 향한 기도가 무관심에 부딪혔을 때 난 펜을 들어 스스로를 구원했다'는 가사는 그의 독보적인 천재성과 지독한 자수성가 콤플렉스를 압축합니다.", "비극적 오만(Tragic Hubris)과 파멸적 확신: 허리케인의 눈(eye of a hurricane)이라는 상징적 공간에서 해밀턴은 인생 최악의 치명적 판단 착오(Hamartia)를 범합니다. 'Overwhelm them with honesty'(정직함으로 저들을 압도하겠다)라며, 공금 횡령 혐의를 벗기 위해 자신의 모든 불륜 행적과 사적인 치부를 스스로 백일하에 까발리기로 결심한 것입니다. 글쓰기로 모든 것을 이룬 영웅이 결국 글쓰기로 자멸의 길을 선택하는 비극의 절정입니다.", "'Wait for It'의 유령 같은 환청과 대비: 해밀턴의 격정적인 독백 사이로 앙상블과 아론 버의 대표 멜로디인 'Wait for it'(기다려, 침묵해)이 끊임없이 메아리칩니다. 인내하고 기다릴 줄 아는 버와 달리, 한순간의 침묵도 견디지 못하고 행동(글쓰기)으로 폭주해야만 직성이 풀리는 해밀턴의 성정이 대비되며 파국의 필연성을 부각합니다."], "stanzas": [{"key": "36:1-34", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["In the eye of a hurricane", "There is quiet", "For just a moment", "A yellow sky", "When I was seventeen a hurricane", "Destroyed my town", "I didn’t drown", "I couldn’t seem to die", "I wrote my way out", "Wrote everything down far as I could see", "I wrote my way out", "I looked up and the town had its eyes on me", "They passed a plate around", "Total strangers", "Moved to kindness by my story", "Raised enough for me to book passage on a", "Ship that was New York bound…", "I wrote my way out of hell", "I wrote my way to revolution", "I was louder than the crack in the bell", "I wrote Eliza love letters until she fell", "I wrote about The Constitution and defended it well", "And in the face of ignorance and peaker_en": "Company", "lines_en": ["Wait for it, wait for it, wait for it, wait…"], "lines_kr": ["기다려, 기다려, 기다려, 기다려…"]}, {"key": "36:45", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["The Reynolds Pamphlet"], "lines_kr": ["레이놀즈 팸플릿"]}]}, {"id": 37, "act": 2, "title": "The Reynolds Pamphlet", "title_kr": "레이놀즈 팸플릿", "characters_kr": ["아론 버", "앙상블 전체", "안젤리카 스카일러", "토머스 제퍼슨", "알렉산더 해밀턴", "남성 앙상블", "제임스 매디슨"], "characters_en": ["Aaron Burr", "Company", "Angelica Schuyler", "Thomas Jefferson", "Alexander Hamilton", "Men", "James Madison"], "synopsis": "해밀턴이 자신의 공금 횡령 혐의를 벗기 위해 마리아 레이놀즈와의 불륜과 남편 제임스 레이놀즈에게 지불한 입막음 돈의 전말을 적나라하게 담은 95쪽짜리 '레이놀즈 팸플릿'을 자비로 출판하자, 온 나라가 발칵 뒤집히는 광경을 풍자적이고 역동적인 군무로 그려낸 넘버입니다. 정적이었던 제퍼슨, 매디슨, 버는 해밀턴이 스스로 정치적 사형 선고를 내렸다며 환호하고, '이제 대통령 되긴 글렀다(Never gon' be President now)'며 환희에 찬 합창을 부릅니다. 이 소식을 들은 처형 안젤리카 스카일러가 대서양을 건너 런던에서 급히 뉴욕으로 달려옵니다. 해밀턴은 안젤리카가 자신을 변호하고 지지해 줄 것이라 기대하지만, 안젤리카는 해밀턴의 뺨을 치듯 단호하게 '난 널 구하러 온 것이 아니라 내 동생 일라이자의 곁에 서러 왔다'고 선언하며 그의 끝없는 야망과 이기심을 준엄하게 꾸짖습니다.", "notes": ["역사상 최초의 공직자 섹스 스캔들 자백서(1797년): 해밀턴이 실제로 발표한 공식 명칭 <일부 문서들에 관한 관찰(Observations on Certain Documents...)>, 일명 '레이놀즈 팸플릿'은 95쪽에 달하는 방대한 분량이었습니다. 그는 재정적 청렴성을 입증하는 데 성공했으나, 부인과 아이들이 친정에 가 있는 동안 자신의 집 침실에서 불륜을 저지르고 협박범에게 돈을 상납한 부끄러운 사생활을 낱낱이 공개함으로써 정치인으로서의 도덕성에 회복 불가능한 치명상을 입었습니다.", "정적들의 통쾌한 조롱과 카니발: 무대 위에서 종이 팸플릿을 공중에 뿌리며 춤추는 앙상블과 제퍼슨, 매디슨, 버의 모습은 정치판의 잔인함과 쾌감을 극대화합니다. 특히 'At least he was honest with our money!'(그래도 우리 세금엔 정직했잖아!)라는 제퍼슨의 대사는 해밀턴의 결백 입증이 얼마나 공허하고 부조리한 승리인지를 신랄하게 비꼽니다.", "안젤리카의 귀환과 단호한 결별: 해밀턴은 지적 동반자이자 자신을 깊이 이해해 주던 안젤리카가 런던에서 오자 구원을 바랐으나, 안젤리카는 철저히 일라이자의 언니로서 선을 긋습니다. 'I know my sister like I know my own mind', 'I will choose her happiness over mine every time'이라 선언하며 과거 해밀턴과 나누었던 미묘한 감정을 완전히 끊어내고 피해자인 동생을 보호하는 주체적인 여성 연대를 보여줍니다.", "'Satisfied'의 서사적 완결과 파멸: 1막 11번 곡 'Satisfied'에서 해밀턴과 안젤리카가 공유했던 채워지지 않는 갈망('I will never be satisfied')은, 이 곡에서 안젤리카의 분노에 찬 일갈('You could never be satisfied / God, I hope you’re satisfied')로 귀결됩니다. 끝 'I'm erasing myself from the narrative' - 역사 테마의 전복: 뮤지컬 <해밀턴>을 관통하는 중심 화두는 '누가 살고, 누가 죽고, 누가 당신의 이야기를 전하는가(Who Lives, Who Dies, Who Tells Your Story)'입니다. 해밀턴이 역사적 평가와 명성에 집착해 팸플릿을 썼다면, 일라이자는 '난 이 서사에서 내 자신을 지워버릴 거야'라며 역사의 기록 자체를 거부함으로써 남편의 통제를 벗어납니다. 이는 침묵이야말로 가장 강력한 발언이 될 수 있음을 보여줍니다.", "이카로스 신화와 언어의 배신: 일라이자는 언니 안젤리카가 경고했던 말('너는 태양에 너무 가까이 날아간 이카로스와 결혼한 거야')을 떠올립니다. 1막 'Helpless'에서 자신에게 궁전과 대성당을 지어주었던 해밀턴의 아름다운 문장들이 이제는 망상과 궤변('border on senseless', 'paranoid in every paragraph')으로 전락했음을 한탄하며, 남편의 천재성이 결국 자신들을 파멸시켰음을 고발합니다.", "'Burn'의 다층적 상징성: 'Burn'은 단순히 종이 편지를 불태우는 물리적 행위(burning letters)를 넘어, 1막에서 사랑으로 뜨겁게 타올랐던 세상의 종말, 가슴속에서 솟구치는 배신감과 분노의 불길, 그리고 남편의 부질없는 명예와 세상 역시 불타버리기를 바라는 저주('I hope that you burn')까지 다층적인 감정의 스펙트럼을 담고 있습니다."], "stanzas": [{"key": "38:1-54", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I saved every letter you wrote me", "From the moment I read them", "I knew you were mine", "You said you were mine", "I thought you were mine", "Do you know what Angelica said", "When we saw your first letter arrive?", "She said", "“Be careful with that one, love", "He will do what it takes to survive.”", "You and your words flooded my senses", "Your sentences left me defenseless", "You built me palaces out of paragraphs", "You built cathedrals", "I’m re-reading the letters you wrote me", "I’m searching and scanning for answers", "In every line", "For some kind of sign", "And when you were mine", "The world seemed to", "Burn", "Burn", "You published the letters she wrote you", "You told the whole world how you brought", "This girl into our bed", "In clearing your name, you have ruined our lives", "Do you know what Angelica said", "When she read what you’d done?", "She said", "“You have married an Icarus", "He has flown too close to the sun.”", "You and your words, obsessed with your legacy...", "Your sentences border on senseless", "And you are paranoid in every paragraph", "How they perceive you", "You, you, you…", "I’m erasing m , "George Eacker", "Men", "Philip Hamilton"], "synopsis": "19세가 된 필립 해밀턴의 당당한 성인식과 아버지의 명예를 지키기 위해 벌이는 비극적 결투의 서막을 그린다. 킹스 칼리지를 갓 졸업한 필립은 젊은 시절 알렉산더의 총명함과 저돌성을 쏙 빼닮아 숙녀들의 마음을 사로잡으며 자신만만하게 세상에 나선다. 그러나 조지 이거(George Eacker)가 독립기념일 연설에서 아버지 알렉산더를 파렴치한으로 매도했다는 소식을 듣고, 필립은 가문의 명예를 수호하고자 파크 극장으로 그를 찾아가 결투를 신청한다. 아들의 결투 소식에 경악한 알렉산더는 당시 신사들의 결투 관습인 허공에 사격(delope)할 것을 조언하며 아들이 피를 흘리지 않고 명예를 지키도록 이끈다. 그러나 뉴저지 위호켄의 결투장에서 카운트다운 도중 이거가 성급하게 방아쇠를 당기며 필립은 치명상을 입고 만다.", "notes": ["**'My Shot'의 부자간 변주와 오만의 대물림**: 필립이 부르는 'I’m only nineteen but my mind is older / Gotta be my own man, like my father, but bolder'는 1막의 'My Shot'에서 젊은 알렉산더가 불렀던 가사를 그대로 변주한 대목입니다. 아버지의 지성과 야망뿐 아니라 충동적이고 타협을 모르는 기질까지 물려받은 필립의 모습은, 해밀턴 가문의 찬란한 미래인 동시에 닥쳐올 파멸의 비극적 복선으로 작용합니다.", "**알렉산더의 결투 조언(Delope)과 부성애의 딜레마**: 당시 명예 규범상 결투를 회피하는 것은 사회적 매장을 의미했기에, 해밀턴은 결투 자체를 말리지 못하고 대신 하늘로 총을 쏘아(delope) 명예를 지키라는 지침을 줍니다. '상대도 신사라면 총을 쏘지 않을 것'이라는 아버지의 순진한 믿음은 아들을 구하려던 의도와 달리 무방비 상태의 아들을 죽음으로 내모는 치명적인 비극의 씨앗이 됩니다.", "**위호켄(Weehawken) 결투장과 'Ten Duel Commandments'의 붕괴**: 결투가 치러지는 뉴저지 위호켄은 훗날 알렉산더 해밀턴 본인이 아론 버와의 결투에서 최후를 맞이하는 비극의 장소입니다. 또한 1막에서 경쾌하게 규칙을 읊었던 'Ten Duel Commandments'의 비트가 울려 퍼지는 가운데, 조지 이거가 카운트 7에서 긴장을 이기지 못하고 총을 먼저 발사함으로써 규칙이 신사를 보호해주지 못한다는 잔혹한 현실을 보여줍니다.", "**재즈/힙합의 스웨거와 긴박한 서스펜스의 교차**: 넘버 전반부는 경쾌한 브로드웨이 재즈와 힙합 비트로 필립의 발랄한 매력과 청춘의 치기(ladies와의 유쾌한 대화)를 매혹적으로 그려냅니다. 그러나 후반부 결투 장면으로 전환되면서 음악은 극도의 미니멀리즘과 숨 막히는 정적으로 침잠하며 관객에게 날카로운 긴장감을 선사합니다."], "stanzas": [{"key": "39:1-10", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Meet the latest graduate of King’s College!", "I prob’ly shouldn’t brag, but, dag, I amaze and astonish!", "The scholars say I got the same virtuosity and brains as my pops!", "The ladies say my brain’s not where the resemblance stops!", "I’m only nineteen but my mind is older", "Gotta be my own man, like my father, but bolder", "I shoulder his legacy with pride", "I used to hear him say", "That someday", "I would—"], "lines_kr": ["킹스 칼리지의 최신 졸업생을 만나보시라!", "자랑하면 안 되겠지만, 젠장, nder Hamilton", "lines_en": ["No. He’ll follow suit if he’s truly a man of honor", "To take someone’s life, that is something you can’t shake", "Philip, your mother can’t take another heartbreak"], "lines_kr": ["아니다. 그자가 진정한 명예를 아는 사내라면 똑같이 따를 게야", "다른 이의 목숨을 앗아가는 건 평생 떨쳐낼 수 없는 짐이란다", "필립, 네 어머니는 또 다른 가슴 찢어지는 고통을 견뎌낼 수 없어"]}, {"key": "39:58", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Father—"], "lines_kr": ["아버지—"]}, {"key": "39:59-60", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Promise me. You don’t want this", "Young man’s blood on your conscience"], "lines_kr": ["약속해다오. 네 양심에 그 젊은이의", "피를 묻히고 싶진 않을 게다"]}, {"key": "39:61", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Okay, I promise"], "lines_kr": ["알겠어요, 약속할게요"]}, {"key": "39:62-63", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Come back home when you’re done", "Take my guns. Be smart. Make me proud, son"], "lines_kr": ["일이 끝나면 곧장 집으로 돌아오거라", "내 총을 가져가라. 현명하게 굴어. 날 자랑스럽게 해다오, 아들아"]}, {"key": "39:64-68", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["My name is Philip", "I am a poet", "I’m a little nervous, but I can’t show it", "I’m sorry, I’m a Hamilton with pride", "You talk about my father, I cannot let it slide"], "lines_kr": ["내 이름은 필립", "나는 시인", "조금 긴장되지만, 티 낼 순 없지", "미안하지만, 난 긍지 높은 해밀턴 가문의 사람", "우리 아버지를 모욕한다면, 결코 그냥 넘어갈 수 없어"]}, {"key": "39:69", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Mister Eacker! How was the rest of your show?"], "lines_kr": ["이거 씨! 연극 뒷부분은 볼만했소?"]}, {"key": "39:70-72", "speaker_kr": "조지 이거", "speaker_en": "George Eacker", "lines_en": ["I’d rather skip the pleasantries", "Let’s go", "Grab your pistol"], "lines_kr": ["쓸데없는 수작은 건너뛰지", "시작하자", "권총을 잡아라"]}, {"key": "39:73-74", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Confer with your men", "The duel will commence after we count to ten"], "lines_kr": ["당신 대리인들과 상의하시오", "열을 세고 나면 결투가 시작될 테니"]}, {"key": "39:75", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Count to ten!"], "lines_kr": ["열을 세어라!"]}, {"key": "39:76-78", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Look ‘em in the eye, aim no higher", "Summon all the courage you require", "Then slowly and clearly aim your gun towards the sky—"], "lines_kr": ["상대의 눈을 응시하고, 총구를 올리지 마", "필요한 모든 용기를 끌어모아", "그리고 천천히 또렷하게 총구를 하늘로 겨누는 거야—"]}, {"key": "39:79", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["One two three four"], "lines_kr": ["하나 둘 셋 넷"]}, {"key": "39:80", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Five six seven—"], "lines_kr": ["다섯 여섯 일곱—"]}]}, {"id": 40, "act": 2, "title": "Stay Alive (Reprise)", "title_kr": "살아남아라 (리프라이즈)", "characters_kr": ["여성 앙상블", "일라이자 스카일러", "알렉산더 해밀턴", "남성 앙상블", "필립 해밀턴"], "characters_en": ["Women", "Eliza Schuyler", "Alexander Hamilton", "Men", "Philip Hamilton"], "synopsis": "결투에서 치명상을 입은 필립의 임종과, 자식을 잃은 해밀턴 부부의 형언할 수 없는 슬픔을 그린 넘버. 총탄이 골반을 관통하여 회복이 불가능한 상태에서 알렉산더는 필립의 병상으로 달려온다. 필립은 아버지의 가르침대로 하늘을 쏘았다며 아버지를 자랑스럽게 해드리고 싶었다고 속삭인다. 뒤늦게 달려온 일라이자는 아들의 상태를 보고 오열하며, 어린 시절 함께 피아노를 치며 불렀던 프랑스어 숫자 동요('Un, deux, trois...')를 부르며 아들의 의식을 붙잡으려 애쓴다. 하지만 필립은 일곱과 여덟을 넘기지 못하고 숨을 거두며, 일라이자의 가슴을 찢는 비명이 침묵을 가른다.", "notes": ["**1막 'Stay Alive'와의 비극적 조응**: 1막에서 전장의 알렉산더를 향해 일라이자가 애타게 노래했던 'Stay alive... that would be enough'라는 기도가, 2막에서는 빈사 상태에 빠진 외아들 필립의 병상에서 처절한 절규로 되살아납니다. 생존과 야망을 위해 앞만 보고 질주하던 해밀턴에게, 아들의 목숨은 세상 그 무엇과도 바꿀 수 없는 가장 가혹한 대가로 되돌아옵니다.", "**'I aimed my gun at the sky' — 아버지의 이상과 아들의 희생**: 필립이 숨을 헐떡이며 아버지에게 건네는 '아버지 말씀대로 똑같이 고개를 들고 하늘로 총을 겨누었다'는 고백은 해밀턴의 가슴에 씻을 수 없는 죄책감의 비수를 꽂습니다. 자신의 명예욕과 잘못된 조언 때문에 자식이 희생되었다는 참담함은 해밀턴의 영혼을 송두리째 파괴하며, 이후 그가 모든 정치적 야망을 접고 칩거하게 되는 결정적 계기가 됩니다.", "**프랑스어 피아노 카운팅(1부터 9까지)의 눈물겨운 상징성**: 필립의 9세 생일('Take a Break')에서 엄마 일라이자와 함께 피아노를 치며 불렀던 프랑스어 숫자 동요('Un, deux, trois, quatre...')가 임종의 순간 다시 흐릅니다. 일라이자는 아들의 호흡을 붙잡으려 필사적으로 숫자를 세지만, 필립은 'sept(일곱)'에서 멈추며 숨을 거둡니다. 가장 순수했던 유년의 기억과 죽음의 순간이 겹쳐지며 뮤지컬 전체에서 가장 가슴 저미는 순간을 만들어냅니다.", "**무반주 정적과 일라이자의 원초적 비명(The Scream)**: 필립이 숨을 거두는 순간 오케스트라 반주가 완전히 멎고, 무대 위에는 일라이자의 찢어지는 듯한 오열과 날카로운 비명만이 가득 찹니다. 린-마누엘 미란다는 언어와 음악의 한계를 넘어서는 참척(慘慽)의 고통을 생생한 침묵과 원초적 비명으로 표현하여 관객의 심장을 내려앉게 만듭니다."], "stanzas": [{"key": "40:1-3", "speaker_kr": "여성 앙상블", "speaker_en": "Women", "lines_en": ["Stay alive…", "Stay alive…", "Stay alive..."], "lines_kr": ["살아남아라…", "살아남아라…", "살아남아라..."]}, {"key": "40:4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Where’s my son?"], "lines_kr": ["내 아들은 어디 있소?"]}, {"key": "40:5", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["Mr. Hamilton, come in. They brought him in a half an hour ago. He lost a lot of blood on the way over."], "lines_kr": ["해밀턴 씨, 들어오십시오. 30분 전에 데려왔습니다. 오는 길에 피를 너무 많이 흘렸습니다."]}, {"key": "40:6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Is he alive?"], "lines_kr": ["살아는 있소?"]}, {"key": "40:7-8", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["Yes. But you have to understand", "The bullet entered just above his hip and lodged in his right arm"], "lines_kr": ["예. 하지만 알아두셔야 합니다", "총알이 골반 바로 위로 들어가 오른팔에 박혔습니다"]}, {"key": "40:9", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Can I see him please?"], "lines_kr": ["아이를 봐도 되겠소, 제발?"]}, {"key": "40:10", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["I’m doing ev’rything I can, but the wound was already infected when he arrived—"], "lines_kr": ["최선을 다하고 있지만, 도착했을 때 이미 상처가 감염된 상태였습니다—"]}, {"key": "40:11", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Philip"], "lines_kr": ["필립"]}, {"key": "40:12-14", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Pa", "I did exactly as you said, Pa", "I held my head up high"], "lines_kr": ["아버지", "아버지 말씀대로 똑같이 했어요, 아버지", "고개를 당당하게 높이 들었고요"]}, {"key": "40:15-24", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I know, I know. Shh", "I know, I know", "Shh. I know you did", "Ev’rything just right", "Shh", "I know, I know", "I know, I know", "I know", "Save your strength and", "Stay alive…"], "lines_kr": ["안다, 알아. 쉿", "안다, 다 알아", "쉿. 네가 모든 걸", "완벽하게 해냈다는 걸 안다", "쉿", "알아, 다 알아", "안다, 다 알아", "알아", "기운을 아끼거라, 그리고", "살아남아라…"]}, {"key": "40:25", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["No!"], "lines_kr": ["안 돼!"]}, {"key": "40:26", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Eliza"], "lines_kr": ["일라이자"]}, {"key": "40:27-28", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Is he breathing? Is he going to survive this?", "Who did this, Alexander, did you know?"], "lines_kr": ["숨은 쉬고 있나요? 아이가 버텨낼 수 있나요?", "누가 이랬어요, 알렉산더, 당신 알고 있었나요?"]}, {"key": "40:29", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Mom, I’m so sorry for forgetting what you taught me"], "lines_kr": ["엄마, 엄마가 가르쳐주신 걸 잊어서 정말 죄송해요"]}, {"key": "40:30", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["My son—"], "lines_kr": ["내 아들아—"]}, {"key": "40:31", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["We played piano"], "lines_kr": ["우리 피아노 쳤잖아요"]}, {"key": "40:32", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I taught you piano"], "lines_kr": ["내가 피아노를 가르쳐주었지"]}, {"key": "40:33", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["You would put your hands on mine"], "lines_kr": ["엄마가 제 손 위에 손을 얹어주셨죠"]}, {"key": "40:34", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["You changed the melody every time"], "lines_kr": ["넌 언제나 멜로디를 바꾸곤 했지"]}, {"key": "40:35", "speaker_kr": "필립 해밀턴", "speaker_en": "Philip Hamilton", "lines_en": ["Ha. I would always change the line"], "lines_kr": ["하. 난 늘 노랫말을 바꾸곤 했죠"]}, {"key": "40:36", "speaker_kr": "일라이자 제는 해밀턴이 눈물로 되부릅니다. 레이놀즈 스캔들과 아들의 죽음이라는 헤어날 수 없는 파국 속에서도 일라이자가 해밀턴의 손을 잡아주는 순간('Forgiveness. Can you imagine?'), 파멸을 넘어선 인간적 구원의 숭고함이 완성됩니다.", "**안젤리카의 해설자적 시선과 공간적 배경(The Grange)**: 안젤리카는 해밀턴 가문의 가장 비극적인 순간을 지켜보는 관찰자이자 안내자로 등장합니다. 도심(다운타운)의 세속적 정치와 소음에서 벗어나 고요한 자연(업타운, 그레인지 저택)으로 피신한 두 사람의 동선은, 세속적 영광을 잃었으나 잃어버렸던 영혼의 결속을 되찾는 공간적 은유를 지닙니다."], "stanzas": [{"key": "41:1-6", "speaker_kr": "안젤리카 스카일러", "speaker_en": "Angelica Schuyler", "lines_en": ["There are moments that the words don’t reach", "There is suffering too terrible to name", "You hold your child as tight as you can", "And push away the unimaginable", "The moments when you’re in so deep", "It feels easier to just swim down"], "lines_kr": ["어떤 순간은 말로 다 전할 수가 없고", "이름 붙이기조차 너무나 끔찍한 고통이 있네", "아이를 품에 힘껏 끌어안고서", "상상조차 할 수 없는 비극을 밀어내 보지만", "깊디깊은 절망 속에 너무 깊이 잠겨", "차라리 그대로 가라앉는 편이 더 쉬워 보일 때"]}, {"key": "41:7-8", "speaker_kr": "안젤리카 스카일러, 앙상블 전체", "speaker_en": "Angelica Schuyler, Company", "lines_en": ["The Hamiltons move uptown", "And learn to live with the unimaginable"], "lines_kr": ["해밀턴 부부는 업타운으로 거처를 옮겨", "상상조차 할 수 없는 슬픔을 견디며 살아가는 법을 배우네"]}, {"key": "41:9-16", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I spend hours in the garden", "I walk alone to the store", "And it’s quiet uptown", "I never liked the quiet before", "I take the children to church on Sunday", "A sign of the cross at the door", "And I pray", "That never used to happen before"], "lines_kr": ["정원에서 몇 시간이고 머물고", "가게까지 홀로 걸어가네", "이곳 업타운은 참 고요하지", "예전엔 이 고요함을 결코 좋아하지 않았는데", "일요일이면 아이들을 데리고 교회에 가서", "문 앞에서 십자가 성호를 긋고", "기도를 올리네", "예전엔 결코 그러지 않았는데"]}, {"key": "41:17-18", "speaker_kr": "안젤리카 스카일러, 여성 앙상블", "speaker_en": "Angelica Schuyler, Women", "lines_en": ["If you see him in the street, walking by himself, talking to himself", "Have pity"], "lines_kr": ["길거리에서 그가 홀로 걸으며, 혼잣말하는 모습을 본다면", "가엾게 여겨주기를"]}, {"key": "41:19-20", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Philip, you would li 고 있으니"]}]}, {"id": 42, "act": 2, "title": "The Election of 1800", "title_kr": "1800년 미국 대통령 선거", "characters_kr": ["여성 앙상블", "아론 버", "앙상블 전체", "토머스 제퍼슨", "알렉산더 해밀턴", "남성 앙상블", "제임스 매디슨"], "characters_en": ["Women", "Aaron Burr", "Company", "Thomas Jefferson", "Alexander Hamilton", "Men", "James Madison"], "synopsis": "1800년 미국 대통령 선거의 극적인 교착 상태와, 알렉산더 해밀턴의 충격적인 선택이 낳은 정치적 파국을 그린 경쾌하고도 긴박한 넘버. 현직 대통령 존 애덤스가 낙마한 후, 선거인단 투표에서 토머스 제퍼슨과 아론 버가 동수를 기록하는 초유의 사태가 발생한다. 버는 온갖 지역을 누비며 적극적으로 유권자들의 환심을 사려 하고, 제퍼슨과 매디슨은 위기감을 느낀다. 하원에서 35차례의 투표에도 결론이 나지 않자, 사람들은 정계에서 은퇴했던 연방주의자들의 영수 해밀턴에게 누구를 지지할 것인지 묻는다. 오랜 숙적 제퍼슨과 친구이자 기회주의자인 버 사이에서 고뇌하던 해밀턴은 '제퍼슨에게는 최소한 신념이 있지만, 버에게는 아무런 신념도 없다'며 공개적으로 제퍼슨을 지지한다. 이 결정으로 제퍼슨이 제3대 대통령에 당선되고, 버는 해밀턴을 향한 걷잡을 수 없는 분노와 복수심에 휩싸인다.", "notes": ["**미국 헌정사의 일대 위기: 1800년 선거와 선거인단 동수 사태**: 당시 헌법 시스템의 허점으로 인해 같은 공화당 티켓으로 출마한 제퍼슨과 버가 선거인단 73표 동수를 얻어 하원으로 결정권이 넘어갔습니다. 하원의 연방주의자들은 숙적인 제퍼슨을 떨어뜨리기 위해 신념이 불분명한 버를 지지하려 했으나, 해밀턴이 개입하여 정국을 뒤흔듭니다.", "**'Jefferson has beliefs, Burr has none' — 해밀턴의 선택 기준**: 해밀턴과 제퍼슨은 건국 이념, 재정 정책, 외교 노선 등 모든 면에서 정반대에 서 있던 평생의 정적이었습니다. 그러나 해밀턴은 '제퍼슨과는 75가지 사안 중 74가지에서 의견이 다르지만 적어도 그는 자신의 신념을 위해 싸우는 사람인 반면, 버는 권력만을 좇아 어디로 튈지 모르는 위험한 인물'이라고 판단합니다. 이 도덕적·철학적 평가는 버의 자존심에 치명적인 비수를 꽂습니다.", "**버의 변신과 'Talk less, smile more'의 결실 없는 역설**: 버는 그동안 지켜왔던 '기다림(Wait for it)'의 자세를 버리고, 문을 두드리고 사람들을 안아주며 정력적으로 선거 운동에 나섭니다. 대중의 인기를 얻어 대통령 문턱까지 도달했으나, 끝내 자신의 원칙과 지향점을 제시하지 못한 채 '신념의 부재'라는 비판에 직면하여 몰락하는 아이러니를 보여줍니다.", "**제퍼슨의 조롱과 결투로 이어지는 도화선**: 대통령에 당선된 제퍼슨은 부통령이 된 버에게 '부통령의 권한을 축소하는 개헌을 추진하겠다'며 냉소적인 인사를 건넵니다. 자신의 정치적 생명이 완전히 매장당했다고 느낀 버는 모든 비극의 원흉으로 해밀턴을 지목하며, 다음 곡 'Your Obedient Servant'의 파멸적인 결투 편지로 직행하게 됩니다."], "stanzas": [{"key": "42:1", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["The election of 1800"], "lines_kr": ["1800년 대선"]}, {"key": "42:2", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["Can we get back to politics?"], "lines_kr": ["우리 이제 정치 이야기로 돌아가도 될까?"]}, {"key": "42:3", "speaker_kr": "제임스 매디슨", "s know what? We can change that. You know why?"], "lines_kr": ["그래, 그거 알아? 그 법은 뜯어고치면 돼. 왜인 줄 알아?"]}, {"key": "42:117", "speaker_kr": "제임스 매디슨", "speaker_en": "James Madison", "lines_en": ["Why?"], "lines_kr": ["왜죠?"]}, {"key": "42:118", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["‘cuz I’m the President. Hey, Burr, when you see Hamilton, thank him for the endorsement"], "lines_kr": ["왜냐하면 내가 대통령이니까. 이봐, 버, 해밀턴 보거든 그 지지 선언에 고맙다고 전해줘"]}]}, {"id": 43, "act": 2, "title": "Your Obedient Servant", "title_kr": "당신의 충직한 종복", "characters_kr": ["알렉산더 해밀턴", "앙상블 전체", "아론 버"], "characters_en": ["Alexander Hamilton", "Company", "Aaron Burr"], "synopsis": "아론 버와 알렉산더 해밀턴이 18세기 특유의 정중하고 격식 있는 서간문 양식을 빌려 주고받는 날카로운 신경전과 최후의 결투 신청. 1800년 대선 패배와 뉴욕 주지사 선거 낙선 등으로 정치적 나락에 떨어진 버는, 지난 30년간 자신의 앞길을 사사건건 가로막고 비방을 일삼아 온 해밀턴에게 분노에 찬 편지를 보낸다. 해밀턴은 특유의 지적 오만함과 현학적인 문장으로 자신은 진실만을 말했을 뿐이라며 사과를 거부한다. 극도의 예의를 갖춘 서명('당신의 충직한 종복 / Your Obedient Servant') 뒤에 숨겨진 차가운 증오와 살의는 탱고와 왈츠 풍의 리듬 속에서 점차 고조되고, 결국 두 사람은 뉴저지 위호켄에서 권총으로 시비를 가리기로 합의한다.", "notes": ["**18세기 서간문 예법(Epistolary Etiquette)의 아이러니**: 당시 신사들의 서한 말미 관용구인 'I have the honor to be Your Obedient Servant(당신의 영광스러운 충직한 종복으로서 예를 다하오)'가 살기 어린 비난과 결투 신청의 후렴구로 반복됩니다. 가장 정중한 예법의 껍데기 속에 가장 치명적인 증오와 독설을 담아내는 언어적 블랙코미디이자 긴장감 넘치는 연출입니다.", "**30년에 걸친 두 남자의 애증과 궤적의 충돌**: 넘버 2 'Aaron Burr, Sir'에서 처음 만난 이후, 해밀턴과 버는 서로 다른 길을 걸으며 평생 동안 얽혀왔습니다. 기회를 포착해 불꽃처럼 타오르는 해밀턴과, 기회를 기다리며 신중하게 몸을 사리던 버의 인생관은 이 편지 교환을 통해 더 이상 공존할 수 없는 극한의 대립점에 도달합니다.", "**'The Room Where It Happens' 멜로디의 변주와 춤추는 결투**: 이 넘버의 베이스라인과 멜로디는 'The Room Where It Happens'의 관악기 리듬을 변주합니다. 권력의 방에서 배제되었던 버의 원한이 이제 해밀턴 개인을 향한 집착과 파괴적 충동으로 전환되며, 두 배우가 무대 위에서 편지를 주고받으며 추는 춤은 마치 서로의 목을 조르는 전조와도 같습니다.", "**알렉산더 해밀턴의 타협 없는 자존심**: 해밀턴은 과거 레이놀즈 팸플릿 때와 마찬가지로, 한 발짝만 물러서거나 사과하면 피할 수 있었던 파국을 자신의 글재주와 굽히지 않는 자존심으로 자초합니다. 자신의 펜으로 스스로 무덤을 파는 해밀턴의 비극적 결함(Hamartia)이 극명하게 드러나는 대목입니다."], "stanzas": [{"key": "43:1-9", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["How does Hamilton", "An arrogant", "Immigrant, orphan", "Bastard, whoreson", "Somehow endorse", "Thomas Jefferson, his enemy", "A man he’s despised since the beginning", "Just to keep me from winning?", "I wanna be in the room where it happens—"], "lines_kr": ["어찌하여 해밀턴은", "오만방자한", "이민자, 고아 녀석이", "사생아에, 갈보 자식이", "어째서 지지한단 말인가", "자신의 숙적인 토머스 제퍼슨을", "애초부터 경멸해 마지않던 그자를", "오직 내가 승리하는 꼴을 막겠다는 이유 하나로?", "나도 결정이 이루어지는 그 방에 있고 싶었거늘—"]}, {"key": "43:10-11", "speaker_kr": "아론 버, 앙상블 전체", "speaker_en": "Aaron Burr, Company", "lines_en": ["The room where it happens", "The room where it happens"], "lines_kr": ["그 일이 벌어지는 그 방", "그 일이 벌어지는 그 방"]}, {"key": "43:12", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["You’ve kept me from—"], "lines_kr": ["네가 날 가로막았어—"]}, {"key": "43:13", "speaker_kr": "아론 버, 앙상블 전체", "speaker_en": "Aaron Burr, Company", "lines_en": ["The room where it happens"], "lines_kr": ["그 일이 벌어지는 그 방에서"]}, {"key": "43:14-29", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["For the last time", "Dear Alexander:", "I am slow to anger", "But I toe the line", "As I reckon with the effects", "Of your life on mine", "I look back on where I failed", "And in every place I checked", "The only common thread has been your disrespect", "Now you call me “amoral,”", "A “dangerous disgrace,”", "If you’ve got something to say", "Name a time and place", "Face to face", "I have the honor to be Your Obedient Servant", "A dot Burr"], "lines_kr": ["마지막으로 경고하노라", "친애하는 알렉산더에게:", "나는 분노를 더디 터뜨리는 사람이지만", "지켜야 할 선은 넘지 않는 법이라네", "자네의 삶이 내 삶에 미친", "악영향들을 곱씹어 볼 때마다", "내가 실패했던 순간들을 되돌아보면", "확인해 본 모든 곳에서 어김없이", "유일한 공통점은 바로 자네의 무례와 모욕뿐이었네", "이제 자네는 날 '부도덕한 자'라 부르고,", "'위험하기 짝이 없는 치욕'이라 칭했지", "만약 자네가 할 말이 있다면", "시간과 장소를 정하게", "얼굴을 마주하고 끝장을 보세", "나는 귀하의 충직한 종복으로서 예를 다하오", "A. 버"]}, {"key": "43:30-37", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Mr. Vice President:", "I am not the reason no one trusts you", "No one knows what you believe", "I will not equivocate on my opinion", "I have always worn it on my sleeve", "Even if I said what you think I said", "You would need to cite a more specific grievance", "Here’s an itemized list of thirty years of disagreements"], "lines_kr": ["부통령 각하께:", "아무도 당신을 신뢰하지 않는 것은 내 탓이 아니오", "당신이 무엇을 믿는지 아는 이가 아무도 없지 않소", "내 소신에 대해 얼버무릴 생각은 추호도 없으며", "난 언제나 내 생각을 솔직하게 드러내 왔소", "가령 당신 생각대로 내가 그런 말을 했다 한들", "보다 구체적인 불만 사항을 짚어내야 마땅할 것이오", "지난 30년간 우리가 뜻을 달리했던 목록을 조목조목 적어 보내오"]}, {"key": "43:38", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Sweet Jesus"], "lines_kr": ["세상에 맙소사"]}, {"key": "43:39-45", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Hey, I have not been shy", "I am just a guy in the public eye", "Tryin’ to do my best for our republic", "I don’t wanna fight", "But I won’t apologize for doing what’s right", "I have the honor to be Your Obedient Servant", "A dot Ham"], "lines_kr": ["이보시오, 난 몸을 사린 적이 없소", "나는 공인의 자리에 선 한 사람으로서", "우리 공화국을 위해 최선을 다하려 애썼을 뿐이오", "결투를 치르고 싶진 않으나", "옳은 일을 행한 것에 대해 사과할 생각은 결코 없소", "나는 귀하의 충직한 종복으로서 예를 다하오", "A. 햄"]}, {"key": "43:46-48", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Careful how you proceed, good man", "Intemperate indeed, good man", "Answer for the accusations I lay at your feet or prepare to bleed, good man"], "lines_kr": ["처신을 조심하는 게 좋을 거요, 여보시오", "참으로 무절제하기 짝이 없군, 여보시오", "내가 당신 발밑에 던진 고발에 해명하든지, 아니면 피를 흘릴 각오를 하시오, 여보시오"]}, {"key": "43:49-53", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Burr, your grievance is legitimate", "I stand by what I said, every bit of it", "You stand only for yourself", "It’s what you do", "I can’t apologize because it’s true"], "lines_kr": ["버, 그대의 불만은 일리 있소", "하지만 난 내가 한 말을 단 한마디도 번복하지 않겠소", "그대는 오직 자기 자신만을 위해 설 뿐이오", "그것이 그대의 본질이지", "진실을 말한 것이기에 난 사과할 수 없소"]}, {"key": "43:54-56", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Then stand, Alexander", "Weehawken. Dawn", "Guns. Drawn"], "lines_kr": ["그렇다면 맞서 서라, 알렉산더", "위호켄. 동틀 녘", "총을. 뽑아라"]}, {"key": "43:57", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You’re on"], "lines_kr": ["결투를 받아들이지"]}, {"key": "43:58", "speaker_kr": "아론 버, 알렉산더 해밀턴", "speaker_en": "Aaron Burr, Alexander Hamilton", "lines_en": ["I have the honor to be Your Obedient Servant"], "lines_kr": ["나는 귀하의 충직한 종복으로서 예를 다하오"]}, {"key": "43:59", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["A dot Ham"], "lines_kr": ["A. 햄"]}, {"key": "43:60", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["A dot Burr"], "lines_kr": ["A. 버"]}]}, {"id": 44, "act": 2, "title": "Best of Wives and Best of Women", "title_kr": "최고의 아내이자 최고의 여인", "characters_kr": ["알렉산더 해밀턴", "일라이자 스카일러"], "characters_en": ["Alexander Hamilton", "Eliza Schuyler"], "synopsis": "결투를 치르러 위호켄으로 떠나기 직전인 새벽, 서재에서 마지막 편지를 쓰던 알렉산더 해밀턴과 아내 일라이자의 짧고도 애틋한 마지막 대화. 새벽 두 시, 일라이자는 잠에서 깨어 여전히 촛불 아래에서 글을 쓰고 있는 남편에게 침대로 돌아오라고 다정하게 청한다. 필립의 죽음 이후 겨우 찾은 가정의 평화를 깨뜨리지 않기 위해, 해밀턴은 결투 사실을 숨긴 채 먼저 자라고 그녀를 안심시킨다. 그리고 방을 나서는 아내를 향해 평생의 사랑과 존경을 담아 '최고의 아내이자 최고의 여인'이라는 마지막 작별 인사를 건넨다.", "notes": ["**실제 알렉산더 해밀턴의 유서 구절 인용**: 넘버의 제목이자 마지막 대사인 'Best of wives and best of women'은 실제로 1804년 7월 4일, 결투 일주일 전 해밀턴이 일라이자에게 남긴 유서의 마지막 문장('Adieu best of wives and best of Women. Embrace all my darling Children for me.')에서 그대로 가져온 역사적 명문입니다.", "**'Why do you write like you’re running out of time?'의 회귀**: 1막 피날레 'Non-Stop'에서 아론 버가 해밀턴에게 던졌던 질문('Why do you write like you’re running out of time?')을, 이제는 아내 일라이자가 새벽의 서재에서 남편에게 묻습니다. 평생 시간에 쫓기듯 글을 써왔던 해밀턴에게, 이것이 정말로 생애 마지막으로 남기는 글이라는 잔인한 복선이 가슴을 뭉클하게 합니다.", "**침묵과 배려 속에 감춰진 비극적 긴장**: 일라이자는 아들을 잃은 상처에서 겨우 회복 중이었기에, 해밀턴은 그녀를 다시 절망으로 몰아넣지 않기 위해 결투의 위험을 철저히 숨깁니다. 해밀턴의 다정하고 따뜻한 목소리 이면에 깔린 비장함과, 남편의 운명을 알지 못한 채 미소 짓는 일라이자의 순수한 사랑이 1분 남짓한 짧은 시간 동안 응축되어 극적 슬픔을 배가합니다.", "**'That Would Be Enough'의 서정적 울림**: 일라이자가 건네는 'Come back to bed. That would be enough'라는 대사는 1막과 2막 내내 반복되어 온 그녀의 소박한 바람을 환기합니다. 해밀턴에게 늘 요구되었던 것은 거대한 역사적 업적이 아니라 가족 곁에 머무는 것이었으나, 해밀턴은 끝내 그 소망을 지켜주지 못하고 사지로 향합니다."], "stanzas": [{"key": "44:1", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Alexander, come back to sleep"], "lines_kr": ["알렉산더, 다시 누워 자요"]}, {"key": "44:2", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I have an early meeting out of town"], "lines_kr": ["시외에서 이른 아침 약속이 있어서 그렇소"]}, {"key": "44:3", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["It’s still dark outside"], "lines_kr": ["밖은 아직도 캄캄한걸요"]}, {"key": "44:4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I know. I just need to write something down"], "lines_kr": ["알고 있소. 그저 몇 줄 적어둘 게 있어서 말이오"]}, {"key": "44:5", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Why do you write like you’re running out of time?"], "lines_kr": ["왜 늘 시간에 쫓기듯 글을 쓰시나요?"]}, {"key": "44:6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Shhh"], "lines_kr": ["쉿"]}, {"key": "44:7", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Come back to bed. That would be enough"], "lines_kr": ["침대로 돌아와요. 그것만으로도 충분해요"]}, {"key": "44:8", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’ll be back before you know I’m gone"], "lines_kr": ["당신이 내가 떠난 걸 깨닫기도 전에 돌아오겠소"]}, {"key": "44:9", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Come back to sleep"], "lines_kr": ["다시 잠을 청해요"]}, {"key": "44:10", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["This meeting’s at dawn"], "lines_kr": ["새벽에 있는 모임이라 그렇소"]}, {"key": "44:11", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Well, I’m going back to sleep"], "lines_kr": ["그럼, 난 다시 자러 들어갈게요"]}, {"key": "44:12", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Hey. Best of wives and best of women"], "lines_kr": ["여보. 최고의 아내이자 최고의 여인이여"]}]}, {"id": 45, "act": 2, "title": "The World Was Wide Enough", "title_kr": "세상은 우리 둘 모두에게 충분히 넓었거늘", "characters_kr": ["아론 버", "앙상블 전체", "안젤리카 스카일러", "알렉산더 해밀턴", "남성 앙상블", "필립 해밀턴"], "characters_en": ["Aaron Burr", "Company", "Angelica Schuyler", "Alexander Hamilton", "Men", "Philip Hamilton"], "synopsis": "1804년 7월 11일 뉴저지 위호켄에서 벌어진 알렉산더 해밀턴과 아론 버의 역사적인 결투와 해밀턴의 최후, 그리고 버의 영원한 후회를 그린 장엄한 클라이맥스. 결투장에 선 버는 해밀턴이 안경을 쓰고 총포 장치를 점검하는 모습을 보며 그가 자신을 죽이려 한다고 오판하고 극도의 공포에 휩싸인다. 카운트 10이 세어지는 순간 시간이 정지하고, 해밀턴의 머릿속에서 죽음과 유산, 조국 미국, 그리고 먼저 떠난 전우들과 아들 필립, 사랑하는 아내 일라이자를 향한 마지막 독백이 펼쳐진다. 해밀턴은 총구를 하늘로 들어 올리지만, 시간이 다시 흐르는 순간 버의 총탄이 해밀턴의 갈비뼈를 관통한다. 총알이 명중한 뒤에야 해밀턴이 허공을 쏘았음을 깨달은 버는, 자신이 자식을 고아로 만들지 않겠다는 두려움 때문에 평생 씻을 수 없는 살인자이자 '역사의 악당'이 되었음을 절규한다.", "notes": ["**정지된 시간 속의 장엄한 독백 (Hamilton’s Soliloquy)**: 총탄이 날아가는 찰나의 순간 시간이 멈추고 펼쳐지는 해밀턴의 독백은 뮤지컬 전체의 주제 의식을 집대성합니다. '유산이란 무엇인가? 결코 보지 못할 정원에 씨앗을 심는 것(What is a legacy? It’s planting seeds in a garden you never get to see)'이라는 명대사와 함께, 미국이라는 '완성되지 않은 위대한 교향곡'에 바친 자신의 삶을 반추합니다.", "**'I am not throwin’ away my shot'의 비극적 전복과 초월**: 1막에서 'I am not throwin’ away my shot(난 내 기회를 결코 날려버리지 않아)'을 신조로 삼아 성공을 향해 돌진했던 해밀턴은, 삶의 마지막 순간 아들의 가르침을 따라 기꺼이 자신의 총을 허공으로 날려버립니다(throw away his shot). 야망을 버리고 도덕적 고결함과 사랑을 선택한 그의 결단은 죽음을 통한 정신적 승리를 상징합니다.", "**'Wait for it'의 파멸과 버의 참회 ('The world was wide enough')**: 평생 기다리고 계산하며 살아온 버는, 단 한 번의 성급한 두려움과 오판으로 인해 방아쇠를 당기고 맙니다. 해밀턴이 죽기 전 남긴 '세상은 우리 둘 모두에게 충분히 넓었다'는 깨달음은, 정적을 제거함으로써 승리자가 되기는커녕 영원히 손가락질받는 악역으로 낙인찍힌 버의 실존적 절망을 처절하게 드러냅니다.", "**무대 연출과 총알의 궤적 (The Bullet)**: 뮤지컬 초반부터 '죽음의 상징'으로 등장했던 앙상블 배우(The Bullet)의 손을 떠난 총알이 슬로모션으로 해밀턴을 향해 날아가는 연출과 버의 회상이 교차합니다. 생존을 위해 발버둥 쳤던 버가 오히려 영원한 영적 파멸을 맞이하고, 죽음을 맞이한 해밀턴이 영원한 유산으로 남는 역사의 아이러니가 극대화됩니다."], "stanzas": [{"key": "45:1", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["One two three four"], "lines_kr": ["하나 둘 셋 넷"]}, {"key": "45:2", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Five six seven eight nine—"], "lines_kr": ["다섯 여섯 일곱 조지 워싱턴이 등장하여 '누가 살고, 누가 죽고, 누가 당신의 이야기를 전하는지 그 누구도 통제할 수 없다'는 진리를 노래하고, 정적이었던 제퍼슨과 매디슨조차 해밀턴이 세운 금융 시스템의 천재성을 인정한다. 그러나 이 모든 이야기의 진정한 주인공은 남편 사후 50년을 더 살아가며 해밀턴의 유산을 지켜낸 아내 일라이자였다. 일라이자는 눈물을 거두고 반세기에 걸쳐 남편의 수많은 기록을 정리하고, 참전 용사들을 인터뷰하며, 워싱턴 기념탑 건립을 돕고 노예제 폐지를 외쳤으며, 마침내 뉴욕 최초의 사립 고아원을 설립해 수많은 아이들을 보살핀다. 필멸의 인간이 남길 수 있는 가장 숭고한 유산과 사랑의 승리를 노래하며 막을 내린다.", "notes": ["**일라이자 해밀턴의 50년 유산과 진정한 이야기꾼**: 이 작품의 숨겨진 진정한 주인공은 바로 일라이자입니다. 해밀턴이 47세의 나이로 요절한 뒤, 일라이자는 무려 97세까지 50년을 홀로 살며 남편의 모든 편지와 저작을 보존하고 편찬했습니다. 스스로를 '이야기에서 지웠던(Burn)' 그녀가 다시 이야기의 중심에 서서 남편과 건국 영웅들의 목소리를 역사에 되살려내는 과정은 깊은 감동을 선사합니다.", "**뉴욕 최초의 사립 고아원(Graham Windham)과 치유의 순환**: 카리브해의 가난한 고아로 태어나 평생 결핍과 투쟁 속에서 살았던 알렉산더 해밀턴의 상처를, 일라이자는 뉴욕 최초의 고아원을 설립하여 수많은 고아들을 구원함으로써 치유합니다. '그 아이들의 눈동자 속에서 당신을 보아요'라는 고백은, 해밀턴의 비극적인 삶이 일라이자의 헌신을 통해 따뜻한 사랑의 구원으로 승화되었음을 보여줍니다.", "**정적들의 뒤늦은 헌사와 역사의 심판**: 해밀턴과 치열하게 대립했던 토머스 제퍼슨과 제임스 매디슨조차 '그는 파산 직전의 국가를 번영으로 이끌었다', '그의 금융 시스템은 천재적인 걸작이었다'며 그의 업적을 공정하게 기립니다. 살아서는 당파 싸움에 휘말렸으나, 죽어서는 국가의 기틀을 세운 거인으로 인정받는 역사의 무게를 보여줍니다.", "**마지막 숨(The Gasp)과 관객을 향한 시선**: 뮤지컬의 마지막 순간, 일라이자는 허공(또는 객석)을 바라보며 숨을 들이쉬는 숨소리(Gasp)와 함께 암전됩니다. 이 연출은 마침내 천국에서 남편과 재회하는 순간의 벅찬 감동이거나, 200년 뒤 자신들의 이야기를 무대 위에서 기억하고 있는 현대의 관객들을 바라보는 경이로움의 표현으로 해석되며 긴 여운을 남깁니다."], "stanzas": [{"key": "46:1-3", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Let me tell you what I wish I’d known", "When I was young and dreamed of glory", "You have no control:"], "lines_kr": ["내가 알았더라면 좋았을 것들을 말해주마", "내가 젊어 영광을 꿈꾸던 그 시절에", "그대에게 통제권이란 없다는 것을:"]}, {"key": "46:4-6", "speaker_kr": "조지 워싱턴, 앙상블 전체", "speaker_en": "George Washington, Company", "lines_en": ["Who lives", "Who dies", "Who tells your story?"], "lines_kr": ["누가 사는지", "누가 죽는지", "누가 그대의 이야기를 전하는지"]}, {"key": "46:7", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["President Jefferson:"], "lines_kr": ["제퍼슨 대통령:"]}, {"key": "46:8-9", "speaker_kr": "토머스 제퍼슨", "speaker_en": "Thomas Jefferson", "lines_en": ["I’ll give him this: his financial system is a wo     function init() {
      renderSongList();
      loadSong(1);

    function setActFilter(act) {
      currentAct = act;
      document.querySelectorAll('.act-tab').forEach((t, idx) => {
        t.classList.toggle('active', (act === 'all' && idx === 0) || (act === 1 && idx === 1) || (act === 2 && idx === 2));
      });
      renderSongList();
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function handleSearch() {
      renderSongList();
    }

        if (currentAct !== 'all' && s.act !== currentAct) return;
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchChar = s.characters_kr.some(c => c.toLowerCase().includes(query)) || s.characters_en.some(c => c.toLowerCase().includes(query));
          const matchLyric = s.stanzas.some(st => st.lines_en.some(l => l.toLowerCase().includes(query)) || st.lines_kr.some(l => l.toLowerCase().includes(query)));
          if (!matchTitle && !matchChar && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => loadSong(s.id);
        item.innerHTML = `
          <div class="song-num">Act ${s.act} · #${String(s.id).padStart(2, '0')}</div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarBackdrop').classList.toggle('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('open');
    }

    function loadSong(id) {
      currentSongId = id;
      closeSidebar();
      document.querySelectorAll('.song-item').forEach(el => {
        el.classList.remove('active');
      });
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Act ${song.act} · Track ${String(song.id).padStart(2, '0')} / 46`;

      const charsStr = song.characters_kr.map((kr, idx) => `${kr} (${song.characters_en[idx]})`).join(', ');

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & Rhymes)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
          <div class="song-meta">
            <span>🎭 제${song.act}막 (Act ${song.act})</span>
            <span>👥 등장인물: ${charsStr || '앙상블 전체'}</span>
          </div>
        </div>
        <div class="synopsis-box">
          <strong>📖 장면 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
  </script>
</body>
</html>
