<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>뮤지컬 해밀턴(Hamilton) 전 46곡 영한 대역 뷰어</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --gold: #d4af37;
      --gold-light: #f5d77f;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --text: #e6e6e6;
      --text-muted: #9ba1a6;
      --border: #2e2e36;
      --hover: #26262d;
      --char-tag: #332b18;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    #sidebar {
      width: 320px;
      background: #161619;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      background: #141416;
    }
    .sidebar-header h1 {
      font-size: 1.15rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #202025;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--gold); }
    .act-tabs {
      display: flex;
      padding: 6px 12px;
      gap: 6px;
      background: #141417;
      border-bottom: 1px solid var(--border);
    }
    .act-tab {
      flex: 1;
      padding: 6px 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .act-tab.active {
      background: var(--gold-dim);
      color: var(--gold);
      border-color: rgba(212,175,55,0.4);
      font-weight: 600;
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .song-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .song-item:hover {
      background: var(--hover);
    }
    .song-item.active {
      background: var(--gold-dim);
      border-color: rgba(212, 175, 55, 0.4);
    }
    .song-num {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 600;
    }
    .song-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }
    .song-title-kr {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .top-bar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: #161619;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 6px 14px;
      background: #202026;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--gold);
      color: #000;
      font-weight: 600;
      border-color: var(--gold);
    }
    .song-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .song-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .song-header h2 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 700;
    }
    .song-header h2 .kr-title {
      color: var(--gold-light);
      margin-left: 10px;
      font-size: 1.3rem;
      font-weight: 500;
    }
    .song-meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .song-meta span {
      background: #202026;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .synopsis-box {
      background: var(--card-bg);
      border-left: 4px solid var(--gold);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .notes-box {
      background: #18191f;
      border: 1px solid #2a2c3d;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }
    .notes-box h4 {
      font-size: 0.88rem;
      color: #79a8f8;
      margin-bottom: 10px;
    }
    .notes-box ul {
      padding-left: 20px;
      font-size: 0.85rem;
      color: #b0b4bd;
    }
    .notes-box li {
      margin-bottom: 6px;
    }
    /* Stanzas */
    .stanza-block {
      margin-bottom: 28px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .speaker-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
      background: var(--char-tag);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 14px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .lyric-pair {
      margin-bottom: 12px;
      line-height: 1.55;
    }
    .lyric-en {
      font-weight: 600;
      color: #f0f0f0;
      font-size: 0.96rem;
    }
    .lyric-kr {
      color: #9cdcfe;
      font-size: 0.92rem;
      margin-top: 2px;
    }
    /* Mode filters */
    .mode-kr-only .lyric-en { display: none; }
    .mode-en-only .lyric-kr { display: none; }

    /* Navigation & Mobile Drawer */
    .nav-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.82rem;
      margin-bottom: 8px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .nav-home-link:hover { opacity: 1; text-decoration: underline; }
    .mobile-nav-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #141416;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 998;
    }
    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .mobile-nav-bar {
        display: flex;
      }
      .sidebar-close-btn {
        display: block;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 82%;
        max-width: 320px;
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: 4px 0 24px rgba(0,0,0,0.8);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .top-bar {
        padding: 10px 14px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .view-toggles {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      .view-btn {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        font-size: 0.75rem;
      }
      .song-content {
        padding: 20px 16px;
      }
      .song-header h2 {
        font-size: 1.35rem;
      }
      .song-header h2 .kr-title {
        display: block;
        margin-left: 0;
        margin-top: 4px;
        font-size: 1.05rem;
      }
      .lyric-en {
        font-size: 0.92rem;
      }
      .lyric-kr {
        font-size: 0.88rem;
      }
    }
  </style>
</head>

  <script>

도 신념을 걸지 않는다면 대체 무엇에 쓰러지겠느냐'는 날카로운 일침을 남기며 혁명의 소용돌이 속으로 발을 내딛는다.", "notes": ["해밀턴이 'punched the bursar(대학 회계관을 주먹으로 쳤다)'라고 털어놓는 대목은 곡의 제목이자 호칭인 'Burr, sir(버 선생)'와의 절묘한 동음이의어(Pun)를 활용한 언어유희다. 규칙을 부수고 돌진하는 해밀턴의 충동성과 질서와 체면을 중시하는 버의 성격 차이가 이 단어 유희 하나로 선명하게 드러난다.", "버의 좌우명인 'Talk less, smile more / Don’t let them know what you’re against or what you’re for'는 극 전체에 걸쳐 그의 신중하고 기회주의적인 정치적 스탠스를 규정하는 중심 테마이다. 이는 훗날 그의 메인 테마곡인 'Wait for It'으로 이어지며, 'My Shot'에서 저돌적으로 직진하는 해밀턴의 삶의 태도와 극명한 대비를 이룬다.", "로런스, 라파예트, 멀리건 삼총사의 등장은 1980~90년대 올드스쿨 힙합 그룹(Beastie Boys의 폭발적 에너지나 A Tribe Called Quest)의 등장 연출을 연상시키며, 'Show time!' 챈트는 뉴욕 지하철 댄서들의 상징적인 외침을 오마주한 것이다.", "존 로런스의 'Two pints o’ Sam Adams, but I’m workin’ on three'는 미국의 유명 맥주 브랜드인 '사무엘 아담스'와 보스턴 차 사건의 주역이자 건국의 아버지인 새뮤얼 애덤스를 중의적으로 엮어낸 라임이다.", "라파예트의 불어와 영어를 섞은 현란한 라임(Lafayette / revolutionary set, Bonsoir / Casse toi / C’est moi), 멀리건의 거친 성적 농담과 재단사로서의 자부심이 묻어나는 브라바도(bravado)는 각 캐릭터의 입체적 면모를 효과적으로 부각시킨다.", "해밀턴의 마지막 일침 'If you stand for nothing, Burr, what’ll you fall for?'는 알렉산더 해밀턴의 비타협적 성정을 완벽하게 요약하는 명대사이자, 훗날 1800년 대선에서 버의 모호한 정치를 비판하며 제퍼슨을 지지하게 되는 비극적 복선으로 기능한다."], "stanzas": [{"key": "2:1", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["1776. New York City"], "lines_kr": ["1776년. 뉴욕시"]}, {"key": "2:2", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Pardon me. Are you Aaron Burr, sir?"], "lines_kr": ["실례합니다. 혹시 아론 버 선생이십니까?"]}, {"key": "2:3", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["That depends. Who’s asking?"], "lines_kr": ["그건 상황에 따라 다르지. 묻는 자가 누구냐에 따라?"]}, {"key": "2:4-6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Oh, well, sure, sir", "I’m Alexander Hamilton, I’m at your service, sir", "I have been looking for you"], "lines_kr": ["아, 네, 당연히 그러시겠죠, 선생", "전 알렉산더 해밀턴입니다. 분부만 내리십시오, 선생", "선생을 계속 찾아다녔습니다"]}, {"key": "2:7", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I’m getting nervous"], "lines_kr": ["점점 불안해지는군"]}, {"key": "2:8-9", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir…", "I heard your name at Princeton. I was seeking an accelerated course of study when I got sort of out of sorts with a buddy of yours. I may have punched him. It’s a blur, sir. He handles the financials?"], "lines_kr": ["선생…", "프린스턴에서 선생의 이름을 들었습니다. 월반 속성 과정을 밟으려다가 선생의 친구분과 약간 언쟁이 붙었는데, 주먹으로 한 대 날렸을지도 모릅니다. 기억이 흐릿하네요, 선생. 그분이 재정을 관리하시던가요?"]}, {"key": "2:10", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["You punched the bursar"], "lines_kr": ["회계관(bursar)을 때려눕혔다고?"]}, {"key": "2:11-13", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Yes!", "I wanted to do what you did. Graduate in two, then join the revolution. He looked at me like I was stupid, I’m not stupid", "So how’d you do it? How’d you graduate so fast?"], "lines_kr": ["예!", "선생처럼 하고 싶었거든요. 2년 만에 졸업하고 곧바로 혁명에 뛰어드는 것. 그런데 날 바보 보듯 쳐다보더군요, 난 바보가 아닌데", "도대체 어떻게 하신 겁니까? 어떻게 그렇게 빨리 졸업하셨나요?"]}, {"key": "2:14", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["It was my parents’ dying wish before they passed"], "lines_kr": ["돌아가시기 전 부모님의 유언이었네"]}, {"key": "2:15-18", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You’re an orphan? Of course! I’m an orphan", "God, I wish there was a war!", "Then we could prove that we’re worth more", "Than anyone bargained for…"], "lines_kr": ["선생도 고아이십니까? 세상에! 저도 고아입니다", "맙소사, 전쟁이라도 터졌으면 좋겠어요!", "그렇다면 우리가 예상된 몸값보다 훨씬 더 가치 있는", "인물이라는 걸 증명할 수 있을 텐데…"]}, {"key": "2:19", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Can I buy you a drink?"], "lines_kr": ["술 한잔 사도 되겠나?"]}, {"key": "2:20", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["That would be nice"], "lines_kr": ["아주 좋죠"]}, {"key": "2:21-22", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["While we’re talking, let me offer you some free advice", "Talk less"], "lines_kr": ["이야기 나누 tand", "You spit. I’m ‘a sit. We’ll see where we land"], "lines_kr": ["행운을 비네. 너희는 입장을 명확히 밝히겠지", "너흰 침을 뱉어라. 난 앉아서 관망할 테니. 어떻게 끝나는지 보자고"]}, {"key": "2:57", "speaker_kr": "마르키 드 라파예트, 허큘리스 멀리건", "speaker_en": "Marquis de Lafayette, Hercules Mulligan", "lines_en": ["Boooo!"], "lines_kr": ["우우우-!"]}, {"key": "2:58", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["Burr, the revolution’s imminent. What do you stall for?"], "lines_kr": ["버, 혁명이 눈앞에 닥쳤는데. 대체 뭘 꾸물대는 거야?"]}, {"key": "2:59", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["If you stand for nothing, Burr, what’ll you fall for?"], "lines_kr": ["아무것에도 신념을 걸지 않는다면, 버, 대체 무엇에 걸려 넘어지려는 겁니까?"]}]}, {"id": 3, "act": 1, "title": "My Shot", "title_kr": "마이 샷 (나의 기회)", "characters_kr": ["아론 버", "허큘리스 멀리건", "존 로런스", "마르키 드 라파예트", "앙상블 전체", "알렉산더 해밀턴"], "characters_en": ["Aaron Burr", "Hercules Mulligan", "John Laurens", "Marquis de Lafayette", "Company", "Alexander Hamilton"], "synopsis": "작품 전체의 심장이자 알렉산더 해밀턴의 영혼을 대변하는 뮤지컬 역사상 최고의 앤섬(Anthem). 술집에서 운명적으로 조우한 로런스, 라파예트, 멀리건과 함께 영국 식민 지배의 가혹한 현실과 부조리를 성토하며, 혈기 넘치는 청년들이 혁명의 횃불을 높이 치켜드는 장면이다. 해밀턴은 자신이 가진 유일한 무기인 천재적인 두뇌와 언변, 그리고 비타협적인 열정으로 '결코 내 기회를 허투루 날리지 않겠다(I am not throwing away my shot)'고 선언한다. 개인의 야망과 조국의 독립이라는 거대한 대의가 하나로 융합되며, 술집에 모인 젊은이들과 민중을 선동해 '무릎 꿇고 살지 말고 일어서라(Rise up!)'라는 혁명의 외침으로 온 무대를 뒤흔든다.", "notes": ["'Shot'의 중의적 언어유희(Multitiered Pun): 'Shot'은 ① 술 한 잔(a shot of alcohol), ② 총탄을 발사할 기회(firing a gun shot), ③ 인생을 바꿀 일생일대의 기회(a shot at greatness), ④ 그리고 결투에서 허공으로 총을 쏘아버리는 행위(throwing away a shot in a duel)를 동시에 의미한다. 오프닝부터 결코 기회를 날리지 않겠다고 외친 해밀턴이, 결국 비극적 최후의 결투에서 허공으로 총을 쏘아 목숨을 잃는다는 거대한 운명적 역설이 이 곡에 각인되어 있다.", "힙합 클래식 오마주의 결정체: 린마누엘 미란다가 작곡에 1년 이상을 바친 이 곡은 맙 딥(Mobb Deep)의 대표곡 'Shook Ones Pt. II'의 상징적인 드럼 루프와 비트를 차용했으며, 노토리어스 B.I.G.(Biggie)의 'Going Back to Cali' 플로우, 에미넴(Eminem)의 'Lose Yourself' 속 절박한 헝그리 정신('young, scrappy and hungry')을 곳곳에 배치했다.", "인물별 이상과 시대적 청사진: 로런스의 최초 흑인 노예 해방 대대(Black Battalion) 창설 꿈, 라파예트의 프랑스 본국 혁명과 무정부/군주제 폐지 열망, 멀리건의 신분 상승 의지가 교차한다. 여기에 해밀턴은 'Are we a nation of states? What’s the state of our nation?'이라며 독립 이후 연방 체제와 국가 재정 수립이라는 거시적 통치 철학까지 설파한다.", "죽음에 대한 실존적 고뇌: 'I imagine death so much it feels more like a memory'로 시작하는 독백 파트는 가족들의 잇따른 죽음을 목격하며 자란 해밀턴의 깊은 트라우마를 보여준다. '내일이 없는 것처럼(past tomorrow)' 글을 쓰고 일에 매달리는 그의 편집증적 조급함의 원천을 설득력 있게 설명한다."], "stanzas": [{"key": "3:1-2", "speaker_kr": "존 로런스, 허큘리스 멀리건, 마르키 드 라파예트", "speaker_en": "John Laurens, Hercules Mulligan, Marquis de Lafayette", "lines_en": ["Ooh", "Who are you?"], "lines_kr": ["우-", "넌 누구냐?"]}, {"key": "3:3", "speaker_kr": "존 로런스, 허큘리스 멀리건, 마르키 드 라파예트", "speaker_en": "John Laurens, Hercules Mulligan, Marquis de Lafayette", "lines_en": ["Ooh, who is this kid? What’s he gonna do?"], "lines_kr": ["우-, 이 꼬맹이는 누구지? 대체 뭘 하겠다는 거야?"]}, {"key": "3:4-23", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I am not throwing away my shot!", "I am not throwing away my shot!", "Hey yo, I'm just like my country", "I'm young, scrappy and hungry", "And I'm not throwing away my shot!", "I'm 'a get a scholarship to King's College", "I prob’ly shouldn’t brag, but dag, I amaze and astonish", "The problem is I got a lot of brains but no polish", "I gotta holler just to be heard", "With every word, I drop knowledge!", "I’m a diamond in the rough, a shiny piece of coal", "Tryin’ to reach my goal. My power of speech: unimpeachable", "Only nineteen but my mind is older", "These New York City streets get colder, I shoulder", "Ev’ry burden, ev’ry disadvantage", "I have learned to manage, I don’t have a gun to brandish", "I walk these streets famished", "The plan is to fan this spark into a flame", "But damn, it’s getting dark, so let me spell out the name", "I am the—"], "lines_kr": ["난 내 기회를 결코 날려버리지 않아!", "난 내 기회를 결코 날려버리지 않아!", "헤이 요, 난 내 나라와 똑같아", "난 젊고, 거칠며, 성공에 굶주렸지", "그러니 난 내 기회를 날려버리지 않아!", "난 킹스 칼리지 장학금을 타낼 거야", "자랑질은 삼가야겠지만, 젠장, 난 모두를 놀라게 하고 감탄시키지", "문제는 머리는 비상한데 세련미가 다듬어지지 않았다는 것", " t": 1, "title": "The Story of Tonight", "title_kr": "오늘 밤의 이야기", "characters_kr": ["조지 워싱턴", "허큘리스 멀리건", "마르키 드 라파예트", "존 로런스", "앙상블 전체", "알렉산더 해밀턴"], "characters_en": ["George Washington", "Hercules Mulligan", "Marquis de Lafayette", "John Laurens", "Company", "Alexander Hamilton"], "synopsis": "열기 넘쳤던 'My Shot'의 선동과 환호가 잦아든 늦은 밤, 선술집 밖으로 나온 네 명의 청년(해밀턴, 로런스, 라파예트, 멀리건)이 술잔을 부딪치며 서로의 어깨를 겯고 부르는 서정적이고 웅장한 찬가. 내일 전쟁터로 나가 목숨을 잃을지도 모르지만, 자유를 위한 이 위대한 투쟁과 형제애는 훗날 후손들이 자랑스럽게 기억할 '오늘 밤의 이야기'가 될 것이라 노래한다. 억압과 죽음의 공포 앞에서도 흔들리지 않는 자유에 대한 신념, 그리고 청춘의 순수한 연대와 비장미가 진한 여운을 남긴다.", "notes": ["포크 및 브로드웨이 남성 합창의 정수: 힙합 비트가 지배적이었던 앞선 곡들과 달리, 통기타 아르페지오와 4부 합창(Four-part harmony)으로 전환되어 혁명 직전 청년들의 인간적인 고요와 낭만을 극대화한다. 아일랜드 민요나 미국의 전통적 자유 찬가(Drinking song/Folk hymn)의 음악적 전통을 잇고 있다.", "자유의 본질에 대한 선언: 'Raise a glass to freedom / Something they can never take away'라는 구절은 영국 제국주의의 물리적 억압 속에서도 결코 빼앗길 수 없는 인간 내면의 존엄과 자유를 선언한다. 이 테마는 훗날 'The Story of Tonight (Reprise)' 등 극의 주요 전환점마다 변주되어 울려 퍼진다.", "역사적 현실과 비극적 복선: 'I may not live to see our glory... Tomorrow there’ll be more of us'를 주도하는 존 로런스는 실제로 독립전쟁의 막바지인 1782년 사우스캐롤라이나에서 전사하여 승리의 영광을 직접 보지 못하고 요절한다. 네 친구 중 가장 먼저 세상을 떠날 로런스의 목소리로 이 구절이 울려 퍼질 때 진한 비극적 아이러니를 자아낸다.", "기억의 영속성과 작품 전체의 수미상관: 'And when our children tell our story / They’ll tell the story of tonight'은 개인이 사라지더라도 그들이 남긴 가치와 역사는 후대에 의해 계속 전승된다는 메시지를 담고 있으며, 이는 뮤지컬의 마지막 넘버인 'Who Lives, Who Dies, Who Tells Your Story'의 대주제를 예고하는 중요한 모티프다."], "stanzas": [{"key": "4:1", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I may not live to see our glory!"], "lines_kr": ["내 살아생전 영광을 다 보진 못할지라도!"]}, {"key": "4:2", "speaker_kr": "마르키 드 라파예트, 허큘리스 멀리건, 존 로런스", "speaker_en": "Marquis de Lafayette, Hercules Mulligan, John Laurens", "lines_en": ["I may not live to see our glory!"], "lines_kr": ["내 살아생전 영광을 다 보진 못할지라도!"]}, {"key": "4:3", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["But I will gladly join the fight!"], "lines_kr": ["기꺼이 이 투쟁에 ngelica Schuyler", "Men", "Eliza Schuyler"], "synopsis": "뉴욕 최고 명문가 필립 스카일러 장군의 세 딸—안젤리카, 일라이자, 페기—이 혁명의 열기로 들끓는 맨해튼 도심(Downtown)으로 몰래 빠져나와 활기찬 거리를 누비는 넘버. 도심을 거닐며 상류층 처녀들을 유혹하려 접근하는 아론 버를 안젤리카가 날카로운 지성과 토머스 페인의 계몽주의 사상으로 가볍게 격퇴한다. 자매들은 단순히 부유한 신붓감으로 머물기를 거부하고, 독립선언서의 평등 정신이 여성에게도 확장되어야 한다는 진보적 이상을 노래하며 '세계 최고의 도시 뉴욕'에서 거대한 역사가 태동하고 있음에 환호한다.", "notes": ["90년대 여성 R&B 걸그룹 스타일 오마주: 데스티니스 차일드(Destiny's Child), TLC, 엔 보그(En Vogue) 등 1990년대 R&B 팝 걸그룹 특유의 당당한 애티튜드, 그루브한 베이스라인, 3부 화음 하모니를 완벽히 구현하여 스카일러 자매들의 세련된 현대적 감각과 에너지를 부각시켰다.", "'Work!'의 다층적 언어유희: 반복되는 감탄사 'Work!'는 패션계/팝 컬처에서 사용되는 '자신감 넘치게 멋진 모습을 뽐내다(Slay/Work it!)'라는 찬사의 의미와, 안젤리카가 갈망하는 지적 탐색('I’m lookin’ for a mind at work' - 치열하게 사유하고 행동하는 지성)을 연결하는 세련된 이중적 표현이다.", "계몽주의와 초기 페미니즘 담론의 도입: 안젤리카는 토머스 페인의 팜플렛 『상식(Common Sense)』을 인용하며 독립선언서의 핵심 구절인 '모든 인간(Men)은 평등하게 창조되었다'를 언급한 뒤, 훗날 자신이 토머스 제퍼슨을 만나면 '속편(the sequel)에는 여성도 반드시 포함시키도록 강제할 것'이라고 당차게 선언한다. 이는 실제 역사 속 지적이고 독립적인 여성이었던 안젤리카 스카일러의 진취적인 면모를 탁월하게 재현한 것이다.", "버의 기회주의적 작업 멘트 격퇴(Disgust me vs Discuss me): 버가 'I’m a trust fund, baby, you can trust me!'라며 가문의 재력을 내세워 유혹하자 안젤리카가 단칼에 'Burr, you disgust me(역겨워요)'라고 쏘아붙이고, 버는 이를 'Ah, so you’ve discussed me(내 얘기를 나눈 적이 있단 거군)'라며 말장난으로 능청스럽게 넘긴다. 두 인물의 지적 설전이자 권력과 혈통에만 안주하는 기득권 남성에 대한 통쾌한 풍자다.", "'And Peggy!'의 코믹한 캐릭터라이징: 셋째 페기 스카일러는 언니들의 열정과 대담함에 비해 늘 규칙과 아버지의 훈육을 걱정하며 다소 엉뚱하게 따라다니는 감초 역할을 맡아, 짧은 한 줄의 자기소개('And Peggy!')만으로도 뮤지컬 팬덤에서 가장 사랑받는 밈(meme) 중 하나로 자리 잡았다."], "stanzas": [{"key": "5:1-9", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["There’s nothing rich folks love more", "Than going downtown and slummin’ it with the poor", "They pull up in their carriages and gawk", "At the students in the common", "Just to watch them talk", "Take Philip Schuyler: the man is loaded", "Uh-oh, but little does he know that", "His daughters, Peggy, Angelica, Eliza", "Sneak into the city just to watch all the guys at—"], "lines_kr": ["부자 녀석들이 가장 좋아하는 짓이 있지", "도심으로 내려가 가난뱅이들과 어울려 빈민가 흉내 내는 것", "고급 마차를 세워두고 넋 놓고 쳐다보지", "광장 해 '구시대 영국 제국주의의 질서'와 '새 시대를 여는 미국의 혁명적 역동성'을 청각적으로 구현했다.", "역사적 논문 『Farmer Refuted』의 극화: 곡의 제목과 대사는 1775년 당시 10대였던 해밀턴이 시버리의 왕당파 소책자 『A Westchester Farmer』에 반박하여 발표한 실제 명논문 『The Farmer Refuted(논파당한 농부)』에서 직접 유래했다. 해밀턴의 압도적인 논리력과 글솜씨가 식민지 전역에 이름을 떨치게 된 결정적 사건이다.", "신랄한 언어유희와 지적 조롱: 해밀턴은 'My dog speaks more eloquently than thee! / But strangely, your mange is the same'이라며 시버리의 낭독을 개 짖는 소리에 비유해 조롱하고, 'Don’t modulate the key then not debate with me!'라며 음악적 전조(modulate)를 풍자의 무기로 활용하는 고난도의 메타적 재치를 발휘한다.", "버와 해밀턴의 사상적 대립(Divisive vs Indecisive): 싸움을 말리며 체면을 차리라는 버('Alexander, please!')에게 해밀턴은 'Burr, I’d rather be divisive than indecisive, drop the niceties(우유부단하게 구느니 차라리 분란을 일으키겠소, 예의 차릴 때가 아니오)'라고 쏘아붙인다. 두 사람의 좁혀질 수 없는 세계관의 차이를 선명하게 부각하는 명장면이다."], "stanzas": [{"key": "6:1-4", "speaker_kr": "새뮤얼 시버리", "speaker_en": "Samuel Seabury", "lines_en": ["Hear ye, hear ye! My name is Samuel Seabury", "And I present “Free Thoughts on the Proceedings of the Continental Congress!”", "Heed not the rabble who scream revolution", "They have not your interests at heart"], "lines_kr": ["들으라, 경청하라! 내 이름은 새뮤얼 시버리", "『대륙회의 의사록에 대한 솔직한 고찰』을 발표하노라!", "혁명을 부르짖는 오합지졸 폭도들에게 귀 기울이지 말라", "그들은 여러분의 안위에는 추호의 관심도 없다"]}, {"key": "6:5", "speaker_kr": "허큘리스 멀리건", "speaker_en": "Hercules Mulligan", "lines_en": ["Oh my God. Tear this dude apart"], "lines_kr": ["세상에 맙소사. 저 자식을 갈기갈기 찢어버려"]}, {"key": "6:6-8", "speaker_kr": "새뮤얼 시버리", "speaker_en": "Samuel Seabury", "lines_en": ["Chaos and bloodshed are not a solution", "Don’t let them lead you astray", "This Congress does not speak for me"], "lines_kr": ["혼란과 유혈 사태는 결코 해결책이 될 수 없나니", "그들이 여러분을 파멸의 길로 현혹하게 두지 말라", "이 대륙회의는 결코 나를 대변하지 않는다"]}, {"key": "6:9", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Let him be"], "lines_kr": ["그냥 내버려 두게"]}, {"key": "6:10-12", "speaker_kr": "새뮤얼 시버리", "speaker_en": "Samuel Seabury", "lines_en": ["They’re playing a dangerous game", "I pray the king shows you his mercy", "For shame, for shame…"], "lines_kr": [ 로 논쟁을 해보시지!", "왜 바다 건너 쥐꼬리만 한 섬나라가 차(茶) 가격을 좌지우지해야 한단 말인가?"]}, {"key": "6:33", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Alexander, please!"], "lines_kr": ["알렉산더, 제발 진정하게!"]}, {"key": "6:34", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Burr, I’d rather be divisive than indecisive, drop the niceties"], "lines_kr": ["버, 우유부단하게 구느니 차라리 분란을 일으키겠소, 위선적인 예의 따윈 집어치워요"]}, {"key": "6:35-36", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Silence! A message from the King!", "A message from the King!"], "lines_kr": ["조용! 국왕 폐하의 서한이다!", "국왕 폐하의 서한이다!"]}, {"key": "6:37", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["A message from the King!"], "lines_kr": ["국왕 폐하의 서한이다!"]}]}, {"id": 7, "act": 1, "title": "You'll be Back", "title_kr": "넌 다시 돌아올 거야", "characters_kr": ["앙상블 전체", "조지 3세"], "characters_en": ["Company", "King George III"], "synopsis": "식민지 미국의 반란과 저항 소식을 전해 들은 대영제국의 국왕 조지 3세가 등장하여 부르는 솔로 넘버. 1960년대 브리티시 인베이전(비틀즈 풍)의 경쾌하고 달콤한 팝 멜로디에 실려 있지만, 그 내용은 결별을 통보한 연인에게 집착하며 폭력을 휘두르는 사이코패스적 '데이트 폭력'과 스토킹의 섬뜩한 알레고리로 가득 차 있다. 자신의 통치와 은혜를 거부하는 식민지 백성들을 향해 '내 사랑을 상기시키기 위해 완전 무장한 대대를 보내겠다', '너희 친구와 가족을 몰살하겠다'고 천진난만한 미소와 함께 협박하는 조지 3세의 오만하고 그로테스크한 군주상이 블랙코미디의 진수를 선사한다.", "notes": ["브리티시 인베이전(British Invasion) 팝 스타일 차용: 1960년대 비틀즈(The Beatles), 킨크스(The Kinks), 좀비스(The Zombies) 특유의 발랄한 피아노 바운스 리듬과 브리티시 팝 멜로디를 완벽하게 재현했다. 혁명파 청년들이 구사하는 현대 미국 힙합/R&B 사운드와 극명한 대비를 이루며, 낡고 기괴한 대영제국 왕실의 이질감을 음악적으로 탁월하게 표현했다.", "제국주의와 폭력적 연인의 소름 돋는 비유: 국가 간의 정치적 종속 관계를 '집착에 눈먼 학대자 남편과 탈출하려는 아내'의 파탄 난 연애 관계에 빗대었다. 'You cry in your tea which you hurl in the sea'(보스턴 차 사건에 대한 위트 있는 조롱)로 시작하여, 'I will kill your friends and family to remind you of my love'라는 잔혹한 협박으로 치닫는 반전은 관객들에게 섬뜩한 충격과 폭소를 동시에 안긴다.", "'Subject'의 다중 언어유희: 'And no, don’t change the subject / Cuz you’re my favorite subject / My sweet, submissive subject / My loyal, royal subject'로 이어지는 라인은 '화제(subject)'를 돌리지 말라는 일상적 대화에서 출발하여 왕에게 절대복종해야 하는 '신민/백성(subject)'으로 단어의 의미 ginian veteran whose men are all / Lining up, to put me up on a pedestal'은 19세기 영국의 대표적 희극 오페레타 『펜잔스의 해적(The Pirates of Penzance)』 속 'Major-General's Song'을 힙합의 다중 라임(Virginian veteran, pedestal, elegance and eloquence)으로 오마주한 것이다. 세상 사람들의 맹목적 우상화와 전장의 참혹한 현실 사이에서 갈등하는 워싱턴의 내면을 탁월하게 드러낸다.", "전쟁의 비참한 현실과 4대 열세 챈트: 'We are outgunned / Outmanned / Outnumbered / Outplanned'라는 네 줄의 라임은 독립전쟁 초기 대륙군이 처한 절망적 한계를 단적으로 요약한다. 워싱턴은 'Dying is easy, young man. Living is harder(죽는 건 쉬운 일이다, 젊은이. 살아남는 게 더 어려운 법이지)'라는 명언을 통해, 명예로운 전사(戰死) 환상에 사로잡혀 있던 해밀턴에게 지도자로서 짊어져야 할 무거운 생존과 책임의 무게를 일깨운다.", "버의 거절과 해밀턴의 발탁 (운명의 엇갈림): 아론 버는 신중하게 몽고메리 장군 휘하에서의 경력을 내세우며 워싱턴에게 다가가지만, 워싱턴은 'Close the door on your way out(나갈 때 문이나 닫게)'이라며 단칼에 잘라낸다. 반면 직설적이고 불꽃같은 추진력을 가진 해밀턴에게는 약점까지 털어놓으며 참모로 삼는다. 이로써 버의 가슴속에 해밀턴을 향한 깊은 소외감과 시기심이 뿌리내리게 된다.", "사운드 디자인과 공간적 퇴각의 역동성: 워싱턴의 고뇌와 해밀턴의 대포 탈취 작전 사이로 터져 나오는 거대한 포성('Boom!')은 킵스베이, 브루클린, 할렘으로 이어지는 절체절명의 퇴각 작전을 무대 위에서 영화적 긴박감으로 연출한다. 'Are these the men with which I am to defend America?'는 패주하는 병사들을 보며 실제로 워싱턴이 토로했던 역사적 탄식을 그대로 인용한 것이다."], "stanzas": [{"key": "8:1-2", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["British Admiral Howe’s got troops on the water", "Thirty-two thousand troops in New York harbor"], "lines_kr": ["영국의 하우 제독이 바다 위에 병력을 집결시켰다", "3만 2천의 군대가 뉴욕 항구에 들어찼다"]}, {"key": "8:3-6", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Thirty-two thousand troops in New York harbor", "When they surround our troops!", "They surround our troops!", "When they surround our troops!"], "lines_kr": ["3만 2천의 군대가 뉴욕 항구에 들어찼다", "저들이 우리 군을 포위할 때!", "저들이 우리 군을 포위한다!", "저들이 우리 군을 포위할 때!"]}, {"key": "8:7-9", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["As a kid in the Caribbean I wished for a war", "I knew that I was poor", "I knew it was the only way to—"], "lines_kr": ["카리브해의 어린 소년 시절 난 전쟁이 터지길 바랐지", "난 내가 지독히 가난하단 걸 알았고", "그것만이 유일하게 저 바닥에서—"]}, {"key": "8:10", "speaker_kr": "알렉산더 해밀턴, 아론 버, 존 로런스, 허큘리스 멀리건, 마르키 136", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I am not throwing away my shot!"], "lines_kr": ["난 내 기회를 결코 날려버리지 않아!"]}, {"key": "8:137", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Son"], "lines_kr": ["자네"]}, {"key": "8:138", "speaker_kr": "조지 워싱턴, 앙상블 전체", "speaker_en": "George Washington, Company", "lines_en": ["We are outgunned, outmanned!"], "lines_kr": ["화력도 밀리고, 병력도 부족하다!"]}, {"key": "8:139-141", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You need all the help you can get", "I have some friends. Laurens, Mulligan", "Marquis de Lafayette, okay, what else?"], "lines_kr": ["각하께선 얻을 수 있는 모든 도움이 필요합니다", "제게 친구들이 있습니다. 로런스, 멀리건", "라파예트 후작까지. 좋습니다, 그다음엔 뭐가 필요하십니까?"]}, {"key": "8:142", "speaker_kr": "조지 워싱턴, 앙상블 전체", "speaker_en": "George Washington, Company", "lines_en": ["Outnumbered, outplanned!"], "lines_kr": ["머릿수도 뒤지고, 전략도 간파당했다!"]}, {"key": "8:143-146", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["We’ll need some spies on the inside", "Some King’s men who might let some things slide", "I’ll write to Congress and tell ‘em we need supplies, you rally the guys, master the element of surprise", "I’ll rise above my station, organize your information, ‘til we rise to the occasion of our new nation. Sir!"], "lines_kr": ["적진 내부에 첩자를 심어야 합니다", "정보를 은근슬쩍 흘려줄 왕실 측 인사들이 필요해요", "제가 의회에 편지를 써서 보급품을 요구할 테니, 각하께선 병사들을 규합하고 기습의 묘수를 장악하십시오", "제 미천한 신분을 뛰어넘어 각하의 정보를 일목요연하게 정리하겠습니다, 우리 새 나라의 위대한 도약에 걸맞은 순간에 도달할 때까지. 각하!"]}, {"key": "8:147", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Here comes the General!"], "lines_kr": ["장군님이 오신다!"]}, {"key": "8:148-149", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Rise up!", "Rise up!"], "lines_kr": ["일어서라!", "일어서라!"]}, {"key": "8:150", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Here comes the General!"], "lines_kr": ["장군님이 오신다!"]}, {"key": "8:151", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Rise up!"], "lines_kr": ["일어서라!"]}, {"key": "8:152", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Here comes the General!"], "lines_kr": ["장군님이 오신다!"]}, {"key": "8:153", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["What?"], "lines_kr": ["무엇을?"]}, {"key": "8:154", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["And his right hand man!"], "lines_kr": ["그리고 그의 오른팔이 함께!"]}, {"key": "8:155", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Boom!"], "lines_kr": ["쾅!"]}]}, {"id": 9, "act": 1, "title": "A Winter's Ball", "title_kr": "어느 겨울날의 무도회", "characters_kr": ["알렉산더 해밀턴", "남성 앙상블", "앙상블 전체", "아론 버"], "characters_en": ["Alexander Hamilton", "Men", "Company", "Aaron Burr"], "synopsis": "1780년 뉴저지 모리스타운(Morristown)의 대륙군 겨울 사령부에서 열린 겨울 무도회를 배경으로 한다. 혹독한 추위와 군수품 부족에 시달리는 전장의 현실 속에서도 열린 이 사교 행사는 장교들과 뉴욕 유력 가문들이 만나는 화려한 자리였다. 아론 버는 사생아 출신 고아에 불과했던 해밀턴이 특유의 천재적인 글솜씨로 워싱턴 총사령관의 오른팔로 급부상한 출세 가도를 냉소와 질투가 뒤섞인 시선으로 지켜본다. 버는 자신과 해밀턴 모두 '여인들에게 유독 신뢰받고 인기 있다'는 공통점이 있음을 유쾌하게 떠벌린다. 특히 당대 최고의 거부이자 명망가인 필립 스카일러 장군의 딸들('스카일러 자매들')이 무도회장에 등장하자, 버는 부유한 자매와 혼인하는 것이야말로 무일푼 청년들이 신분 상승을 이룰 절호의 기회임을 조언한다. 이에 해밀턴은 '과연 가능하냐가 아니라 누구를 고를까의 문제'라며 도발적인 자신감을 드러낸다. 이 압축적인 트랜지션 넘버는 청춘들의 야망과 로맨스를 연결하며 해밀턴의 운명을 완전히 뒤바꿀 스카일러 가문과의 만남(Helpless, Satisfied)으로 관객을 안내한다.", "notes": ["라임과 플로우의 위트: 버의 독백 오프닝은 'whore go on and on / phenomenon', 'loudmouth bother / father', 'sight / write', 'undeniable / reliable' 등 린마누엘 미란다 특유의 다중 각운(multisyllabic rhyme)이 돋보이며, 버의 능청스러운 성격과 빈정거리는 톤을 리드미컬하게 드러낸다.", "마사 워싱턴의 길고양이 일화 (Martha Washington's feral tomcat): 버가 언급하는 '마사 워싱턴이 길들지 않은 수고양이에게 해밀턴의 이름을 붙였다'는 일화는 18세기 당시 대륙군 내외에서 유포되었던 풍자성 소문에서 차용한 것이다. '톰캣(tomcat)'은 당대 속어로 난봉꾼, 호색한을 뜻하는 은어였으며, 해밀턴의 뛰어난 남성적 매력과 당돌함을 해학적으로 묘사한다.", "신분 상승과 사교계의 결혼관 (Social Climbing via Marriage): 18세기 미국 사회에서 무일푼 고아이자 이민자였던 해밀턴에게 명문가와의 혼인은 사회적·정치적 기반을 단숨에 마련할 수 있는 핵심적인 사다리였다. 버의 '자매 중 하나와 결혼하면 인생역전'이라는 조언과 해밀턴의 '누구를 고를까의 문제'라는 응수는 두 사람의 야망과 기질 차이를 극명하게 보여준다.", "음악적 구조와 전환 (Musical Transition): 21줄의 매우 압축된 넘버이지만, 군대 앙상블의 호방한 외침('Ladies!')과 경쾌한 힙합 비트, 쳄발로풍의 바로크 악기 사운드가 결합되어 무도회의 우아함과 병사들의 거친 욕망을 동시에 드러낸다. 이는 일라이자의 로맨틱한 R&B 발라드 'Helpless'로 직결된다."], "stanzas": [{"key": "9:1-8", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["How does the bastard, orphan, son of a whore go on and on", "Grow into more of a phenomenon?", "Watch this obnoxious, arrogant, loudmouth bother", "Be seated at the right hand of the father", "Washington hires Hamilton right on sight", "But Hamilton still wants to fight, not write", "Now Hamilton’s skill with a quill is undeniable", "But what do we have in common? We’re reliable with the"], "lines_kr": ["사생아에 고아, 창녀의 자식놈이 대체 어떻게 계속해서", "전설적인 현상으로 거듭나고 있는가?", "저 거슬리고 오만방자한 말썽쟁이 수다쟁이가", "총사령관 '아버지'의 오른편에 떡하니 앉아 있는 꼴을 보라지", "워싱턴은 해밀턴을 보자마자 곧바로 등용했건만", "해밀턴은 글 쓰는 대신 여전히 싸우길 원하네", "깃펜을 쥔 해밀턴의 필력이야 의심할 여지 없지만", "우리 둘 사이에 어떤 공통점이 있을까? 우린 확실하게 통하지, 바로—"]}, {"key": "9:9", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["Ladies!"], "lines_kr": ["여인들에게!"]}, {"key": "9:10", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["There are so many to deflower!"], "lines_kr": ["꺾어버릴 꽃들이 지천으로 널렸지!"]}, {"key": "9:11", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["Ladies!"], "lines_kr": ["여인들에게!"]}, {"key": "9:12", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Looks! Proximity to power"], "lines_kr": ["수려한 외모! 권력과의 지근거리!"]}, {"key": "9:13", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["Ladies!"], "lines_kr": ["여인들에게!"]}, {"key": "9:14-15", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["They delighted and distracted him", "Martha Washington named her feral tomcat after him!"], "lines_kr": ["여인들은 그를 즐겁게 홀리고 넋을 쏙 빼놓았지", "마사 워싱턴은 혈기왕성한 도둑고양이한테 그놈 이름을 붙였다니까!"]}, {"key": "9:16", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["That’s true!"], "lines_kr": ["진짜 그랬지!"]}, {"key": "9:17", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["1780"], "lines_kr": ["1780년"]}, {"key": "9:18-19", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["A winter’s ball", "And the Schuyler sisters are the envy of all"], "lines_kr": ["어느 겨울 무도회", "스카일러가의 자매들은 만인의 부러움을 사고 있었지"]}, {"key": "9:20", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Yo, if you can marry a sister, you’re rich, son"], "lines_kr": ["야, 저 자매 중 하나만 낚아채면 인생역전이야, 친구"]}, {"key": "9:21", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Is it a question of if, Burr, or which one?"], "lines_kr": ["과연 가능할까가 문제겠어, 버, 아니면 누구를 고를까가 문제겠어?"]}]}, {"id": 10, "act": 1, "title": "Helpless", "title_kr": "어쩔 줄을 모르겠어 (헬프리스)", "characters_kr": ["여성 앙상블", "아론 버", "존 로런스", "안젤리카 스카일러", "알렉산더 해밀턴", "일라이자 스카일러"], "characters_en": ["Women", "Aaron Burr", "John Laurens", "Angelica Schuyler", "Alexander Hamilton", "Eliza Schuyler"], "synopsis": "1780년 겨울 무도회에서 일라이자 스카일러가 알렉산더 해밀턴을 처음 만나 사랑에 빠지고 결혼에 이르기까지의 과정을 일라이자의 순수하고 벅찬 시선에서 그린 넘버다. 90년대 R&B 팝 스타일(비욘세나 데스티니스 차일드 풍)의 감미로운 멜로디로 진행되며, 화려하게 나서는 언니 안젤리카와 달리 조용하고 수줍음 많은 일라이자는 무도회장에 당당하게 걸어 들어오는 해밀턴을 보고 첫눈에 심장이 멎을 듯한 충격('Boom!')을 받는다. 언니 안젤리카의 주선으로 해밀턴을 소개받은 후, 두 사람은 매일 밤 편지를 주고받으며 깊은 사랑을 키워간다. 마침내 해밀턴은 일라이자의 완고한 부친 필립 스카일러 장군을 찾아가 진심 어린 설득으로 결혼 승낙을 받아내고, 두 사람은 성대한 결혼식을 올린다. 해밀턴은 가진 것 하나 없는 무일푼 고아이지만 일라이자에게 자신의 명예와 지성, 그리고 영원한 헌신을 맹세하며 새로운 인생을 꿈꾼다.", "notes": ["음악적 장르와 캐릭터성 (R&B Style and Eliza's Purity): 'Helpless'는 힙합 중심의 다른 넘버들과 달리 감미로운 90년대 R&B/팝 스타일을 띤다. 아샨티(Ashanti)나 비욘세를 연상시키는 보컬 런(vocal runs)과 코러스는 일라이자의 순백의 순수함, 해밀턴에 대한 무조건적이고 헌신적인 사랑을 청각적으로 극대화한다. 'Helpless(속수무책인, 어쩔 줄 모르는)'라는 반복구는 사랑에 온전히 무장해제된 감정을 표현한다.", "해밀턴의 진솔한 고백과 계급적 불안 (Hamilton's Honest Vow): 후반부 해밀턴의 독백('Eliza, I don’t have a dollar to my name...')은 그의 솔직한 처지와 야심을 압축한다. 토지도, 지휘할 군대도 없으며 오직 '명예와 고통을 견디는 인내심, 대학 학점 몇 개와 최고급 두뇌'뿐이라는 고백은 그가 귀족 사회의 사위가 되면서 느끼는 자격지심과 동시에 자신의 재능에 대한 자부심을 동시에 보여준다.", "안젤리카와의 대비와 복선 (Contrast with Satisfied): 이 곡에서 언니 안젤리카는 동생의 사랑을 적극적으로 이어주는 다정한 중매자로 묘사된다('I’m about to change your life', 'Yo, this one’s mine'). 하지만 바로 다음 곡 'Satisfied'에서 시간이 되감기며(Rewind), 안젤리카의 내면에 감춰졌던 지적 교감과 뼈아픈 희생이 드러남으로써 관객에게 입체적인 서사적 충격을 안겨준다.", "모티프의 연계: 'In New York you can be a new man': 곡의 클라이맥스 결혼식 장면에서 여성 앙상블이 부르는 'In New York you can be a new man'은 오프닝 곡 'Alexander Hamilton'에서 불렸던 멜로디와 가사다. 이는 카리브해의 불우한 사생아였던 해밀턴이 뉴욕에서 일라이자와의 결합을 통해 비로소 온전한 가족과 새로운 정체성을 얻게 됨을 상징한다."], "stanzas": [{"key": "10:1-3", "speaker_kr": "알렉산더 해밀턴, 아론 버, 존 로런스", "speaker_en": "Alexander Hamilton, Aaron Burr, John Laurens", "lines_en": ["Hey", "Hey", "Hey hey"], "lines_kr": ["헤이", "헤이", "헤이 헤이"]}, {"key": "10:4", "speaker_kr": "알렉산더 해밀턴, 아론 버, 존 로런스, 여성 앙상블", "speaker_en": "Alexander Hamilton, Aaron Burr, John Laurens, Women", "lines_en": ["Hey hey hey hey"], "lines_kr": ["헤이 헤이 헤이 헤이"]}, {"key": "10:5-8", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Ohh, I do I do I do I", "Dooo! Hey!", "Ohh, I do I do I do I", "Dooo! Boy you got me"], "lines_kr": ["오, 난 정말 정말 정말", "빠져버렸어! 헤이!", "오, 난 정말 정말 정말", "빠져버렸어! 그댄 날 완전히 사로잡았네"]}, {"key": "10:9-11", "speaker_kr": "일라이자 스카일러, 여성 앙상블", "speaker_en": "Eliza Schuyler, Women", "lines_en": ["Helpless!", "Look into your eyes, and the sky’s the limit I’m helpless!", "Down for the count, and I’m drownin’ in ‘em"], "lines_kr": ["어쩔 줄 몰라!", "그대 두 눈을 보면, 하늘 끝까지 닿을 듯 나 어쩔 줄 몰라!", "완전히 무장해제되어, 그 눈빛 속에 빠져 허우적대네"]}, {"key": "10:12-17", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I have never been the type to try and grab the spotlight", "We were at a revel with some rebels on a hot night", "Laughin’ at my sister as she’s dazzling the room", "Then you walked in and my heart went “Boom!”", "Tryin’ to catch your eye from the side of the ballroom", "Everybody’s dancin’ and the band’s top volume"], "lines_kr": ["난 주인공이 되려고 나서는 성격이 결코 아니었지", "어느 뜨거운 밤 반역자 청년들과의 흥겨운 파티에서", "온 무도회장을 눈부시게 사로잡는 언니를 보며 웃고 있었는데", "그때 그대가 걸어 들어왔고 내 심장은 '쿵!' 하고 내려앉았지", "무도회장 한구석에서 그대와 눈을 맞추려 애쓰는데", "모두가 춤추고 밴드의 음악은 터질 듯 울려 퍼지네"]}, {"key": "10:18", "speaker_kr": "일라이자 스카일러, 여성 앙상블", "speaker_en": "Eliza Schuyler, Women", "lines_en": ["Grind to the rhythm as we wine and dine"], "lines_kr": ["와인과 만찬 속에 음악에 몸을 맡겨 춤을 추네"]}, {"key": "10:19-31", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Grab my sister, and whisper, “Yo, this one’s mine.”", "My sister made her way across the room to you", "And I got nervous, thinking “What’s she gonna do?”", "She grabbed you by the arm, I’m thinkin’ “I’m through”", "Then you look back at me and suddenly I’m helpless!", "Oh, look at those eyes", "Oh!", "Yeah, I’m", "Helpless, I know", "I’m so into you", "I am so into you", "I know I’m down for the count", "And I’m drownin’ in ‘em."], "lines_kr": ["언니를 붙잡고 속삭였지, '언니, 저 사람은 내 거야.'", "언니는 방을 가로질러 그대에게 걸어갔고", "난 가슴이 철렁했어, '언니가 대체 뭘 하려는 거지?'", "언니가 그대 팔을 붙잡는 순간, 속으로 '난 끝장이야' 했지", "하지만 그대가 날 돌아보았고, 순식간에 난 어쩔 줄 몰라!", "오, 저 눈동자를 봐", "오!", "그래, 난", "어쩔 줄 몰라, 알아", "그대에게 푹 빠져버렸어", "그대에게 너무나 푹 빠져버렸어", "완전히 항복해 쓰러졌다는 걸 알아", "그리고 그 눈빛에 빠져 허우적대네."]}, {"key": "10:32", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Where are you taking me?"], "lines_kr": ["저를 어디로 데려가시는 겁니까?"]}, {"key": "10:33", "speaker_kr": "안젤리카 스카일러", "speaker_en": "Angelica Schuyler", "lines_en": ["I’m about to change your life"], "lines_kr": ["당신의 인생을 바꿔드리려는 참이에요"]}, {"key": "10:34", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Then by all means, lead the way"], "lines_kr": ["그렇다면 부디, 앞장서 주시죠"]}, {"key": "10:35", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Elizabeth Schuyler. It’s a pleasure to meet you"], "lines_kr": ["엘리자베스 스카일러예요. 만나 뵙게 되어 기뻐요"]}, {"key": "10:36", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Schuyler?"], "lines_kr": ["스카일러 가문이요?"]}, {"key": "10:37", "speaker_kr": "안젤리카 스카일러", "speaker_  ["뉴욕에서, 넌 새로운 사람이 될 수 있어…", "뉴욕에서, 넌 새로운 사람이 될 수 있어…", "뉴욕에서, 넌 새로운 사람이 될 수 있어…"]}, {"key": "10:87", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Helpless"], "lines_kr": ["어쩔 줄 몰라"]}]}, {"id": 11, "act": 1, "title": "Satisfied", "title_kr": "결코 만족할 수 없어 (새티스파이드)", "characters_kr": ["존 로런스", "앙상블 전체", "안젤리카 스카일러", "알렉산더 해밀턴", "일라이자 스카일러"], "characters_en": ["John Laurens", "Company", "Angelica Schuyler", "Alexander Hamilton", "Eliza Schuyler"], "synopsis": "알렉산더와 일라이자의 결혼식 피로연에서 신부 들러리(maid of honor)인 언니 안젤리카 스카일러가 축배사를 건네며 시작된다. 안젤리카는 겉으로는 신랑 신부의 영원한 행복을 축복하지만, '리와인드(Rewind)' 효과음과 함께 무대의 시간이 거꾸로 돌아가 두 달 전 겨울 무도회 밤의 회상에 빠져든다. 당시 안젤리카는 해밀턴을 처음 마주쳤을 때 자신의 뛰어난 지성과 대등하게 맞설 수 있는 유일한 남자를 만났다는 전율을 느꼈다. 그러나 찰나의 순간, 안젤리카는 세 가지 잔인한 현실을 직시한다: 1) 아들이 없는 명문가의 장녀로서 부유한 가문과 정략결혼해 가문을 일으켜 세워야 한다는 가부장적 책무, 2) 무일푼인 해밀턴이 신분 상승을 위해 자신을 택했을 수도 있다는 현실적 계산, 3) 무엇보다 해밀턴을 보고 순수하게 사랑에 빠진 동생 일라이자의 눈빛. 결국 안젤리카는 자신의 뜨거운 사랑을 가슴속에 묻고 해밀턴을 동생에게 양보한다. 그녀는 평생 자신도, 해밀턴도 결코 온전히 '만족할 수 없는(never be satisfied)' 운명임을 예감하며 비극적인 축배를 마친다.", "notes": ["뮤지컬 역사상 가장 혁신적인 '리와인드' 연출과 래핑 (The Rewind & Fast Rap): 'Helpless'의 로맨틱한 선율이 역재생되는 턴테이블 사운드와 함께 안젤리카의 초고속 랩이 터져 나온다. 니키 미나즈(Nicki Minaj)를 연상시키는 안젤리카의 랩은 분당 200단어가 넘는 정교한 라임('match wits / level / catch / It’s', 'two minutes / three minutes / total agreement', 'penniless / insidious')으로 그녀의 비상한 두뇌 회전과 복잡한 내면 심리를 표현한다.", "세 가지 근본적 진실 (Three Fundamental Truths): 안젤리카의 갈등은 3단계로 명확히 분석된다: 첫째, 가부장제 사회에서 부유한 결혼을 해야 하는 장녀의 한계('My only job is to marry rich'), 둘째, 해밀턴의 야망과 무일푼 신분('He’s penniless'), 셋째, 자신보다 착하고 순수한 동생 일라이자에 대한 헌신과 자매애('I know my sister like I know my own mind'). 안젤리카의 희생은 단순한 체념이 아니라 동생을 향한 지극한 사랑과 가문의 책무 사이에서 내린 지적인 결단이다.", "'Satisfied'의 이중적 의미와 비극적 아이러니 (The Dual Meaning of Satisfied): 해밀턴의 'You strike me as a woman who has never been satisfied'라는 대사에서 시작된 '만족(satisfied)'이라는 단어는 넘버 전체를 관통하는 핵심 모티프다. 해밀턴의 채워지지 않는 거대한 야망, 안젤리카의 지적 갈증과 억눌린 정념, 그리고 결혼식 축배에서 일라이자에게 기원하는 'May you always be satisfied'가 교차하며, 일라이자만이 유일하게 만족을 누릴 수 있고 자신과 해밀턴은 결코 만족할 수 없는 평행선 같은 영혼임을 상징한다.", "무대 회전 연출과 라이트모티프의 역전 (Staging & Turntable Choreography): 무도회 장면으로 돌아갈 때 무대 턴테이블이 역회전하고 앙상블이 이전 곡 'Helpless'의 동작을 거꾸로 수행하는 시각적 연출은 브로드웨이 무대 연출의 정점으로 꼽힌다. 과거의 벅찬 설렘과 현실의 비통한 축배가 교차하는 감정의 굴곡을 완벽하게 시각화했다."], "stanzas": [{"key": "11:1-3", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["Alright, alright. That’s what I’m talkin’ about!", "Now everyone give it up for the maid of honor", "Angelica Schuyler!"], "lines_kr": ["좋아요, 좋아. 바로 이 분위기지!", "자 이제 모두 신부 들러리에게 큰 박수를 보내주세요", "안젤리카 스카일러!"]}, {"key": "11:4-23", "speaker_kr": "안젤리카 스카일러", "speaker_en": "Angelica Schuyler", "lines_en": ["A toast to the groom!", "To the bride!", "From your sister", "Who is always by your side", "To your union", "And the hope that you provide", "May you always…", "Be satisfied", "I remember that night, I just might", "Regret that night for the rest of my days", "I remember those soldier boys", "Tripping over themselves to win our praise", "I remember that dreamlike candlelight", "Like a dream that you can’t quite place", "But Alexander, I’ll never forget the first", "Time I saw your face", "I have never been the same", "Intelligent eyes in a hunger-pang frame", "And when you said “Hi,” I forgot my dang name", "Set my heart aflame, ev’ry part aflame"], "lines_kr": ["신랑을 위해 건배!", "신부를 위해!", "언제나 당신 곁을", "지키는 언니로부터", "두 사람의 결합과", "그대들이 밝혀준 희망을 위해", "언제까지나 두 분이…", "만족하기를", "난 그날 밤을 기억해, 어쩌면", "남은 평생 그날 밤을 후회할지도 몰라", "난 그 군인 청년들을 기억해", "우리의 칭찬 한마디 얻으려고 앞다투어 넘어지던 녀석들을", "꿈결 같던 그 촛불을 난 기억해", "손에 잡힐 듯 잡히지 않는 꿈만 같았던", "하지만 알렉산더, 난 결코 잊지 못할 거야", "그대의 얼굴을 처음 보았던 순간을", "난 완전히 달라져 버렸지", "갈망에 굶주린 몸선 속에 번뜩이는 지적인 눈빛", "그대가 '안녕하세요' 인사했을 때, 내 젠장할 이름조차 잊어버렸어", "내 심장에 불을 질렀네, 온몸 구석구석 불꽃이 타올랐지"]}, {"key": "11:24", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["This is not a game…"], "lines_kr": ["이건 단순한 장난이 아니야…"]}, {"key": "11:25", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You strike me as a woman who has n  satisfied", "And I know", "She’ll be happy as his bride", "And I know", "He will never be satisfied", "I will never be satisfied"], "lines_kr": ["하지만 밤마다 달콤한 상상에 잠길 때면", "언제나 떠오르는 건 알렉산더의 눈동자", "만약 내가 그렇게 서둘러 그를", "재고 따져 평가하지 않았다면", "어땠을까 낭만에 젖어보지만", "적어도 내 소중한 일라이자가 그의 아내이고;", "적어도 그 눈빛을 내 평생 곁에 둘 수 있으니…", "신랑을 위해!", "신부를 위해!", "언제나 그대들 곁을 지킬", "당신의 언니이자 언니의 축배를!", "두 사람의 결합과", "그대들이 선사하는 희망을 위해", "언제까지나 두 분이", "만족하기를", "그리고 난 알아", "동생은 그의 신부로 행복할 테지만", "그리고 난 알지", "그는 결코 만족하지 못할 거라는 걸", "나 역시 결코 만족하지 못하리라는 걸"]}]}, {"id": 12, "act": 1, "title": "The Story of Tonight (Reprise)", "title_kr": "오늘 밤의 이야기 (리프라이즈)", "characters_kr": ["아론 버", "허큘리스 멀리건", "존 로런스", "마르키 드 라파예트", "알렉산더 해밀턴"], "characters_en": ["Aaron Burr", "Hercules Mulligan", "John Laurens", "Marquis de Lafayette", "Alexander Hamilton"], "synopsis": "알렉산더와 일라이자의 결혼식이 끝난 직후, 술집에 모인 해밀턴의 혁명 동지 4인방(해밀턴, 로런스, 라파예트, 멀리건)이 술잔을 부딪치며 축하와 농담을 주고받는 유쾌하고 떠들썩한 장면이다. 친구들은 '천하의 난봉꾼(tomcat) 해밀턴이 부잣집 사위가 되어 품절남이 되었다'며 해밀턴의 결혼과 신분 상승을 익살스럽게 놀려댄다. 이때 뜻밖에도 아론 버가 결혼 축하 인사를 건네기 위해 등장한다. 친구들은 버를 짓궂게 놀려대지만, 해밀턴은 친구들을 물리고 버와 단둘이 진지한 대화를 나눈다. 해밀턴은 버가 조지아 전선에 주둔 중인 영국군 고위 장교의 아내(시오도시야)와 비밀스러운 연애 중임을 알게 되고, '사랑한다면 무엇을 망설이냐, 당장 가서 쟁취하라'며 적극적인 행동을 촉구한다. 하지만 매사에 신중하고 리스크를 극도로 꺼리는 버는 '전쟁이 끝난 저편에서 보자'며 발걸음을 돌린다. 두 청년의 상반된 가치관과 인생관이 은밀하게 부딪히는 중요한 복선 넘버다.", "notes": ["동지애의 유쾌한 변주와 성적 농담 (Bawdy Brotherhood): 4번 곡 'The Story of Tonight'의 숭고하고 진지했던 혁명 찬가가 여기서는 술기운 어린 취중 진담과 장난기 넘치는 리프라이즈로 변주된다. '우리 녀석들한테도 한 가닥 희망이 있다(There’s hope for our ass, after all!)', '우리 중 새로 가난을 탈출한 자를 위하여(To the newly not poor of us!)' 등 청년 장교들의 거칠고 격의 없는 형제애가 생생하게 드러난다.", "해밀턴의 행동주의 vs 버의 관망주의 (Action vs Caution): 버가 유부녀이자 적국 장교의 아내인 시오도시야와의 위험한 사랑을 법과 관습 때문에 억누르고 망설이는 모습에 대해, 해밀턴은 '사랑한다면 당장 가서 차지하라(If you love this woman, go get her! What are you waiting for?)'고 외친다. 이 질문은 버의 인생 전체를 지배하는 질문이며, 곧바로 이어지는 버의 시그니처 솔로 곡 'Wait for It'의 직접적인 도화선이 된다.", "조지아의 영국 장교와 시오도시야 프레보 (Theodosia Prevost): 버가 사랑에 빠진 여성은 영국군 대령 자크 마커스 프레보(Jacques Marcus Prevost)의 아내 시오도시야 바토 프레보였다. 5명의 자녀를 둔 연상의 유부녀였으며, 적국의 장교 아내와의 밀회는 발각될 경우 버의 군사적·정치적 경력에 치명타가 될 수 있었다. 버가 철저하게 비밀을 지키며 기다릴 수밖에 없었던 역사적 배경이다.", "언어적 재치와 버(Burr) 라임의 향연: 'Aaron Burr, sir / To be sure / verse, Burr / worst, Burr'로 이어지는 이름 라임의 유희와, 'Lieutenant Colonel / George’s journal / indispensable'로 이어지는 해밀턴과 버의 지적인 언쟁 라임이 경쾌한 힙합 리듬을 만든다."], "stanzas": [{"key": "12:1", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["I may not live to see our glory!"], "lines_kr": ["우리 영광의 날을 살아서 보진 못할지라도!"]}, {"key": "12:2", "speaker_kr": "허큘리스 멀리건, 마르키 드 라파예트", "speaker_en": "Hercules Mulligan, Marquis de Lafayette", "lines_en": ["I may not live to see our glory!"], "lines_kr": ["우리 영광의 날을 살아서 보진 못할지라도!"]}, {"key": "12:3", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["But I’ve seen wonders great and small"], "lines_kr": ["하지만 크고 작은 기적들을 보았노라"]}, {"key": "12:4", "speaker_kr": "허큘리스 멀리건, 마르키 드 라파예트", "speaker_en": "Hercules Mulligan, Marquis de Lafayette", "lines_en": ["I’ve seen wonders great and small"], "lines_kr": ["크고 작은 기적들을 보았노라"]}, {"key": "12:5", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["‘Cause if the tomcat can get married"], "lines_kr": ["그 천하의 바람둥이 고양이놈도 장가를 갔으니"]}, {"key": "12:6", "speaker_kr": "허큘리스 멀리건, 마르키 드 라파예트", "speaker_en": "Hercules Mulligan, Marquis de Lafayette", "lines_en": ["If Alexander can get married—"], "lines_kr": ["알렉산더 녀석이 장가를 갈 수 있다면—"]}, {"key": "12:7", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["There’s hope for our ass, after all!"], "lines_kr": ["결국 우리 녀석들한테도 한 가닥 희망이 있는 거지!"]}, {"key": "12:8", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["Raise a glass to freedom"], "lines_kr": ["자유를 위해 잔을 들라"]}, {"key": "12:9-10", "speaker_kr": "존 로런스, 허큘리스 멀리건", "speaker_en": "John Laurens, Hercules Mulligan", "lines_en": ["Hey!", "Something you will never see again!"], "lines_kr": ["헤이!", "자네가 다신 누려보지 못할 자유를!"]}, {"key": "12:11", "speaker_kr": "허큘리스 멀리건", "speaker_en" 4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I will never understand you", "If you love this woman, go get her! What are you waiting for?"], "lines_kr": ["난 도무지 자넬 이해할 수가 없어", "그 여인을 사랑한다면 가서 쟁취해! 대체 무얼 망설이고 기다리는 건가?"]}, {"key": "12:55", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["I’ll see you on the other side of the war"], "lines_kr": ["전쟁이 끝난 저편에서 다시 보세"]}, {"key": "12:56", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’ll see you on the other side of the war"], "lines_kr": ["전쟁이 끝난 저편에서 보세"]}]}, {"id": 13, "act": 1, "title": "Wait for It", "title_kr": "때를 기다려 (웨이트 포 잇)", "characters_kr": ["앙상블 전체", "아론 버"], "characters_en": ["Company", "Aaron Burr"], "synopsis": "아론 버의 내면세계와 인생철학을 집대성한 뮤지컬 <해밀턴>의 가장 웅장하고 철학적인 대표 넘버다. 해밀턴의 '도대체 무엇을 망설이고 기다리는가?'라는 도발에 대한 버의 장엄하고 비장한 내면적 응답이다. 버는 적국 장교의 아내인 시오도시야와의 비밀스러운 사랑을 고백하며, 사랑과 죽음은 성인(saints)과 죄인(sinners)을 가리지 않고 무자비하게 모든 것을 앗아간다는 인생의 덧없음을 노래한다. 미국 대각성 운동을 이끈 저명한 청교도 신학자 조너선 에드워즈를 외조부로 두고 명문가에서 태어났지만, 어린 시절 부모를 모두 여의고 홀로 가문의 유산을 지켜내야 했던 버에게, 인생에서 온전히 통제할 수 있는 유일한 것은 오직 '자기 자신'뿐이었다. 물불 가리지 않고 돌진하여 모든 것을 쟁취해 나가는 해밀턴을 바라보며 버는 질투와 경외감을 동시에 느끼지만, 자신이 뒤처진 것이 아니라 웅크리고 기회를 노리며 기다리고 있는 것(lying in wait)이라 다짐한다. 운명의 파도 속에서 살아남아 끝내 승리하기 위해 기꺼이 때를 기다리겠다는 버의 처절한 생존주의적 선언이다.", "notes": ["청교도 명문가와 조너선 에드워즈의 유산 (Jonathan Edwards & Legacy): 버의 외조부 조너선 에드워즈(Jonathan Edwards)는 미국의 대각성 운동을 이끈 유명한 청교도 설교가('fire and brimstone preacher')이며, 아버지는 프린스턴 대학교 2대 총장이었다. 부모가 모두 일찍 세상을 떠나고 남겨진 거대한 가문의 명성과 무게감('When they died they left no instructions / Just a legacy to protect')은 버로 하여금 실패에 대한 극도의 공포와 신중함을 내면화하게 만들었다.", "사랑, 죽음, 삶의 차별 없는 냉혹함 (Universal Impartiality): 1절에서는 'Love doesn’t discriminate', 2절에서는 'Death doesn’t discriminate', 후반부에서는 'Life doesn’t discriminate'로 주어가 변주된다. 인간의 선악이나 도덕성과 무관하게 모든 것을 무자비하게 앗아가는('It takes and it takes and it takes') 냉혹한 우주적 섭리 앞에서, 버는 해밀턴처럼 함부로 돌진하지 않고 오직 인내하며 살아남는 것만이 진정한 승리라고 믿는다.", "해밀턴의 맹렬한 돌진과 버의 잠복 (Relentless Climb vs Lying in Wait): 잃을 것이 없어 거침없이 판돈을 올리고(raise the stakes) 끝없이 돌진하는 해밀턴과, 지켜야 할 가문과 명예가 너무 많아 한 걸음도 헛딛을 수 없는 버의 근본적 심리 대비가 폭발한다. 'I’m not standing still, I am lying in wait'이라는 구절은 훗날 두 사람의 비극적 결투와 대립을 예고하는 섬뜩한 복선이다.", "음악적 빌드업과 폴리리듬 합창 (Musical Buildup & Choral Resonance): 서정적인 피아노와 어쿠스틱 비트로 시작하여, 앙상블의 강박적인 코러스('Wait for it / Climb / Lose / Time')가 층층이 쌓이면서 브로드웨이 팝과 웅장한 가스펠이 융합된 폭발적인 클라이맥스로 나아간다. 레슬리 오덤 주니어(Leslie Odom Jr.)에게 토니상 남우주연상을 안겨준 결정적인 넘버다."], "stanzas": [{"key": "13:1-25", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Theodosia writes me a letter every day", "I'm keeping the bed warm while her husband is away", "He's on the British side in Georgia", "He's trying to keep the colonies in line", "But he can keep all of Georgia", "Theodosia, she's mine", "Love doesn't discriminate", "Between the sinners", "And the saints", "It takes and it takes and it takes", "And we keep loving anyway", "We laugh and we cry", "And we break", "And we make our mistakes", "And if there's a reason I'm by her side", "When so many have tried", "Then I'm willing to wait for it", "I'm willing to wait for it", "My grandfather was a fire and brimstone preacher", "But there are things that the", "Homilies and hymns won't teach ya", "My mother was a genius", "My father commanded respect", "When they died they left no instructions", "Just a legacy to protect"], "lines_kr": ["시오도시야는 매일 내게 편지를 쓴다네", "그녀의 남편이 멀리 떠나 있는 동안 내가 그녀의 침대를 덥혀주고 있지", "남편은 조지아 전선에서 영국군 편에 서서", "식민지 반란군을 진압하려 애쓰고 있지", "하지만 조지아 땅 따위 다 가져가라지", "시오도시야, 그녀는 나의 것", "사랑은 차별하지 않네", "죄인들과", "성인들을 가리지 않고", "그저 빼앗고 빼앗고 또 빼앗을 뿐", "그래도 우린 어김없이 사랑을 하네", "우린 웃고 울부짖으며", "무너져 내리고", "끝없이 실수를 저지르지", "수많은 이들이 그녀를 갈망했음에도", "내가 그녀 곁을 지키는 데 이유가 있다면", "그렇다면 난 기꺼이 때를 기다리리라", "난 기꺼이 때를 기다리리라", "내 외조부는 불과 유황을 토해내던 명 설교가였지만", "설교집과 찬송가조차도", "결코 가르쳐주지 못하는 것들이 있는 법", "내 어머니는 천재였고", "내 아버지는 만인의 존경을 받는 분이었지", "두 분이 세상을 떠나실 때 어떤 가르침도 남기지 않았고", "오직 지켜내야 할 가문의 유산만을 남기셨네"]}, {"key": "13:26-38", "speaker_kr": "아론 버, 앙상블 전체", "speaker_en": "Aaro 한 찰스 리 장군 사이의 권총 결투 과정을 18세기 결투 규범인 '코드 뒤엘로(Code Duello)'에 입각해 1부터 10까지 단계별 수칙으로 묘사한 역동적인 힙합 넘버다. 노토리어스 B.I.G.(The Notorious B.I.G.)의 클래식 힙합 명곡 'Ten Crack Commandments'를 오마주한 곡으로, 18세기 신사 계급의 엄격한 명예 규약과 결투 절차를 현대적인 힙합 카운트다운 비트로 재해석했다. 로런스의 입회인(second)으로는 해밀턴이, 리의 입회인으로는 버가 나선다. 두 입회인은 유혈 사태를 막기 위해 협상을 시도하지만, 리의 사과 거부와 해밀턴의 완강한 태도로 결국 협상은 결렬되고 만다. 아침 해가 뜨기 전 강변에서 두 결투자는 등을 맞대고 열 걸음을 걸어 나간 뒤 방아쇠를 당긴다. 이 넘버는 훗날 해밀턴의 아들 필립의 비극적 결투와, 종막에서 펼쳐질 해밀턴과 버의 최후의 결투를 지배하는 치명적인 의식의 원형(archetype)을 보여준다.", "notes": ["'Code Duello'와 18세기 결투 문화 (The Code Duello): 1777년 아일랜드에서 제정된 뒤 전 유럽과 미국으로 확산된 '코드 뒤엘로'는 신사들 간의 분쟁을 해결하는 26개 조항의 결투 규약이었다. 결투의 목적은 살인이 아니라 '모욕당한 명예의 회복(satisfaction)'이었기에, 입회인(second) 간의 사전 화해 협상, 의사 동행, 새벽 시간 선택, 10보 거리 측정 등 극도로 정형화된 절차를 거쳤다.", "비기(Notorious B.I.G.)의 오마주와 랩 카운트다운: 1997년 노토리어스 B.I.G.의 전설적인 힙합 명곡 'Ten Crack Commandments'의 플로우와 비트, 카운트다운 구조('One, two, three, four, five, six, seven, eight, nine...')를 18세기 명예 결투에 완벽하게 치환했다. 린마누엘 미란다의 천재적인 힙합 오마주가 가장 돋보이는 트랙이다.", "의사의 '그럴듯한 부인권(Plausible Deniability)' 풍자: 4번 수칙('You have him turn around so he can have deniability')에서 의사에게 미리 진료비를 지불하고 등을 돌리게 하는 것은, 당시 결투가 법적으로 살인이나 살인미수로 처벌될 수 있었기 때문에 의사가 법정에서 '결투 현장을 직접 목격하지 못했다'고 증언할 수 있도록 법적 면책권을 부여하던 관행을 위트 있게 풍자한 것이다.", "버와 해밀턴의 대립과 종막을 향한 복선 (Foreshadowing the Final Duel): 결투를 미성숙하고 멍청한 짓이라 여기며 타협을 권하는 버와, 원칙과 명예에 있어 결코 물러서지 않는 해밀턴의 언쟁은 두 사람의 기질적 차이를 적나라하게 드러낸다. 특히 곡의 마지막 '열 걸음! 발사!'라는 카운트다운은 훗날 두 사람의 운명을 결정지을 결투의 비극적 복선이다."], "stanzas": [{"key": "15:1", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["One, two, three, four"], "lines_kr": ["하나, 둘, 셋, 넷"]}, {"key": "15:2", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Five, six, seven, eight, nine…"], "lines_kr": ["다섯, 여섯, 일곱, 여덟, 아홉…"]}, {"key": "15:3", "speaker_kr": "아론 버, 알렉산더 해밀턴, 존 로런스, 찰스 리", "speaker_en": "Aaron Burr, Alexander Hamilton, John Laurens, Charles Lee", "lines_en": ["It’s the Ten Duel Commandments"], "lines_kr": ["이것이 10가지 결투 수칙"]}, {"key": "15:4-5", "speaker_kr": "앙상블 전체", _kr": ["화해에 이르지 못했다면, 그것도 좋다", "권총을 준비하고 현장에 의사를 대동할 시간"]}, {"key": "15:20", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You pay him in advance, you treat him with civility"], "lines_kr": ["진료비는 미리 선불로 지불하고 깍듯이 예우하라"]}, {"key": "15:21", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["You have him turn around so he can have deniability"], "lines_kr": ["법적 책임을 부인할 수 있도록 의사의 등을 돌려 세워라"]}, {"key": "15:22", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Five!"], "lines_kr": ["다섯!"]}, {"key": "15:23", "speaker_kr": "찰스 리", "speaker_en": "Charles Lee", "lines_en": ["Duel before the sun is in the sky"], "lines_kr": ["하늘에 해가 뜨기 전에 결투를 치러라"]}, {"key": "15:24-25", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Pick a place to die where it’s high and dry", "Number six!"], "lines_kr": ["물기 없이 건조하고 지대 높은 곳을 죽을 자리로 택하라", "수칙 여섯!"]}, {"key": "15:26-27", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Leave a note for your next of kin", "Tell ‘em where you been. Pray that hell or heaven lets you in"], "lines_kr": ["가장 가까운 유족들에게 유서를 남겨라", "자네가 간 곳을 알리고, 천국이든 지옥이든 받아주길 기도하라"]}, {"key": "15:28", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Seven!"], "lines_kr": ["일곱!"]}, {"key": "15:29-30", "speaker_kr": "찰스 리", "speaker_en": "Charles Lee", "lines_en": ["Confess your sins. Ready for the moment", "Of adrenaline when you finally face your opponent"], "lines_kr": ["죄를 고백하라. 마침내 상대와 마주하여", "아드레날린이 온몸에 솟구치는 순간을 대비하라"]}, {"key": "15:31", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Number eight!"], "lines_kr": ["수칙 여덟!"]}, {"key": "15:32-33", "speaker_kr": "존 로런스, 찰스 리, 알렉산더 해밀턴, 아론 버", "speaker_en": "John Laurens, Charles Lee, Alexander Hamilton, Aaron Burr", "lines_en": ["Your last chance to negotiate", "Send in your seconds, see if they can set the record straight…"], "lines_kr": ["협상을 이끌어낼 마지막 기회", "입회인들을 보내 오해를 바로잡을 수 있는지 확인하라…"]}, {"key": "15:34", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Alexander"], "lines_kr": ["알렉산더"]}, {"key": "15:35", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Aaron Burr, sir"], "lines_kr": ["아론 버 선생"]}, {"key": "15:36", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Can we agree that duels are dumb and immature?"], "lines_kr": ["결투란 게 멍청하고 유치한 짓이라는 데 우리 동의할 수 있지 않나?"]}, {"key": "15:37-38", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sure", "But your man has to answer for his words, Burr"], "lines_kr": ["물론이지", "하지만 자네 쪽 인물은 자신이 뱉은 말에 책임을 져야 하네, 버"]}, {"key": "15:39", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["With his life? We both know that’s absurd, sir"], "lines_kr": ["목숨을 걸고 말인가? 그건 터무니없는 짓이란 걸 우리 둘 다 알잖나, 선생"]}, {"key": "15:40", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Hang on, how many men died because Lee was inexperienced and ruinous?"], "lines_kr": ["잠깐, 리의 무능과 파멸적인 후퇴 때문에 죽어나간 병사가 도대체 몇 명이었지?"]}, {"key": "15:41", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Okay, so we’re doin’ this"], "lines_kr": ["좋아, 결국 하자는 거군"]}, {"key": "15:42", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Number nine!"], "lines_kr": ["수칙 아홉!"]}, {"key": "15:43-44", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Look ‘em in the eye, aim no higher", "Summon all the courage you require.  Then count"], "lines_kr": ["상대의 두 눈을 응시하고, 가슴 위로 겨누지 마라", "필요한 모든 용기를 끌어모아라. 그리고 세어라"]}, {"key": "15:45-46", "speaker_kr": "남성 앙상블", "speaker_en": "Men", "lines_en": ["One two three four", "Five six seven eight nine"], "lines_kr": ["하나 둘 셋 넷", "다섯 여섯 일곱 여덟 아홉"]}, {"key": "15:47", "speaker_kr": "알렉산더 해밀턴, 아론 버", "speaker_en": "Alexander Hamilton, Aaron Burr", "lines_en": ["Number"], "lines_kr": ["마지막"]}, {"key": "15:48", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Ten paces!"], "lines_kr": ["열 걸음!"]}, {"key": "15:49", "speaker_kr": "알렉산더 해밀턴, 아론 버", "speaker_en": "Alexander Hamilton, Aaron Burr", "lines_en": ["Fire"], "lines_kr": ["발사"]}]}, {"id": 16, "act": 1, "title": "Meet Me Inside", "title_kr": "안으로 들어와", "characters_kr": ["조지 워싱턴", "아론 버", "존 로런스", "앙상블 전체", "알렉산더 해밀턴"], "characters_en": ["George Washington", "Aaron Burr", "John Laurens", "Company", "Alexander Hamilton"], "synopsis": "결투에서 로런스가 리의 옆구리에 총상을 입히며 결투가 종결된 직후, 결투 현장에 격노한 조지 워싱턴 총사령관이 들이닥치면서 벌어지는 갈등과 파국을 그린다. 워싱턴은 지휘부의 내분을 엄격히 금지한 자신의 명령을 정면으로 위반한 로런스와 해밀턴에게 분노하며 해밀턴에게 막사 안으로 들어오라고 명령한다('Meet me inside'). 막사 안에서 워싱턴이 해밀턴의 무모한 행동을 질책하며 '아들아(Son)'라고 부르자, 부친에게 버림받은 깊은 상처와 독자적인 명예욕으로 뭉쳐 있던 해밀턴은 '날 아들이라고 부르지 마십시오(Don’t call me son!)'라며 폭발한다. 해밀턴은 자신이 워싱턴의 서기로만 묶여 있어 전공(전쟁 공훈)을 세워 신분을 상승시킬 기회를 박탈당하고 있다고 울분을 토로한다. 끝내 선을 넘은 해밀턴에게 워싱턴은 즉각 군대를 떠나 집(뉴욕의 아내 일라이자)으로 돌아가라는 단호한 명령을 내린다.", "notes": ["부자(父子) 관계의 균열과 트라우마의 폭발 (Father-Son Dynamic & Trauma): 워싱턴은 해밀턴을 단순한 참모를 넘어 아들처럼 아끼고 보호하려 하지만, 어릴 적 아버지가 가족을 버리고 떠났던 해밀턴에게 '아들(Son)'이라는 호칭은 온정적인 부름이 아니라 자신을 미성숙하고 종속적인 존재로 격하시키는 모욕이자 트라우마의 뇌관으로 작용한다. 해밀턴의 격렬한 반발('Call me son one more time!')은 그의 깊은 자격지심과 독립심을 드러낸다.", "전공(Military Glory)에 대한 해밀턴의 집착과 신분 상승욕: 'I don’t have your name, your titles, your land... If you gave me command of a battalion... I could fly above my station after the war'라는 해밀턴의 절규는 그가 왜 그토록 목숨을 걸고 야전 지휘권을 갈망하는지 명확히 보여준다. 기득권 가문 출신이 아닌 그에게 전쟁 영웅이라는 타이틀만이 전후 미국 사회에서 신분적 한계를 뛰어넘을 유일한 사다리였기 때문이다.", "워싱턴의 대국적 현실감각과 생명 보호 (Washington’s Strategic Realism): 워싱턴은 전쟁의 본질이 개인의 명예나 혈기가 아니라 대의와 연합에 있음을 알기에 남부 출신 장군들과의 불화를 일으킨 결투를 호되게 꾸짖는다. 또한 '네 아내에게는 살아있는 네가 필요하다'며 해밀턴의 죽음을 무릅쓴 야망을 가로막고, 결국 그를 집으로 돌려보냄으로써 역설적으로 해밀턴의 목숨을 구하고 일라이자 곁으로 돌려보낸다.", "박진감 넘치는 스타카토 리듬과 극적 전환 (Staccato Delivery & Transition): 앙상블의 강박적인 외침('Meet him inside! Meet him inside!')과 짧고 날카로운 단문 대화의 충돌은 두 사람 간의 긴장감을 극대화한다. 이 격렬한 충돌 끝에 해밀턴이 군대를 떠나게 되면서, 다음 넘버인 'That Would Be Enough'의 서정적이고 가정적인 분위기로 자연스럽게 전환된다."], "stanzas": [{"key": "16:1", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Lee, do you yield?"], "lines_kr": ["리, 항복하겠나?"]}, {"key": "16:2-3", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["You shot him in the side!", "Yes, he yields!"], "lines_kr": ["자네들이 그자의 옆구리를 쐈잖아!", "그래, 항복이야!"]}, {"key": "16:4", "speaker_kr": "존 로런스", "speaker_en": "John Laurens", "lines_en": ["I’m satisfied"], "lines_kr": ["난 만족했네"]}, {"key": "16:5", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Yo, we gotta clear the field!"], "lines_kr": ["야, 우리 당장 현장에서 벗어나야 해!"]}, {"key": "16:6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Go! We won"], "lines_kr": ["가게! 우리가 이겼어"]}, {"key": "16:7", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Here comes the General!"], "lines_kr": ["총사령관님이 오신다!"]}, {"key": "16:8", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["This should be fun"], "lines_kr": ["이거 참 볼만하겠군"]}, {"key": "16:9-10", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["What is the meaning of this?", "Mr. Burr? get a medic for the General"], "lines_kr": ["이게 대체 무슨 짓들인가?", "버 중령? 장군에게 군의관을 데려오게"]}, {"key": "16:11", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Yes, sir"], "lines_kr": ["옛, 각하"]}, {"key": "16:12-14", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Lee, you will never agree with me", "But believe me, these young men don’t speak for me", "Thank you for your service"], "lines_kr": ["리 장군, 자넨 나와 결코 뜻이 맞지 않을 테지만", "믿어주게, 이 젊은 혈기들이 내 뜻을 대변한 것은 아니네", "그동안의 노고에 감사하네"]}, {"key": "16:15", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["Let’s ride!"], "lines_kr": ["말을 몰아라!"]}, {"key": "16:16", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Hamilton!"], "lines_kr": ["해밀턴!"]}, {"key": "16:17", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir!"], "lines_kr": ["각하!"]}, {"key": "16:18", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Meet me inside"], "lines_kr": ["안으로 들어오게"]}, {"key": "16:19-20", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Meet him inside! Meet him inside!", "Meet him inside, meet him, meet him inside!"], "lines_kr": ["안으로 들어가! 안으로 들어가!", "안으로 들어가, 들어가, 막사 안으로 들어가!"]}, {"key": "16:21", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Son—"], "lines_kr": ["아들아—"]}, {"key": "16:22", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Don’t call me son"], "lines_kr": ["절 아들이라 부르지 마십시오"]}, {"key": "16:23", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["This war is hard enough without infighting—"], "lines_kr": ["내분 없이도 이 전쟁은 버티기 벅차다—"]}, {"key": "16:24", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Lee called you out. We called his bluff"], "lines_kr": ["리가 각하를 모욕했고, 우린 그 허세를 꺾었을 뿐입니다"]}, {"key": "16:25", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["You solve nothing, you aggravate our allies to the south"], "lines_kr": ["해결된 건 아무것도 없다, 남부의 아군들만 자극했을 뿐이지"]}, {"key": "16:26-27", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You're absolutely right, John should have shot him in the mouth", "That would’ve shut him up"], "lines_kr": ["각하 말씀이 백번 맞습니다, 존이 그놈 주둥이를 쐈어야 했는데 말입니다", "그랬다면 닥치게 만들었을 텐데요"]}, {"key": "16:28", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Son—"], "lines_kr": ["아들아—"]}, {"key": "16:29", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’m notcha son—"], "lines_kr": ["전 각하의 아들이 아닙니다—"]}, {"key": "16:30-31", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Watch your tone", "I am not a maiden in need of defending, I am grown"], "lines_kr": ["말조심하게", "난 지켜줘야 할 처녀가 아니다, 다 큰 어른이야"]}, {"key": "16:32-34", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Charles Lee, Thomas Conway", "These men take your name and they rake it", "Through the mud"], "lines_kr": ["찰스 리, 토머스 콘웨이", "이 자들은 각하의 존함을 입에 올리며", "진흙탕에 내팽개쳐 짓밟고 있습니다"]}, {"key": "16:35", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["My name’s been through a lot, I can take it"], "lines_kr": ["내 이름은 온갖 풍파를 겪어왔다, 난 견뎌낼 수 있어"]}, {"key": "16:36-38", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Well, I don’t have your name. I don’t have your titles", "I don’t have your land", "But, if you—"], "lines_kr": ["하지만 전 각하 같은 명성도 없고, 각하 같은 작위도 없습니다", "제겐 각하 같은 영지도 없고요", "하지만, 만약 각하께서—"]}, {"key": "16:39", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["No—"], "lines_kr": ["안 돼—"]}, {"key": "16:40", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["If you gave me command of a battalion, a group of men to lead, I could fly above my station after the war"], "lines_kr": ["제게 대대 지휘권을, 통솔할 병력을 맡겨주셨다면, 전후에 제 비천한 신분을 넘어 비상할 수 있었을 텐데요"]}, {"key": "16:41", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Or you could die and we need you alive"], "lines_kr": ["아니면 자네가 전사할 수도 있지, 우리에겐 살아서 일할 자네가 필요하다"]}, {"key": "16:42", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["I’m more than willing to die—"], "lines_kr": ["전 기꺼이 목숨을 바칠 각오가 되어 있습니다—"]}, {"key": "16:43", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Your wife needs you alive, son, I need you alive—"], "lines_kr": ["자네 아내에겐 살아있는 자네가 필요해, 아들아, 내게도 자네가 살아야만 해—"]}, {"key": "16:44", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Call me son one more time—"], "lines_kr": ["한 번만 더 날 아들이라고 부르시면—"]}, {"key": "16:45-46", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Go home, Alexander", "That’s an order from your commander"], "lines_kr": ["집으로 돌아가게, 알렉산더", "총사령관으로서의 명령이다"]}, {"key": "16:47", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Sir—"], "lines_kr": ["각하—"]}, {"key": "16:48", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["Go home"], "lines_kr": ["집으로 가라"]}]}, {"id": 17, "act": 1, "title": "That Would be Enough", "title_kr": "그것만으로도 충분해요", "characters_kr": ["알렉산더 해밀턴", "일라이자 스카일러"], "characters_en": ["Alexander Hamilton", "Eliza Schuyler"], "synopsis": "워싱턴 장군과의 격렬한 언쟁 끝에 참모직에서 해임되어 전선에서 물러나 집으로 돌아온 알렉산더 해밀턴. 불명예와 무기력감, 그리고 카리브해 빈민 고아 출신으로서 처가와 아내를 제대로 부양하지 못할 것이라는 깊은 자격지심에 사로잡힌 해밀턴에게, 아내 일라이자는 첫 아이(필립)의 임신 소식을 전합니다. 일라이자는 끝없는 명예와 전장에서의 영광, 거창한 유산(legacy)에 집착하는 남편에게 살아 숨 쉬는 것 자체의 경이로움과 소박한 가정의 행복을 일깨우며, '그저 곁에 살아만 있어 준다면 그것만으로도 충분하다(Just stay alive, that would be enough)'고 간절히 노래합니다. 안젤리카의 끝없는 갈망('Satisfied')과 대비되는 일라이자의 헌신적이고 무조건적인 사랑이 빛을 발하는 가장 따뜻하고 서정적인 발라드 넘버입니다.", "notes": ["모티프의 극적 대위법 ('That Would Be Enough' vs 'Satisfied'): 1막 전반부를 지배하는 안젤리카의 'Satisfied'('He will never be satisfied')에 대한 일라이자의 철학적 응답입니다. 끝없는 결핍과 야망으로 스스로를 불태우는 해밀턴에게, 일라이자는 외적인 성취나 불멸의 명예가 아닌 '함께 살아 숨 쉬는 존재 그 자체'에서 궁극의 충만함을 찾자고 설득합니다.", "'Look around, look around' 라이트모티프의 감정적 심화: 5번 트랙 'The Schuyler Sisters'에서 활기찬 뉴욕 거리와 혁명의 태동을 보며 희망차게 불렀던 세 자매의 경쾌한 멜로디가, 여기서는 가정의 평화와 소중한 생명, 삶에 대한 깊은 감사를 노래하는 따뜻하고 묵직한 하모니로 변주됩니다.", "해밀턴의 출생 트라우마와 자격지심: 카리브해의 가난한 사생아 출신인 해밀턴은 지위와 군사적 영예를 잃으면 명문가 출신의 아내에게 아무것도 해줄 수 없다는 깊은 불안감('Will you relish being a poor man’s wife / Unable to provide for your life?')을 드러냅니다. 일라이자는 그가 살아남아 여기까지 도달한 것 자체가 이미 기적임을 상기시키며 그의 상처를 보듬습니다.", "'Let me be a part of the narrative'의 장대한 서사적 복선: 일라이자가 노래하는 '훗날 사람들이 쓰게 될 이야기의 일부가 되게 해달라'는 소망은, 2막에서 해밀턴의 외도로 상처받아 스스로를 역사에서 지워버리는 'Burn'과, 해밀턴 사후 50년 동안 남편의 업적과 동료들의 기록을 복원하며 결국 그의 서사를 완성하는 최종 피날레 넘버 'Who Lives, Who Dies, Who Tells Your Story'로 이어지는 거대한 수미상응 복선을 형성합니다."], "stanzas": [{"key": "17:1-3", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["Look around, look around at how lucky we are", "To be alive right now", "Look around, look around…"], "lines_kr": ["둘러봐요, 둘러봐요, 우리가 얼마나 운이 좋은지", "지금 이렇게 살아 숨 쉰다는 게", "둘러봐요, 둘러봐요…"]}, {"key": "17:4", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["How long have you known?"], "lines_kr": ["언제부터 알고 있었어?"]}, {"key": "17:5", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["A month or so"], "lines_kr": ["한 달쯤 전부터요"]}, {"key": "17:6", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Eliza, you should have told me"], "lines_kr": ["일라이자, 내게 말했어야지"]}, {"key": "17:7", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I wrote to the General a month ago"], "lines_kr": ["한 달 전에 장군님께 편지를 썼어요"]}, {"key": "17:8", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["No"], "lines_kr": ["안 돼"]}, {"key": "17:9", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I begged him to send you home"], "lines_kr": ["당신을 집으로 돌려보내 달라고 간청했어요"]}, {"key": "17:10", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["You should have told me"], "lines_kr": ["내게 말을 했어야지"]}, {"key": "17:11-15", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I’m not sorry", "I knew you’d fight until the war was won", "But you deserve a chance to meet", "Your son", "Look around, look around at how lucky we are to be alive right now."], "lines_kr": ["후회하지 않아요", "전쟁에서 이길 때까지 당신이 싸울 걸 알았지만", "당신도 만날 자격이 있어요", "당신의 아들을", "둘러봐요, 둘러봐요, 지금 우리가 살아있다는 게 얼마나 큰 행운인지."]}, {"key": "17:16-17", "speaker_kr": "알렉산더 해밀턴", "speaker_en": "Alexander Hamilton", "lines_en": ["Will you relish being a poor man’s wife", "Unable to provide for your life?"], "lines_kr": ["가난뱅이의 아내로 사는 것도 즐거울까", "당신의 삶조차 책임지지 못하는 무능한 자의 아내로?"]}, {"key": "17:18-45", "speaker_kr": "일라이자 스카일러", "speaker_en": "Eliza Schuyler", "lines_en": ["I relish being your wife", "Look around, look around…", "Look at where you are", "Look at where you started", "The fact that you’re alive is a miracle", "Just stay alive, that would be enough", "And if this child", "Shares a fraction of your smile", "Or a fragment of your mind, look out world!", "That would be enough", "I don’t pretend to know", "The challenges you’re facing", "The worlds you keep erasing and creating in your mind", "But I’m not afraid", "I know who I married", "So long as you come home at the end of the day", "That would be enough", "We don’t need a legacy", "We don’t need money", "If I could grant you peace of mind", "If you could let me inside your heart…", "Oh, let me be a part of the narrative", "In the story they will write someday", "Let this moment be the first chapter:", "Where you decide to stay", "And I could be enough", "And we could be enough", "That would be enough"], "lines_kr": ["난 당신의 아내라는 게 더없이 기뻐요", "둘러봐요, 둘러봐요…", "당신이 지금 어디에 서 있는지 봐요", "당신이 어디에서 시작했는지 봐요", "당신이 살아있다는 사실 자체가 기적인걸요", "그저 살아만 있어줘요, 그것만으로도 충분해요", "그리고 이 아이가", "당신의 미소를 조금이라도 닮는다면", "당신의 명석함을 조금이라도 닮는다면, 세상이여 긴장하라!", "그것만으로도 충분해요", "다 안다고 하진 않을게요", "당신이 마주한 그 수많은 도전들을", "머릿속에서 끊임없이 지우고 새로 만들어내는 그 세상들을", "하지만 난 두렵지 않아요", "내가 누구와 결혼했는지 아니까요", "하루가 끝날 때 당신이 집으로 돌아와 주기만 한다면", "그것만으로도 충분해요", "거창한 유산 따윈 필요 없어요", "돈도 필요 없어요", "당신의 마음에 평안을 줄 수 있다면", "당신의 마음에 나를 들여보내 준다면…", "오, 그 이야기의 일부가 되게 해줘요", "훗날 사람들이 쓰게 될 그 이야기 속에서", "지금 이 순간이 첫 장이 되게 해줘요:", "당신이 곁에 머물기로 결심한 바로 그 첫 장", "나라는 사람으로도 충분하고", "우리라는 것만으로도 충분하기를", "그것만으로도 충분해요"]}]}, {"id": 18, "act": 1, "title": "Guns and Ships", "title_kr": "총과 전함", "characters_kr": ["마르키 드 라파예트", "앙상블 전체", "조지 워싱턴", "아론 버"], "characters_en": ["Marquis de Lafayette", "Company", "George Washington", "Aaron Burr"], "synopsis": "독립 전쟁이 장기화되며 보급난과 열세로 대륙군이 한계에 직면한 상황에서, 마르키 드 라파예트가 프랑스로 건너가 루이 16세와 베르사유 조정을 설득하여 프랑스 정예 육군(로샹보 장군)과 막강한 해군 함대, 그리고 막대한 군자금을 끌어오는 결정적인 외교적·군사적 대승을 거둡니다. 전세를 뒤집을 '총과 전함(Guns and Ships)'을 이끌고 금의환향한 라파예트는, 요크타운에서 승리를 완성하기 위해서는 참호전의 전술적 식견과 유창한 프랑스어를 겸비한 알렉산더 해밀턴의 현장 복귀가 필수적이라며 워싱턴을 강하게 압박합니다. 워싱턴은 마침내 해밀턴에게 야전 지휘권을 보장하는 서한을 보내며 그를 자신의 '오른팔'로 다시 전장에 소환합니다.", "notes": ["브로드웨이 역사상 최고속 랩 (Lafayette's 19 words in 3 seconds): 라파예트가 선보이는 랩 구간은 분당 약 200단어의 속도로 전개되며, 특히 'I’m takin this horse by the reins makin’ redcoats redder with bloodstains...' 대목에서는 단 3초 만에 19단어를 완벽한 딕션으로 쏟아냅니다. 1막 초반 영어에 서툴렀던 프랑스 귀족 청년 라파예트가 마침내 혁명군 최고의 전사이자 전략가로 눈부시게 성장했음을 청각적으로 완벽히 증명하는 장면입니다.", "현란한 다중 각운과 내부 라임 (Multisyllabic & Internal Rhymes): 'reins makin'' / 'bloodstains', 'Drop and burn 'em up and scatter their remains', 'engagin’ em' / 'Escapin’ em' / 'Enragin’ em', 그리고 'trench' / 'French' / 'bench', 'resilience' / 'practical tactical brilliance' 등 린마누엘 미란다 특유의 정교한 라임 설계가 폭포수처럼 쏟아지며 극도의 리듬감과 카타르시스를 만들어냅니다.", "결정적 역사적 전환점: 프랑스 동맹군과 요크타운 포위 작전: 드 그라스 백작이 이끄는 프랑스 해군이 체서피크만 해전에서 영국 함대를 격퇴하여 바닷길을 차단하고, 로샹보 백작(Rochambeau) 휘하의 프랑스 육군이 워싱턴의 대륙군과 연합하여 요크타운의 콘월리스 군을 포위한 실제 역사적 상황('We rendezvous with Rochambeau, consolidate their gifts / We can end this war at Yorktown, cut them off at sea')을 압축적으로 담아냈습니다.", "'Right Hand Man' 테마의 귀환과 역할 전환: 8번 넘버 'Right Hand Man'에서 워싱턴이 해밀턴을 행정 비서관으로 영입했던 관계가, 여기서는 라파예트의 중재와 전황의 절박함 속에서 독립 전쟁의 승패를 결정지을 선봉 야전 지휘관으로서의 '오른팔'로 해밀턴을 재기용하는 역동적인 반전을 이룹니다."], "stanzas": [{"key": "18:1-8", "speaker_kr": "아론 버", "speaker_en": "Aaron Burr", "lines_en": ["How does a ragtag volunteer army in need of a shower", "Somehow defeat a global superpower?", "How do we emerge victorious from the quagmire?", "Leave the battlefield waving Betsy Ross’ flag higher?", "Yo. Turns out we have a secret weapon!", "An immigrant you know and love who’s unafraid to step in!", "He’s constantly confusin’, confoundin’ the British henchmen", "Ev’ryone give it up for America’s favorite fighting Frenchman!"], "lines_kr": ["씻지도 못해 땀내 나는 오합지졸 의용군이", "어찌하여 세계 최강의 슈퍼파워를 꺾을 수 있겠는가?", "어떻게 우리가 이 진흙탕 수렁에서 승리할 수 있을까?", "베시 로스의 성조기를 더 높이 흔들며 전장을 떠날 수 있을까?", "요. 알고 보니 우리에겐 비밀 병기가 있었지!", "당신들이 알고 사랑하는, 앞장서길 두려워 않는 이민자!", "영국의 졸개들을 끊임없이 혼란에 빠뜨리고 당황시키는 그 사람", "모두가 환호하라, 미국이 가장 사랑하는 싸우는 프랑스인을 위하여!"]}, {"key": "18:9", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Lafayette!"], "lines_kr": ["라파예트!"]}, {"key": "18:10-11", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["I’m takin this horse by the reins makin’", "Redcoats redder with bloodstains"], "lines_kr": ["고삐를 틀어쥐고 말을 몰아 달려가", "붉은 코트를 핏자국으로 더 붉게 물들여"]}, {"key": "18:12", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Lafayette!"], "lines_kr": ["라파예트!"]}, {"key": "18:13-14", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["And I’m never gonna stop until I make ‘em", "Drop and burn ‘em up and scatter their remains, I’m"], "lines_kr": ["절대 멈추지 않아, 놈들을 모조리", "쓰러뜨려 불태우고 그 유골을 흩뿌릴 때까지, 난"]}, {"key": "18:15", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Lafayette!"], "lines_kr": ["라파예트!"]}, {"key": "18:16", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["Watch me engagin’ em! Escapin’ em!  Enragin’ em! I’m—"], "lines_kr": ["적과 맞붙고! 빠져나가고! 약을 올려 격분시키지! 난—"]}, {"key": "18:17", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Lafayette!"], "lines_kr": ["라파예트!"]}, {"key": "18:18", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["I go to France for more funds"], "lines_kr": ["군자금을 더 얻으러 프랑스로 건너가"]}, {"key": "18:19", "speaker_kr": "앙상블 전체", "speaker_en": "Company", "lines_en": ["Lafayette!"], "lines_kr": ["라파예트!"]}, {"key": "18:20", "speaker_kr": "마르키 드 라파예트", "speaker_en": "Marquis de Lafayette", "lines_en": ["I come back with more"], "lines_kr": ["더 많은 걸 싣고 돌아오지"]}, {"key": "18:21-23", "speaker_kr": "마르키 드 라파예트, 앙상블 전체", "speaker_en": "Marquis de Lafayette, Company", "lines_en": ["Guns", "And ships", "And so the balance shifts"], "lines_kr": ["총들과", "전함들", "그리하여 전세의 추가 기울지"]}, {"key": "18:24", "speaker_kr": "조지 워싱턴", "speaker_en": "George Washington", "lines_en": ["We rendezvous with Rochambeau, consolidate their gifts"], "lines_kr": ["우린 로샹보와 합류하여, 그들의 지원을 하나로 모은다"]}, {"key":
