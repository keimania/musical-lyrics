<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뮤지컬 식스(SIX) 전 11곡 영한 대역 콘서트 뷰어</title>
  <style>
    :root {
      --bg: #0c0914;
      --card-bg: #151124;
      --neon-pink: #ff1493;
      --neon-gold: #ffd700;
      --neon-green: #00ff7f;
      --neon-blue: #00bfff;
      --neon-red: #ff3366;
      --neon-silver: #e6e6fa;
      --purple-accent: #9b51e0;
      --text: #f5f5f7;
      --text-muted: #a39eb8;
      --border: #292042;
      --hover: #221a38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    #sidebar {
      width: 320px;
      background: #110d1c;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      background: #0d0a17;
      text-align: center;
    }
    .sidebar-header h1 {
      font-size: 1.4rem;
      background: linear-gradient(45deg, #ff1493, #ffd700, #00bfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .sidebar-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #1b152b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--neon-pink); }
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .song-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: #161224;
    }
    .song-item:hover {
      background: var(--hover);
      border-color: rgba(255, 20, 147, 0.3);
    }
    .song-item.active {
      background: rgba(255, 20, 147, 0.15);
      border-color: var(--neon-pink);
    }
    .song-num {
      font-size: 0.75rem;
      color: var(--neon-gold);
      font-weight: 700;
    }
    .song-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
    }
    .song-title-kr {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Main Content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .top-bar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: #110d1c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .view-btn {
      padding: 6px 14px;
      background: #1d172e;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: var(--neon-pink);
      color: #fff;
      font-weight: 700;
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
    }
    .song-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .song-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .song-header h2 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 800;
    }
    .song-header h2 .kr-title {
      color: var(--neon-gold);
      margin-left: 10px;
      font-size: 1.3rem;
      font-weight: 600;
    }
    .synopsis-box {
      background: var(--card-bg);
      border-left: 4px solid var(--neon-pink);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .notes-box {
      background: #140e24;
      border: 1px solid #332057;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }
    .notes-box h4 {
      font-size: 0.9rem;
      color: #00bfff;
      margin-bottom: 10px;
    }
    .notes-box ul {
      padding-left: 20px;
      font-size: 0.86rem;
      color: #c4bfd6;
    }
    .notes-box li {
      margin-bottom: 6px;
    }
    /* Stanzas */
    .stanza-block {
      margin-bottom: 24px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .speaker-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ff69b4;
      background: rgba(255, 105, 180, 0.15);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 105, 180, 0.3);
    }
    .lyric-pair {
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .lyric-en {
      font-weight: 700;
      color: #ffffff;
      font-size: 0.96rem;
    }
    .lyric-kr {
      color: #8be9fd;
      font-size: 0.92rem;
      margin-top: 2px;
    }
    .mode-kr-only .lyric-en { display: none; }
    .mode-en-only .lyric-kr { display: none; }

    /* Navigation & Mobile Drawer */
    .nav-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-gold);
      text-decoration: none;
      font-size: 0.82rem;
      margin-bottom: 8px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .nav-home-link:hover { opacity: 1; text-decoration: underline; }
    .mobile-nav-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #0d0a17;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu-btn {
      background: rgba(255, 20, 147, 0.15);
      border: 1px solid var(--neon-pink);
      color: #ff69b4;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 998;
    }
    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      float: right;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .mobile-nav-bar {
        display: flex;
      }
      .sidebar-close-btn {
        display: block;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 82%;
        max-width: 320px;
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: 4px 0 24px rgba(0,0,0,0.8);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .top-bar {
        padding: 10px 14px;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .view-toggles {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      .view-btn {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        font-size: 0.75rem;
      }
      .song-content {
        padding: 20px 16px;
      }
      .song-header h2 {
        font-size: 1.35rem;
      }
      .song-header h2 .kr-title {
        display: block;
        margin-left: 0;
        margin-top: 4px;
        font-size: 1.05rem;
      }
      .lyric-en {
        font-size: 0.92rem;
      }
      .lyric-kr {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
      <a href="../index.html" class="nav-home-link">← 라이브러리 홈</a>
      <h1>★ SIX ★</h1>
      <p>전 11곡 영한 대역 콘서트 뷰어</p>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목, 왕비, 가사 검색..." oninput="renderSongList()">
    </div>
    <div class="song-list" id="songListContainer"></div>
  </div>

  <div id="main">
    <div class="mobile-nav-bar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ 넘버 목록</button>
      <a href="../index.html" class="nav-home-link" style="margin:0;">🏠 라이브러리 홈</a>
    </div>
    <div class="top-bar">
      <div style="font-size: 0.85rem; color: var(--neon-gold);" id="topBarTrackInfo">Track 01 of 11</div>
      <div class="view-toggles">
        <button class="view-btn active" id="btnBilingual" onclick="setViewMode('bilingual')">영한 대역</button>
        <button class="view-btn" id="btnKr" onclick="setViewMode('kr')">한국어만</button>
        <button class="view-btn" id="btnEn" onclick="setViewMode('en')">English Only</button>
      </div>
    </div>
    <div class="song-content" id="songContent"></div>
  </div>

  <script>

l", "Suddenly see more..."], "lines_kr": ["갓 낳은 내 아들을 품에 안고서", "난 숨을 거뒀지, 하지만 난 보이는 게 다가 아니야", "아니, 과연 그럴까?", "끝까지 곁을 지키며 지켜보면", "시모어의 숨겨진 모습을 더 많이 보게 될걸..."]}, {"key": "1:43", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Divorced"], "lines_kr": ["이혼!"]}, {"key": "1:44", "speaker_kr": "클레페의 앤", "speaker_en": "Anna of Cleves", "lines_en": ["Ich bin Anna of Cleves"], "lines_kr": ["이히 빈 클레페의 아나!"]}, {"key": "1:45", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Ja"], "lines_kr": ["야!"]}, {"key": "1:46", "speaker_kr": "클레페의 앤", "speaker_en": "Anna of Cleves", "lines_en": ["When he saw my portrait he was like..."], "lines_kr": ["왕이 내 초상화를 처음 봤을 땐 이랬지..."]}, {"key": "1:47", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Jaa"], "lines_kr": ["야아~!"]}, {"key": "1:48", "speaker_kr": "클레페의 앤", "speaker_en": "Anna of Cleves", "lines_en": ["But I didn't look as good", "As I did in my pic", "Funny how we all discuss that", "But never Henry's little..."], "lines_kr": ["하지만 실물이 초상화 속 얼굴만큼", "썩 대단하진 않았던 모양이야", "다들 내 얼굴 씹어대는 덴 침 튀기면서", "헨리 놈의 보잘것없는 쬐끄만 거시기는..."]}, {"key": "1:49", "speaker_kr": "캐서린 하워드", "speaker_en": "Katherine Howard", "lines_en": ["Prick up your ears, I'm the Katherine", "Who lost her head"], "lines_kr": ["귓구멍 활짝 열어봐, 난 목이 잘려나간", "바로 그 캐서린 하워드니까!"]}, {"key": "1:50", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Beheaded"], "lines_kr": ["참수!"]}, {"key": "1:51", "speaker_kr": "캐서린 하워드", "speaker_en": "Katherine Howard", "lines_en": ["For my promiscuity outside of wed", "Lock up your husbands", "Lock up your sons", "K Howard is here", "And the fun's begun"], "lines_kr": ["결혼 생활 밖에서 문란하게 놀아났다는 죄목으로 말이야", "너희 남편들 문단속 단단히 해", "너희 아들들도 꽁꽁 숨겨둬", "케이 하워드가 납셨으니", "이제 진짜 화끈한 판이 벌어졌거든!"]}, {"key": "1:52", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Survived"], "lines_kr": ["생존!"]}, {"key": "1:53", "speaker_kr": "캐서린 파", "speaker_en": "Catherine Parr", "lines_en": ["Five down, I'm the final wife", "I saw him to the end of his life", "I'm the survivor, Catherine Parr", "I bet you wanna know how I got this far", "I said I bet you wanna know", "How we got this far"], "lines_kr": ["다섯 명이 나가떨어지고, 내가 마지막 아내야", "헨리의 숨이 끊어지는 마지막 순간까지 곁을 지켰지", "난 유일한 생존자, 캐서린 파", "내가 어떻게 여기까지 살아남았는지 궁금해 미치겠지?", "다들 분명 몹시 알고 싶을 거야", "우리가 어떻게 여기까지 버텨왔는지!"]}, {"key": "1:54", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Do you wanna know how we got this far?", "Then welcome to the show", "To the historemix", "Switching up the flow", "As we add the prefix", "Everybody knows that", "We used to be six wives", "Get your hands up", "Get this party buzzing", "You want a queen Bee", "Well there's half a dozen", "Everybody knows that", "We used to be six wives", "But now we're ex-wives!", "One", "Two", "Three", "Four", "Five", "SIX!", "Last Update: March, 18th 2025"], "lines_kr": ["우리가 어떻게 여기까지 왔는지 알고 싶어?", "그렇다면 이 화려한 쇼에 온 걸 환영해", "역사를 뒤흔드는 히스토리믹스에!", "비트의 흐름을 완전히 뒤집고", "'전(Ex)'이라는 접두사를 턱 붙여주지", "온 세상이 다 알다시피", "우린 한때 여섯 명의 아내였지만", "모두 두 손을 머리 위로 올려", "이 파티장을 뜨겁게 달궈봐", "여왕벌 퀸 비를 원했어?", "여기 반 다스, 여섯 명이나 준비돼 있잖아!", "세상 사람 모두가 다 알지", "우리가 한때 여섯 왕비였다는 걸", "하지만 이젠 당당한 전처들이야!", "원!", "투!", "쓰리!", "포!", "파이브!", "식스!", "최종 업데이트: 2025년 3월 18일"]}]}, {"id": 2, "title": "Ex-Wives (Reprise)", "title_kr": "전 부인들 (리프라이즈)", "synopsis": "화려한 오프닝 넘버 'Ex-Wives' 직후, 첫 번째 솔로 주자인 아라곤의 캐서린의 'No Way'로 이어지는 약 30초 분량의 콤팩트하고 폭발적인 브릿지 넘버. 여섯 왕비 간의 잔혹하면서도 유쾌한 솔로 리드보컬 쟁탈전(경연)의 룰을 관객에게 재차 각인시키며 무대의 열기를 극한으로 끌어올린다. 왕관을 쓸 단 한 명의 '팝 센세이션'이 되기 위해 여섯 전처들이 왕실 대관식(Coronation)을 빌미로 서바이벌 오디션의 무대에 올랐음을 선포하며 긴장감 넘치는 배틀의 막을 연다.", "notes": ["무대 기능적 역할 및 스튜디오 앨범 제외 사유: 러닝타임이 채 40초가 되지 않는 매우 짧은 전환곡으로, 풀 넘버 오프닝의 잔열을 모아 첫 솔로인 아라곤에게 무대의 지휘봉을 완벽하게 넘겨주는 핸드오프(hand-off) 역할을 수행한다. 독립적인 곡이라기보다는 극적 전환을 위한 인털루드 성격이 강하여 오리지널 런던 캐스트 레코딩(스튜디오 앨범) 트랙리스트에서는 제외되었으나, 라이브 공연에서는 배틀의 긴장감을 불어넣는 필수적인 넘버다.", "리얼리티 오디션 쇼의 패러디와 '대관식(Coronation)': 영국의 유서 깊은 왕실 대관식과 현대 서바이벌 오디션 프로그램(엑스 팩터, 보이스 등)의 우승자 대관식을 절묘하게 결합했다. 왕비들의 개인적이고 비극적인 역사적 트라우마를 대중의 오락거리이자 서바이벌 투표의 수단으로 소비하는 현대 미디어 문화를 신랄하게 풍자한다.", "보컬 텐션과 콜앤리스폰스(Call & Response): 오프닝의 메인 테마 멜로디를 응축하여 빠르고 긴박한 템포 속에서 칼 같은 화음과 콜앤리스폰스를 주고받으며 관객의 몰입도를 최고조로 끌어올린다. 이어지는 아라곤의 라틴 브라스 비트와 절묘하게 맞물리며 폭발력을 배가시킨다."], "stanzas": [{"key": "2:1", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Moment in the show: Immediately after the full “Ex-Wives,” just before “No Way”", "What it does onstage: A 30-second recap and hand-off to Aragon’s solo", "Why it never made the cast album: Too short (under 40 s) to justify a studio cut"], "lines_kr": ["극 중 시점: “Ex-Wives” 완곡 직후, “No Way” 시작 직전", "무대 위 역할: 30초 분량의 전개 요약 및 아라곤의 첫 솔로 넘버로의 전환", "캐스트 앨범에 실리지 못한 이유: 40초 미만으로 너무 짧아 스튜디오 트랙 수록에서 제외됨"]}, {"key": "2:2", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Welcome to the show", "To the coronation", "Who will take the crown", "Be the pop sensation?", "Everybody knows that?we?used to be?six wives (Six wives)", "Six wives (Six?wives)", "Six wives", "Last Update: June, 29th 2025"], "lines_kr": ["화려한 쇼에 온 걸 환영해", "진정한 여왕의 대관식에!", "과연 누가 왕관을 차지하고", "최고의 팝 센세이션이 될 것인가?", "모두 알다시피 우린 한때 여섯 명의 아내였지 (여섯 명의 아내)", "여섯 명의 아내 (여섯 명의 아내)", "여섯 아내들이었어!", "최종 업데이트: 2025년 6월 29일"]}]}, {"id": 3, "title": "No Way", "title_kr": "어림없지", "synopsis": "헨리 8세의 첫 번째 왕비이자 24년간 잉글랜드의 국모 자리를 지켰던 스페인 공주 출신의 아라곤의 캐서린이 부르는 당당하고 거침없는 라틴 팝 넘버. 헨리 8세가 젊은 앤 불린과 결혼하기 위해 교황청과 온갖 신학적 억지를 끌어들여 혼인 무효(이혼)를 요구하고 자신을 외딴 수녀원에 강제로 유폐시키려 하자, 캐서린은 정면으로 맞서 결코 물러서지 않겠다고 단언한다. 스페인 명문 가문의 자긍심과 독실한 가톨릭 신앙, 24년간 왕국에 헌신한 정통 국모로서의 위엄을 현대의 거침없고 파워풀한 라틴 디바의 에너지로 폭발시키며, '절대 안 돼(No Way)'라는 결연한 거부로 무대를 압도한다.", "notes": ["음악적 영감 (비욘세 & 샤키라): 비욘세(Beyoncé)의 대표곡 'Single Ladies'와 'Run the World'에서 느껴지는 압도적인 걸크러시 R&B 스웨거와, 샤키라(Shakira) 특유의 플라멩코풍 라틴 팝 리듬 및 화려한 보컬 런(trill)을 완벽히 결합했다. 화려한 금빛 의상과 함께 당당하게 무대를 장악하며 관객을 열광의 도가니로 몰아넣는다.", "블랙프라이어스 재판(Blackfriars Trial)의 역사적 재현: 1529년 런던 블랙프라이어스에서 열린 교황 법정에서 캐서린이 헨리 8세의 발치에 무릎을 꿇고 자신의 결백과 처녀성을 눈물로 호소했던 역사적 장면('You've got me down on my knees n-Z) 팝 펑크 틴에이저로 등장한다. 그저 인생을 신나게 즐기고 춤추고 노래하고 싶었을 뿐인데, 정신을 차려보니 국왕과 연애를 하고 교황청을 박살 내며 영국 성공회를 탄생시켰고, 끝내 단두대에서 목이 잘리게 되었다는 기상천외한 사연을 뻔뻔하면서도 사랑스럽게 노래한다.", "notes": ["음악적 영감 (에이브릴 라빈 & 릴리 알렌): 에이브릴 라빈(Avril Lavigne)의 발랄하고 반항기 넘치는 팝 펑크 스케이터 감성과 릴리 알렌(Lily Allen) 특유의 새침하고 상큼하면서도 가사는 독설과 풍자로 가득 찬 브릿팝 스타일을 교묘하게 배합했다. 경쾌한 업템포 리듬과 키치한 전자음 위로 쉴 새 없이 터져 나오는 앤의 뻔뻔한 애티튜드가 백미다.", "현대 인터넷 밈(Meme)과 16세기 궁정 스캔들의 결합: 가사 전체가 현대의 문자 메시지와 SNS 신조어로 도배되어 있다. 'Messaging me like every day', 'XO baby(포옹과 뽀뽀)', 'LOL(ㅋㅋㅋ)', 'Epic fail(완전 쌉망함)', 'Your comment went viral(너의 악플이 전국에 바이럴 탔어)', 'Totes God's will(완전 하느님의 뜻이지)', 'jel(jealous, 질투하는)' 등 현대의 인플루언서 드라마와 16세기 튜더 왕실의 피비린내 나는 정치적 암투를 완벽하게 등치시킨다.", "종교개혁(Reformation)과 헨리의 성적 무능(Impotence): 캐서린과의 이혼을 교황이 불허하자 헨리가 로마 바티칸과 결별하고 스스로 수장이 되어 영국 성공회(C of E, Church of England)를 세운 거대한 역사적 사건을 'C of E를 시동 걸었다'며 깃털처럼 가볍게 묘사한다. 한편 앤이 침실에서 헨리의 발기부전(impotence)과 성적 무능을 비웃었다는 일화('If you could get it up')를 노골적으로 폭로하며 헨리의 치졸한 남성성과 분노를 폭발시킨다.", "최고의 이중 언어유희 ('Don't lose your head'): 제목이자 후렴구인 'Don't lose your head'는 영어 관용구로 '흥분하지 마라, 이성을 잃지 마라'는 뜻이지만, 1536년 5월 19일 런던탑에서 프랑스 칼잡이에게 참수형(beheading)을 당한 앤 불린의 물리적 운명을 가리키는 소름 돋는 블랙코미디다. 또한 프랑스 샌드위치 체인이자 프랑스어로 '먹을 준비가 된'을 뜻하는 'prêt à manger'를 통해 왕의 구애에 넘어간 자신을 빗대는 등 위트 넘치는 언어유희가 압권이다."], "stanzas": [{"key": "4:1", "speaker_kr": "앤 불린", "speaker_en": "Anne Boleyn", "lines_en": ["Grew up in the French court", "Oui oui bonjour", "Life was a chore", "So"], "lines_kr": ["프랑스 왕실 궁정에서 우아하게 자랐지", "위, 위, 봉주르~", "인생이 너무 따분하고 지루해서", "그래서"]}, {"key": "4:2", "speaker_kr": "앙상블", "speaker_en": "Ensemble", "lines_en": ["She set sail"], "lines_kr": ["잉글랜드로 돛을 올렸지!"]}, {"key": "4:3", "speaker_kr": "앤 불린", "speaker_en": "Anne Boleyn", "lines_en": ["1522 came straight to the UK", "All the British dudes lame"], "lines_kr": ["1522년 영국 땅에 곧장 상륙했어", "근데 영국 놈들은 하나같이 찌질하고 노잼"]}, {"key": "4:4", "speaker_kr": "앙상블", "speaker_en": "Ensemble", "lines_en": ["Epic fail!", "Ooh"], "lines_kr": ["완전 쌉노답 대폭망!", "오오~"]}, {"key": "4:5", "speaker_kr": " 견되어 귀족 여성들의 초상화를 그렸던 역사적 사건을 바탕으로 합니다. 뮤지컬 《SIX》는 이 일화를 베를린의 하이패션 뷰티 살롱이자 광란의 언더그라운드 테크노 클럽인 '홀바인 하우스'로 재기발랄하게 탈바꿈시킵니다. 16세기 튜더 시대의 잔혹하고 위험천만한 미용 관습(치명적인 납 성분 백분, 9인치 개미허리를 위한 살인적인 코르셋, 탈색을 위한 극단적 비법 등)을 현대의 성형 집착 및 소셜 미디어 필터 문화에 빗대어 유쾌하면서도 신랄하게 풍자합니다. 클레베의 안나(앤 오브 클리브스)의 등장을 알리는 화려한 클럽 트랙으로 극의 분위기를 단숨에 반전시킵니다.", "notes": ["음악적 영감: 독일과 북유럽의 강렬하고 중독적인 유로비트(Euro-techno/EDM)와 바이에른 민속 요들 리듬의 변형을 결합한 파티 트랙입니다. 과장된 독일어 억양과 'Ja, das ist gut', 'wunderbar' 같은 유쾌한 독일어 감탄사들이 쉴 새 없이 교차하며 마치 베를린 클럽 한가운데 서 있는 듯한 폭발적인 댄스 비트를 형성합니다.", "역사적 튜더 배경: 궁정 화가 한스 홀바인은 클레베의 안나를 헨리 8세의 마음에 들도록 실물보다 훨씬 이상화되고 우아하게 그렸습니다(일종의 16세기 뷰티 필터). 헨리 8세는 이 초상화만 보고 반해 청혼했으나 실제로 잉글랜드에 도착한 안나를 대면한 뒤 크게 실망하며 '플랑드르 암말 같다'고 불평했습니다. 곡에서는 당시 미모를 위해 납 독(lead poison)을 얼굴에 바르고, 9인치 허리를 위해 뼈를 으스러뜨리며, 머리를 금발로 염색하기 위해 방광에서 나온 물질(오줌)까지 발랐던 그로테스크한 16세기 미용법을 위트 있게 폭로합니다.", "언어유희 및 패러디: 제목 'Haus of Holbein'은 레이디 가가의 크리에이티브 팀 'Haus of Gaga'를 패러디한 것이며, 'turn this vier into a nine'에서는 독일어 숫자 4(vier, 영어의 fear와 유사한 발음)를 외모 점수 9점 만점의 여신으로 만들어 준다는 이중 언어 워드플레이를 구사합니다. 뒤이어 'So just say ja and don't say nein'에서 독일어 'nein(아니오)'과 영어 'nine(숫자 9)'의 동음이의어 라임이 기막히게 맞물립니다.", "극적 기능과 무대 연출: 네온 선글라스와 야광 러프(ruff, 16세기 목 주름 깃), 화려한 형광 조명이 무대를 가득 채우며 관객들을 16세기 궁정에서 21세기 EDM 페스티벌로 순간 이동시키는 시각적·청각적 전환점의 역할을 수행합니다."], "stanzas": [{"key": "6:1", "speaker_kr": "여섯 왕비 전원", "speaker_en": "All Queens", "lines_en": ["Welcome to the house", "To the Haus of Holbein", "Ja, ooh ja, das ist gut", "Ooh ja, ja", "The Haus of Holbein", "Hans Holbein goes around the world", "Painting all of the beautiful girls", "From Spain, to France", "And Germany", "The king chooses one", "But which one will it be?", "You bring the corsets", "We'll bring the cinches", "No one wants a waist over nine inches", "So what the make up contains lead poison?", "At least your complexion will bring all the boys in", "Ignore the fear and you'll be fine", "We'll turn this vier into a nine", "So just say 'ja' and don't say 'nein'", "'Cause now you're in the house", "In the Haus of Holbei     let currentSongId = 1;
    let currentMode = 'bilingual';

    function init() {
      renderSongList();
      loadSong(1);
    }

    function setViewMode(mode) {
      currentMode = mode;
      document.getElementById('btnBilingual').classList.toggle('active', mode === 'bilingual');
      document.getElementById('btnKr').classList.toggle('active', mode === 'kr');
      document.getElementById('btnEn').classList.toggle('active', mode === 'en');
      
      const content = document.getElementById('songContent');
      content.className = 'song-content';
      if (mode === 'kr') content.classList.add('mode-kr-only');
      if (mode === 'en') content.classList.add('mode-en-only');
    }

    function renderSongList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('songListContainer');
      container.innerHTML = '';

      songsData.forEach(s => {
        if (query) {
          const matchTitle = s.title.toLowerCase().includes(query) || s.title_kr.toLowerCase().includes(query);
          const matchLyric = s.stanzas.some(st => st.lines_en.some(l => l.toLowerCase().includes(query)) || st.lines_kr.some(l => l.toLowerCase().includes(query)));
          if (!matchTitle && !matchLyric) return;
        }

        const item = document.createElement('div');
        item.className = 'song-item' + (s.id === currentSongId ? ' active' : '');
        item.onclick = () => loadSong(s.id);
        item.innerHTML = `
          <div class="song-num">SIX · Track ${String(s.id).padStart(2, '0')}</div>
          <div class="song-title">${s.title}</div>
          <div class="song-title-kr">${s.title_kr}</div>
        `;
        container.appendChild(item);
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarBackdrop').classList.toggle('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('open');
    }

    function loadSong(id) {
      currentSongId = id;
      closeSidebar();
      document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
      renderSongList();

      const song = songsData.find(s => s.id === id);
      if (!song) return;

      document.getElementById('topBarTrackInfo').textContent = `Track ${String(song.id).padStart(2, '0')} / 11`;

      let notesHtml = '';
      if (song.notes && song.notes.length > 0) {
        notesHtml = `
          <div class="notes-box">
            <h4>💡 감상 포인트 및 주석 (Key Notes & Pop Motifs)</h4>
            <ul>
              ${song.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      let stanzasHtml = '';
      song.stanzas.forEach(st => {
        let linesHtml = '';
        for (let idx = 0; idx < st.lines_en.length; idx++) {
          const en = st.lines_en[idx] || '';
          const kr = st.lines_kr[idx] || '';
          linesHtml += `
            <div class="lyric-pair">
              <div class="lyric-en">${en}</div>
              <div class="lyric-kr">${kr}</div>
            </div>
          `;
        }

        stanzasHtml += `
          <div class="stanza-block">
            <div class="speaker-tag">${st.speaker_kr} (${st.speaker_en})</div>
            ${linesHtml}
          </div>
        `;
      });

      const html = `
        <div class="song-header">
          <h2>${String(song.id).padStart(2, '0')}. ${song.title} <span class="kr-title">${song.title_kr}</span></h2>
        </div>
        <div class="synopsis-box">
          <strong>📖 장면 및 역사적 배경:</strong> ${song.synopsis}
        </div>
        ${notesHtml}
        <div class="lyrics-section">
          ${stanzasHtml}
        </div>
      `;

      const content = document.getElementById('songContent');
      content.innerHTML = html;
      content.scrollTop = 0;
    }

    window.onload = init;
  </script>
